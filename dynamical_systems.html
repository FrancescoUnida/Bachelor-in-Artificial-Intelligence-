  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #08111a; color: #cdd9e5; font-family: 'Georgia', serif; font-size: 15px; }
    button { font-family: 'Georgia', serif; cursor: pointer; }

    /* ── Picker ── */
    #picker { position: fixed; inset: 0; background: #08111a; z-index: 10; display: flex; flex-direction: column; overflow-y: auto; }
    #picker-header { background: #0d1d2e; border-bottom: 1px solid #1a3048; padding: 24px 36px; }
    #picker-header h1 { font-size: 20px; color: #e0ecfa; margin-bottom: 4px; }
    #picker-header p { font-size: 13px; color: #4a6a80; }
    #picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 32px 36px; }
    .lec-card { background: #0d1825; border: 1px solid #1a3048; border-radius: 10px; padding: 20px 22px; cursor: pointer; transition: border-color 0.18s, background 0.18s; }
    .lec-card:hover { background: #111e2d; border-color: #2a4a60; }
    .lec-num { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .lec-title { font-size: 15px; color: #c8dce8; line-height: 1.4; margin-bottom: 4px; }
    .lec-sub { font-size: 12px; color: #4a6a80; margin-top: 6px; }

    /* ── Viewer ── */
    #viewer { position: fixed; inset: 0; background: #08111a; z-index: 20; display: none; flex-direction: column; }
    #viewer-topbar { height: 44px; background: #060e17; border-bottom: 1px solid #1a3048; display: flex; align-items: center; padding: 0 16px; gap: 14px; flex-shrink: 0; }
    #back-btn { padding: 6px 16px; background: #0d1825; border: 1px solid #1a3048; border-radius: 6px; color: #7eb8f7; font-size: 13px; cursor: pointer; }
    #back-btn:hover { background: #111e2d; }
    #viewer-label { font-size: 13px; color: #4a6a80; }
    #lecture-frame { flex: 1; width: 100%; border: none; background: #08111a; }
  </style>
</head>

];


let currentBlobUrl = null;

function buildPicker() {
  const grid = document.getElementById('picker-grid');
  LECTURES.forEach((lec, i) => {
    const card = document.createElement('div');
    card.className = 'lec-card';
    card.style.borderTop = `3px solid ${lec.accent}`;
    card.innerHTML = `
      <div class="lec-num" style="color:${lec.accent}">Lecture ${lec.num}</div>
      <div class="lec-title">${lec.title}</div>
      <div class="lec-sub">${lec.subtitle}</div>`;
    card.addEventListener('click', () => openLecture(i));
    grid.appendChild(card);
  });
}

function openLecture(i) {
  const lec = LECTURES[i];
  // Revoke previous blob URL to free memory
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }

  const bytes = Uint8Array.from(atob(LECTURE_B64[i]), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'text/html' });
  currentBlobUrl = URL.createObjectURL(blob);

  const frame = document.getElementById('lecture-frame');
  frame.src = currentBlobUrl;

  document.getElementById('viewer-label').textContent = `Lecture ${lec.num} — ${lec.title}`;
  document.getElementById('picker').style.display = 'none';
  document.getElementById('viewer').style.display  = 'flex';
}

function goToPicker() {
  const frame = document.getElementById('lecture-frame');
  frame.src = 'about:blank';
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  document.getElementById('viewer').style.display  = 'none';
  document.getElementById('picker').style.display  = 'flex';
}

buildPicker();
</script>
