        content: `A **single-compartment model** describes the membrane potential of a neuron by a single variable V.

The core equation is simply a current balance: the rate of charge buildup on the membrane capacitance equals all the current entering the neuron:

  C_m · dV/dt = dQ/dt

Dividing by the surface area A:

  c_m · dV/dt = −i_m + I_e/A

Where:
- *c_m* = specific membrane capacitance
- *i_m* = total membrane current density (from all conductances)
- *I_e* = externally injected electrode current

**Components of membrane current i_m** come from all conductances present:
- *g_L* (leak/passive conductance) — always present
- *g_s* (synaptic conductances) — depend on activity of presynaptic neurons
- *g_1, g_2, ...* (voltage-dependent conductances) — active, voltage-gated channels

> ⚠️ The single-compartment assumption treats the whole neuron as if it were a single isopotential sphere — valid when the neuron is electrotonically compact, but breaks down for large or complex morphologies.`,

        title: "The Leaky Integrate-and-Fire Model",
        content: `The **integrate-and-fire (IF) model** simplifies by not explicitly modeling the biophysical mechanisms of action potentials.

**Rule**: fire an action potential whenever V reaches threshold V_th (~−55 to −50 mV), then immediately reset V to V_reset < V_th.

Proposed by **Lapicque in 1907**, decades before Hodgkin and Huxley.

**Simplest version — the leaky (passive) integrate-and-fire model**: all active conductances are ignored, leaving only a passive leak (RC circuit):

  c_m · dV/dt = −ḡ_L(V − E_L) + I_e/A

Multiplying by r_m = 1/g_L:

  τ_m · dV/dt = E_L − V + R_m I_e

**Key properties**:
- When I_e = 0: V relaxes exponentially with τ_m toward E_L
- Action potentials are not simulated — they are *pasted* onto the V trajectory whenever it crosses V_th
- Typical parameters: E_L = V_reset = −65 mV, V_th = −50 mV, τ_m = 10 ms, R_m = 10 MΩ

> ⚠️ The leaky IF model is computationally cheap and analytically tractable, but it ignores all active channel dynamics.`,

        title: "Subthreshold Solution & Firing Rate",
        content: `**With time-independent I_e**, the subthreshold membrane potential evolves as:

  V(t) = E_L + R_m I_e + (V(0) − E_L − R_m I_e) · exp(−t/τ_m)

As t → ∞: V approaches the **steady-state** value E_L + R_m I_e.

**Calculating the firing rate**: assume an action potential fires at t=0 (V(0) = V_reset). The next spike fires at t = t_isi when V(t_isi) = V_th:

  V_th = E_L + R_m I_e + (V_reset − E_L − R_m I_e) · exp(−t_isi/τ_m)

Solving for t_isi gives the ISI firing rate:

  r_isi = 1/t_isi = [τ_m · ln((R_m I_e + E_L − V_reset) / (R_m I_e + E_L − V_th))]⁻¹

**Firing condition**: r_isi > 0 only if R_m I_e > V_th − E_L; otherwise r_isi = 0.

**For large I_e**: using a linear approximation of the logarithm:

  r_isi ≈ [(E_L − V_th + R_m I_e) / (τ_m(V_th − V_reset))]₊

→ **Firing rate grows linearly with I_e** for large currents.`,

An additional K⁺ conductance g_sra is added, which hyperpolarizes the neuron:

  τ_m · dV/dt = E_L − V − r_m g_sra(V − E_K) + R_m I_e

  τ_sra · dg_sra/dt = −g_sra

Whenever the neuron fires: g_sra → g_sra + Δg_sra

This mimics the slow K⁺ current that reduces firing rate over time. Typical params: r_m Δg_sra = 0.06, τ_sra = 100 ms, E_K = −70 mV.

**Refractoriness** can be modeled in three ways:
1. *Simplest*: forbid firing for a fixed period after a spike (absolute refractory period)
2. *More realistic*: add a fast conductance (like SRA but faster + larger) that clamps V near E_K after each spike, then relaxes — producing both absolute and relative refractory periods
3. *Alternative*: raise the threshold V_th after each spike and let it relax back to its normal value

> ⚠️ A single IF model cannot simultaneously fit both the initial spike rate and the adapted steady-state rate — different sets of parameters are needed for each regime.`,

        title: "Single-Channel Stochastic Models",
        content: `Most interesting neuronal properties arise from **nonlinearities** of active membrane conductances.

Individual ion channels fluctuate randomly between **open** and **closed** states. The probability of a channel being open depends on:
- Membrane potential (for voltage-gated channels)
- Neurotransmitter presence (for synaptic channels)
- Intracellular messengers like Ca²⁺

**Stochastic channel models** use state diagrams with multiple closed and open states, connected by voltage-dependent transition rates.

Current through a single channel: i = ḡ · P · (V − E)

Where:
- *ḡ* = single-channel open conductance
- *P* = 1 (open) or 0 (closed)
- *E* = reversal potential

**Transition rates** are updated in small time steps Δt. As the number of channels increases, individual stochastic fluctuations average out and the total current converges to the deterministic Hodgkin-Huxley prediction.

Example: a K⁺ delayed-rectifier has **5 states** (4 closed + 1 open), corresponding to how many of its 4 subunit gates are open. The transition 1→2 is 4× faster than 4→5 because any of the four gates can open in state 1, but only one specific gate is needed to reach the open state from state 4.`,
      },
      {
        title: "Deterministic Conductance Models",
        content: `For large numbers of channels, we use **deterministic descriptions**:

  g_i = ḡ_i · P_i(t)

Where:
- *ḡ_i* = maximum conductance per unit area (all channels open), in mS/mm²
- *P_i(t)* = fraction of channels open at time t ≈ probability any one channel is open

**Persistent conductances** (e.g. delayed-rectifier K⁺):
Controlled by a single activation gate. Open = activation, close = deactivation. Open probability increases with depolarization.

With k identical independent subunit gates required to open:

  P_K = nᵏ

Where n (range 0–1) is the gating variable = probability of one subunit gate being open.

**Transient conductances** (e.g. fast Na⁺):
Controlled by both an activation gate (m) and an inactivation gate (h):

  P_Na = mᵏ · h

Depolarization → m increases (activation), h decreases (inactivation). Both must be nonzero for the conductance to be active.

**Special case — Hyperpolarization-activated conductances**: controlled solely by an inactivation gate. They open when the neuron is *hyperpolarized* rather than depolarized.`,

  closed → open at rate α_n(V)
  open → closed at rate β_n(V)

The gating variable n obeys:

  dn/dt = α_n(V)(1 − n) − β_n(V)n

This can be rewritten as:

  τ_n(V) · dn/dt = n_∞(V) − n

Where the **steady-state open probability** and **time constant** are:

  n_∞(V) = α_n(V) / (α_n(V) + β_n(V))

  τ_n(V) = 1 / (α_n(V) + β_n(V))

For a fixed voltage V, n approaches n_∞(V) exponentially with time constant τ_n(V).

**Physical basis of voltage dependence**: each gating transition requires moving an effective charge qBα through the membrane potential V, requiring energy qBαV. The probability of thermal fluctuations providing this energy is proportional to the Boltzmann factor exp(−qBαV/k_BT), giving:

  α_n(V) = A_α · exp(−B_α V/V_T)

The steady-state n_∞(V) is therefore a **sigmoidal function** of V.

**To activate a transient conductance maximally**: first hyperpolarize (raises h → deinactivation), then depolarize (raises m → activation). Both m and h must be nonzero simultaneously.`,

**Total membrane current**:

  i_m = ḡ_L(V − E_L) + ḡ_K n⁴(V − E_K) + ḡ_Na m³h(V − E_Na)

**Three equations** govern the dynamics:

  τ_n(V) · dn/dt = n_∞(V) − n   (K⁺ activation gate)

  τ_h(V) · dh/dt = h_∞(V) − h   (Na⁺ inactivation gate)

**Standard parameters**:

| Parameter | Value |
|---|---|

| ḡ_K | 0.36 mS/mm² |

| E_K | −77 mV |

> ⚠️ The HH model assumes Na⁺ activation (m) and inactivation (h) act *independently* — this is a simplification. More accurate state diagrams show state-dependent, voltage-independent inactivation, but the HH description is a good approximation for large channel numbers.`,

1. *m* suddenly jumps from ~0 toward ~1 (Na⁺ activation gates open rapidly)
2. *h* is initially around 0.6 (channels are not fully inactivated at rest)
3. For a brief moment both m and h are significantly > 0 → large Na⁺ influx → **m-V positive feedback loop**: V rising → more m → more Na⁺ current → V rises further
4. V rises rapidly to ~+50 mV (near E_Na)
5. *h* falls toward 0 → **inactivates the Na⁺ current**
6. *n* rises toward 1 → **K⁺ conductance activates** → K⁺ flows out
7. V returns to negative values (repolarization and hyperpolarization)

**Conductance-based models can be extended** with additional currents. Adding an **A-current** (transient K⁺):

  i_m += ḡ_A a³b(V − E_A)

The A-current delays the first action potential, making the firing rate rise **continuously from 0** as I_e increases beyond threshold. Without the A-current, the firing rate jumps **discontinuously** at threshold.`,

      {
        title: "Why Multi-Compartment?",
        content: `Single-compartment models assume the neuron is **isopotential** — the same voltage everywhere. This breaks down for real neurons because:

- Voltage **attenuates** as it travels along dendrites (exponentially with distance)
- There is a **delay** between when a signal arrives at a dendrite tip and when it reaches the soma
- Different dendritic branches can process signals semi-independently

**Multi-compartment models** divide the neuron into discrete regions (compartments), each with its own membrane potential V_μ. Compartments are connected by **resistive couplings** g_μ,μ' that approximate current flow between adjacent regions.

The continuous membrane potential V(x, t) is approximated by a discrete set V_μ.

**The morphoelectrotonic transform** visualizes these effects:
- *Attenuation panel*: distances scaled by log(steady-state attenuation) — farther from soma = more attenuation
- *Delay panel*: distances scaled by the inward delay for a peripheral current pulse

> ⚠️ A neuron that appears electrotonically compact for static (DC) current injection may be *not compact* for high-frequency inputs, because the capacitance of the membrane cable increases attenuation with frequency.`,
      },
      {
        title: "The Cable Equation",
        content: `For a cylindrical cable segment of radius *a* and length Δx:

**Capacitive current**: the segment has surface area 2πaΔx, giving capacitance 2πaΔx·c_m. The current needed to change V at rate ∂V/∂t is 2πaΔx·c_m·∂V/∂t.

**Longitudinal (axial) current**: flows in from the left and out to the right, proportional to the voltage gradient ∂V/∂x.

Combining these with the membrane current i_m gives the **cable equation**:

  c_m · ∂V/∂t = (1/2ar_L) · ∂/∂x(a² · ∂V/∂x) − i_m + i_e

**Boundary conditions**:
- *At a branching node*: V must be continuous across the branch
- *At a branching node*: charge must be conserved (sum of all longitudinal currents entering = 0)
- *At a terminal node*: no current flows out of the end (∂V/∂x = 0)

**Discretized form** for compartment μ in a nonbranching cable:

  c_m · dV_μ/dt = −i_m^μ + I_e^μ/A_μ + g_μ,μ+1(V_μ+1 − V_μ) + g_μ,μ−1(V_μ−1 − V_μ)

Branching compartments have three coupling terms instead of two.

Due to complex morphologies and membrane currents, the cable equation is usually solved **numerically** using tools like the NEURON simulation package.`,

**From simplest to most detailed**:
1. Leaky integrate-and-fire (1 ODE, no active conductances)
2. IF with adaptation (2 ODEs)
3. Single-compartment Hodgkin-Huxley (4 ODEs: V, m, h, n)
4. Conductance-based with additional channels (5+ ODEs)
5. Multi-compartment models (potentially thousands of ODEs)

**Adding more compartments** captures:
- Dendritic computation and signal integration
- Location-dependent synaptic effects
- Active dendritic conductances (e.g. Ca²⁺ spikes in dendrites)
- Realistic propagation velocities

**Choosing model complexity**: requires careful assessment of the experimental data available and clear understanding of research goals:

- *Oversimplified models* → misleading results (important dynamics missed)
- *Excessively detailed models* → interesting results obscured under unconstrained complexity

> ⚠️ The right level of abstraction depends on the question being asked. A leaky IF model may be sufficient for network-level questions, while a multi-compartment HH model may be needed to study dendritic integration.`,

function renderMarkdown(text, topicColor) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

    </div>`;

  if (activeTab === "learn") {
    html += `<div style="display:flex;height:calc(100vh - 65px)">
      <!-- Sidebar -->
      <div style="width:215px;background:#0a1825;border-right:1px solid #1a3048;overflow-y:auto;flex-shrink:0">`;

    topics.forEach(topic => {
      const isActive = activeTopic === topic.id;
      html += `<div>
        <button onclick="selectTopic('${topic.id}')" style="width:100%;padding:13px 16px;text-align:left;border:none;cursor:pointer;background:${isActive?'#111e2d':'transparent'};border-left:${isActive?`3px solid ${topic.color}`:'3px solid transparent'};color:${isActive?'#e0ecfa':'#5a7a96'};display:flex;gap:8px;align-items:center;font-size:13px">
          <span>${topic.icon}</span><span style="flex:1;line-height:1.3">${topic.label}</span>
        </button>`;
      if (isActive) {
        topic.sections.forEach((s, i) => {
          html += `<button onclick="selectSection(${i})" style="width:100%;padding:8px 16px 8px 36px;text-align:left;border:none;cursor:pointer;background:${activeSection===i?'#132030':'transparent'};color:${activeSection===i?topic.color:'#4a6a80'};font-size:12px;line-height:1.3">${s.title}</button>`;
        });
      }
      html += `</div>`;
    });

    html += `</div>
      <!-- Content -->
      <div style="flex:1;overflow-y:auto;padding:32px 44px">`;

    if (currentSec) {
      html += `
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${currentTopic.color};margin-bottom:8px">${currentTopic.icon} ${currentTopic.label}</div>
        <h1 style="font-size:23px;color:#e8f0f8;margin-bottom:22px;border-bottom:1px solid #1a3048;padding-bottom:14px">${currentSec.title}</h1>
        <div style="line-height:1.85;max-width:740px">${renderMarkdown(currentSec.content, currentTopic.color)}</div>
        <div style="display:flex;gap:12px;margin-top:44px">`;

      if (activeSection > 0) {
        html += `<button onclick="selectSection(${activeSection-1})" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`;
      }
      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div>`;
    }

    html += `</div></div>`;
  }

  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px">
      <div style="margin-bottom:22px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:270px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:36px 34px;cursor:pointer;transition:background 0.25s;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':'#c0392b'};margin-bottom:16px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:16px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:22px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:28px">
        <button onclick="prevCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:450px">
        ${flashcards.map((_, i) => `<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?'#c0392b':'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function switchTab(tab) { activeTab = tab; render(); }
function selectTopic(id) { activeTopic = id; activeSection = 0; render(); }
function selectSection(i) { activeSection = i; render(); }
function flipCard() { flipped = !flipped; render(); }
function prevCard() { cardIndex = (cardIndex - 1 + flashcards.length) % flashcards.length; flipped = false; render(); }
function nextCard() { cardIndex = (cardIndex + 1) % flashcards.length; flipped = false; render(); }
function goToCard(i) { cardIndex = i; flipped = false; render(); }

render();
</script>
</body>
</html>
