const topics = [

    id: "decoding_intro",
    label: "Neural Decoding: Intro",
    color: "#1a6b9a",
    icon: "🔍",
    sections: [
      {
        title: "Encoding vs. Decoding",
        content: `**Encoding** is the prediction of neural responses to known stimuli.

**Decoding** is the opposite: estimating the information content of neuronal spike trains, i.e. inferring what is happening in the real world from neuronal spiking patterns.

**Why probability theory?**
- Neural responses, even to a single repeated stimulus, are typically described by *stochastic models* due to their inherent variability
- Stimuli themselves are often described stochastically (statistical properties of complex environments)

Decoding involves both **single neurons** and **neuronal populations**.

**Discrimination** is a special case of decoding in which only a few different stimulus values are considered.

A more general problem is the **extraction of a continuous stimulus parameter** from one or more neuronal responses.`
      },
      {
        title: "Probability Theory: Bayes' Theorem",
        content: `Let **r** = (r₁, r₂, …, rₙ) for N neurons be a list of spike-count firing rates.

**Key probability quantities**:

| Notation | Meaning |
|---|---|
| P[s] | Prior probability of stimulus s being presented |
| P[r] | Probability of response r being recorded (independent of stimulus) |
| P[r, s] | Joint probability: stimulus s presented AND response r recorded |
| P[r\|s] | Conditional probability of response r given stimulus s was presented |
| P[s\|r] | Conditional probability that stimulus s was presented, given response r was recorded |

**Key relationships**:

  P[r] = Σₛ P[r|s] P[s]
  P[s] = Σᵣ P[s|r] P[r]
  P[r, s] = P[r|s] P[s] = P[s|r] P[r]

**Bayes' Theorem** (with P[r] ≠ 0):

  P[s|r] = ( P[r|s] · P[s] ) / P[r]

**Decoding** a response means determining P[s|r], which requires knowledge of the statistical properties of stimuli P[s].`
      },
      {
        title: "Interpreting Bayes' Theorem in Neuroscience",
        content: `The probability **P[s|r]** of recognizing stimulus s(t) given a specific spike train **r**:

- **Increases** with P[r|s] — the probability that a specific r was caused by s(t)
- **Increases** with P[s] — the prior probability that stimulus s(t) occurs
- **Decreases** with P[r] — the probability that r occurs independently from s(t)

> ⚠️ The Bayes theorem is a fundamental law with many applications. In this context, it defines the probability that a certain neuron recognizes a stimulus among a certain distribution of possible stimuli.

**Discrete vs. continuous representations**:
- If stimulus and response take *discrete values* → use ordinary probabilities
- If firing rates or stimulus values are *continuous* → use probability densities`
      }
    ]
  },
  {
    id: "single_cell",
    label: "Single-Cell Decoding",
    color: "#8e44ad",
    icon: "🎯",
    sections: [
      {
        title: "Discrimination: Two-Stimulus Case",
        content: `**Discrimination** is a special form of decoding where only two stimulus values are compared.

**Experiment (Britten et al., 1992)** — motion direction detection in monkeys:
- Task: detect the movement direction of a moving *random-dot stimulus*
- The visual image consists of randomly placed dots that jump every 45 ms
- *0% coherence*: all dots move randomly
- *50% coherence*: half the dots move randomly, half move together
- *100% coherence*: all dots move in the same direction

**Two types of measurements** on the monkey:
- **Neural**: recordings from the visual cortical area *Middle-Temporal (MT)*
- **Behavioral**: the monkey reports the motion direction in a *two-alternative forced-choice* task (preferred direction of the recorded neuron, or the opposite)

**Results**:
- Below 1% coherence → performance near chance (fraction correct = 0.5)
- Perfect performance above 10% coherence (fraction correct = 1.0)
- The neuron fires more spikes when motion is in its *preferred (+) direction* (hatched histogram) than in the *null (−) direction* (solid histogram)
- At high coherence: the two firing-rate distributions are well separated; at low coherence: they merge`
      },
      {
        title: "Discriminability and ROC Analysis",
        content: `The two firing-rate distributions are approximately **Gaussian with the same variance σᵣ²** but different means ⟨r⟩₊ and ⟨r⟩₋.

**Discriminability (d')**:

  d' = ( ⟨r⟩₊ − ⟨r⟩₋ ) / σᵣ

A threshold z is used to decide which stimulus was presented:
- **β(z)** = P[r ≥ z | +] — hit rate ("power"): correct answer for a + stimulus
- **α(z)** = P[r ≥ z | −] — false alarm rate ("size"): incorrect answer for a − stimulus

| Stimulus | Correct | Incorrect |
|---|---|---|
| + | β | 1 − β |
| − | 1 − α | α |

**Threshold extremes**:
- z = 0 → always r ≥ z → always answer "plus" → α = β = 1
- z very large → always r < z → α = β = 0

**Ideal threshold**: z such that α → 0 and β → 1`
      },
      {
        title: "ROC Curves and Performance",
        content: `The **Receiver Operating Characteristic (ROC) curve** evaluates how test performance depends on threshold z.

Each curve is the locus of points (α(z), β(z)) for all z values. The values of α and β are computed from histograms.

**Interpretation**:
- *High coherence (easy task)*: the ROC curve rises rapidly → β quickly approaches 1 without much increase in α → the curve bows far into the upper-left corner
- *Low coherence (hard task)*: the curve rises more slowly as z is lowered
- *Impossible task (random answers)*: the curve lies along the diagonal α = β

**Area under the ROC curve** ↔ level of performance on the task.

**Two-alternative forced-choice** task (to remove threshold dependency):
- Stimulus presented twice: once in the + direction, once in the − direction
- Task: decide which presentation was + given firing rates r₁ and r₂
- Rule: answer "trial 1" if r₁ ≥ r₂, otherwise "trial 2"
- The value of r on one trial serves as the threshold for the other trial`
      }
    ]
  },
  {
    id: "population_decoding",
    label: "Population Decoding",
    color: "#27ae60",
    icon: "🧩",
    sections: [
      {
        title: "Population Coding: Overview",
        content: `**Population decoding** uses the responses of large numbers of neurons simultaneously.

Individual neurons in such a population typically have **different but overlapping selectivities**, so that many neurons (but not necessarily all) respond to a given stimulus.

**Advantages of population coding**:
- Reduction of uncertainty due to neuronal variability
- Ability to represent a number of different stimulus attributes simultaneously

From the response of a single neuron p[r|s] we can generalize to p[**r**|s], the conditional probability density of the **population response** r.`
      },
      {
        title: "Cricket Cercal System: Example",
        content: `The **cercal system** of the cricket senses the direction of incoming air currents — a warning of approaching predators. It is a classic example of population coding with a small number of neurons.

- Each cercal hair is attached to a neuron that fires when the hair is deflected
- Thousands of primary sensory neurons send axons to a set of **interneurons**
- Interneurons **collectively encode wind direction** as a population

**Tuning curves** of the four low-velocity interneurons:
- Described as a *half-wave rectified cosine function*:

  (f(s) / rmax)ₐ = [cos(s − sₐ)]₊

- Preferred directions of the four neurons are located **90° from each other**
- rmax values are typically around **40 Hz**; wind speed was held constant

**Vector representation**:
- Wind direction: spatial vector **v** of unit length (|**v**| = 1)
- Preferred wind direction for neuron a: vector **cₐ** of unit length

  (f(s) / rmax)ₐ = [**v** · **cₐ**]₊

This is the half-wave rectified projection of the wind direction vector onto the preferred-direction axis of the neuron.`
      },
      {
        title: "Population Vector Decoding",
        content: `**Population Decoding via the population vector**:

If rₐ is the spike-count firing rate of neuron a, an estimate of the wind direction on any given trial can be obtained from the direction of the **population vector**:

  **v**pop = Σₐ (r / rmax)ₐ **cₐ**

Each neuron contributes its preferred direction vector **cₐ**, weighted by its normalized firing rate.

**Application to arm movements (M1, primary motor cortex)**:
- Thousands of M1 neurons have arm-movement-related tuning curves (related to direction, velocity, acceleration…)
- Tuning curves of certain M1 neurons in the monkey can be described by cosine functions:

  ((⟨r⟩ − r₀) / rmax)ₐ = **v** · **cₐ**

- M1 neurons do *not* have orthogonal preferred directions (unlike the cricket)
- But with all directions covered with roughly equal probability and large N:

  **v**pop (averaged over trials) is approximately parallel to the arm movement direction vector **v**

> ⚠️ The population vector reconstructs the actual movement direction fairly accurately — even without an orthogonal coordinate system.`
      }
    ]
  },
  {
    id: "optimal_decoding",
    label: "Optimal Decoding Methods",
    color: "#c0392b",
    icon: "⚙️",
    sections: [
      {
        title: "Beyond the Vector Method",
        content: `The **vector method** is a simple decoding method but is not always general or optimal for reconstructing a stimulus from the firing rates of a population of neurons.

Two more principled methods are:
- **Bayesian inference**
- **Maximum a posteriori (MAP)** and **maximum likelihood (ML)** inference

All these methods use the conditional probability that a stimulus parameter takes a value between s and s + Δs, given that the N encoding neurons fired at rates **r**:

  p[s|r] = ( p[r|s] · p[s] ) / p[r]

> ⚠️ Note: extracting p[s|r] from experimental data can be difficult.`
      },
      {
        title: "Bayesian Inference",
        content: `**Bayesian inference** is based on the minimization of a particular *loss function* L(s, s_bayes).

The Bayesian estimate s_bayes is chosen to **minimize the expected loss** averaged over all stimuli for a given set of rates:

  minimize: ∫ds L(s, s_bayes) p[s|r]

**Squared-error loss function**:
If L(s, s_bayes) = (s − s_bayes)², the estimate that minimizes the expected loss is:

  s_bayes = ∫ds p[s|r] · s

This is the **mean (expected value) of the posterior distribution** p[s|r] — the center of mass of the posterior.

Different loss functions lead to different optimal estimators (e.g. median minimizes absolute error).`
      },
      {
        title: "MAP and Maximum Likelihood (ML) Inference",
        content: `**Maximum a posteriori (MAP) inference** does not involve a loss function. Instead, it simply chooses the stimulus value s_MAP that **maximizes the conditional probability density**:

  s_MAP = argmax p[s|r]

**Special case — uniform prior**:
If the prior p[s] is independent of s (uniform), the MAP algorithm is equivalent to **maximizing the likelihood function** (ML inference):

  s_ML = argmax p[r | s_ML]

**Comparison of MAP/ML vs. Bayesian (for the cercal system)**:
- Error is measured as root-mean-squared difference between true (s) and estimated (sₑₛₜ) wind directions
- Both methods show periodic *dips* in the error curves
- Dips occur at angles where one tuning curve peaks and two others rise from threshold
- Neurons are most sensitive where their tuning curves have maximum slopes — near threshold

> ⚠️ ML and Bayesian methods give similar performance when the prior is flat; they diverge when the prior is non-uniform.`
      },
      {
        title: "General Case: Gaussian Tuning Curves",
        content: `For the **more general case** of decoding an arbitrary continuous stimulus parameter, consider an array of **Gaussian tuning curves**:

  f_a(s) = rmax · exp( −½ · ((s − sₐ) / σₐ)² )

**Array properties**:
- Peak values of the tuning curves fall on integer values of s (from −5 to 5)
- All tuning curves have σₐ = 1
- The sum of all tuning curves across the array is **approximately flat** (≈ 0.5), meaning it is approximately independent of s

This property ensures that any stimulus value in the range is represented equally well by the population, making decoding feasible and approximately unbiased across the stimulus range.`
      }
    ]
  },
  {
    id: "spike_train",
    label: "Spike-Train Decoding",
    color: "#e67e22",
    icon: "📈",
    sections: [
      {
        title: "From Static to Dynamic Stimuli",
        content: `The decoding methods discussed so far estimate or discriminate **static stimulus values** on the basis of spike-count firing rates.

**Problem**: spike-count firing rates do not provide sufficient information for reconstructing a **stimulus that varies during the course of a trial**.

To decode a time-varying stimulus s(t), we need to construct an estimate of the stimulus at time t **from the sequence of spikes** evoked up to that time.

**Summary of decoding approaches**:
- *Discrimination between stimulus values* — single-cell, binary
- *Decoding of static stimuli from population responses* — population vector, MAP, ML, Bayesian
- *Decoding of dynamic stimulus parameters from spike trains* — uses spike timing, not just rate`
      },
      {
        title: "The Decoding Kernel",
        content: `**Spike-train decoding** uses a *prediction delay* τ₀ to construct an estimate of the stimulus at time t − τ₀ from spikes occurring prior to time t.

The estimate uses a **decoding kernel K(τ)**:

  ŝ(t − τ₀) = Σᵢ K(t − tᵢ)

where the sum runs over all spike times tᵢ < t.

**Two types of contributing spikes**:
- *Spikes that could have been caused by s(t − τ₀)*: those for which t − τ₀ < tᵢ < t (e.g. spike 7)
- *Earlier spikes* (tᵢ < t − τ₀): these occurred too early to be directly caused by s(t − τ₀), but can contribute to estimation through *stimulus correlations*

> ⚠️ Increasing τ₀ makes the estimation task easier, but **delays the decoding** and makes the result less behaviorally relevant.`
      },
      {
        title: "Decoding from the Fly H1 Neuron",
        content: `A classic example of spike-train decoding: the **H1 neuron** of the fly, which encodes visual motion.

**Setup**:
- Decoding kernel with τ₀ = 40 ms
- Two stimuli presented: s(t) and −s(t) (reverse polarity)

**Results**:
- The H1 neuron responds differently to s(t) and −s(t) — typical neuronal responses are shown as spike trains
- The **optimal linear reconstruction** (solid line) tracks the actual stimulus (dashed line) remarkably well
- The kernel K(τ) has a characteristic biphasic shape, peaking around 0–50 ms and having a negative lobe around 100 ms

**Key insight**: even a single neuron's spike train carries substantial information about a continuously varying stimulus, when decoded with an appropriate kernel.`
      }
    ]
  }
];

  { q: "Why do dips appear in the error curves for MAP/ML decoding of the cercal system?", a: "Dips occur at angles where one tuning curve peaks and two others rise from threshold. Neurons are most sensitive (highest slope) near threshold, so the population encodes those directions most precisely, leading to lower decoding error at those angles." },
  { q: "What is a Gaussian tuning curve array and what property ensures uniform decoding?", a: "f_a(s) = rmax · exp(−½ · ((s − sₐ)/σₐ)²). When curves are evenly spaced and overlap sufficiently, their sum is approximately flat — meaning the total population activity is approximately independent of s, ensuring any stimulus value is represented equally well." },
  { q: "Why are spike-count firing rates insufficient for decoding time-varying stimuli?", a: "Spike-count rates summarize activity over a fixed time window and discard timing information. A stimulus that varies continuously during a trial requires the precise timing of individual spikes (spike trains) to reconstruct the time course of the stimulus." },
  { q: "What is a decoding kernel and how does it work?", a: "A decoding kernel K(τ) convolves with the spike train to estimate the stimulus: ŝ(t − τ₀) = Σᵢ K(t − tᵢ). It uses spikes that could have been caused by the target stimulus value (within τ₀ window) and earlier spikes that contribute via stimulus correlations." },
  { q: "What is the trade-off with increasing the prediction delay τ₀ in spike-train decoding?", a: "Increasing τ₀ makes decoding easier (more spikes available, less real-time pressure) but delays the result and makes it less behaviorally relevant. There is a trade-off between decoding accuracy and temporal immediacy." }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let activeTab = "learn";
let activeTopic = topics[0].id;
let activeSection = 0;
let cardIndex = 0;
let flipped = false;

// ─── RENDERING ───────────────────────────────────────────────────────────────
function getCurrentTopic() { return topics.find(t => t.id === activeTopic); }
function getCurrentSection() { return getCurrentTopic()?.sections[activeSection]; }

function renderMarkdown(text) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  function flushTable() {
    if (tableRows.length === 0) { inTable = false; return; }
    html += `<table style="border-collapse:collapse;margin:14px 0"><tbody>`;
    tableRows.forEach((row, ri) => {
      html += `<tr>`;
      row.forEach(cell => {
        const style = ri === 0
          ? `border:1px solid #1e3a50;padding:6px 14px;color:#e0ecfa;background:#132d44;font-weight:bold;font-size:14px`
          : `border:1px solid #1e3a50;padding:6px 14px;color:#8bbcd8;font-size:14px`;
        html += `<td style="${style}">${cell}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    tableRows = [];
    inTable = false;
  }

  function processInline(line) {
    return line
      .replace(/\*\*(.*?)\*\*/g, `<strong style="color:#cce6ff">$1</strong>`)
      .replace(/\*(.*?)\*/g, `<em style="color:#9ac5e8">$1</em>`)
      .replace(/`(.*?)`/g, `<code>$1</code>`);
  }

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    const pl = processInline(line);

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      const color = getCurrentTopic()?.color || "#888";
      html += `<blockquote style="border-left:3px solid ${color};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${pl.replace(/^>\s?/, "").replace(/^>\s?⚠️\s?/, "⚠️ ")}</blockquote>`;
    } else if (line.startsWith("### ")) {
      html += `<h3 style="color:#e0ecfa;margin:18px 0 8px;font-size:16px">${pl.slice(4)}</h3>`;
    } else if (line.startsWith("## ")) {
      html += `<h2 style="color:#e0ecfa;margin:18px 0 8px;font-size:18px">${pl.slice(3)}</h2>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${pl.slice(2)}</li>`;
    } else if (/^\s{2,}/.test(line) && line.trim().length > 0) {
      // indented formula-like line
      html += `<div class="formula">${line.trim()}</div>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${pl}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

function buildSidebar() {
  const sidebar = document.getElementById("sidebar");
  let html = "";
  topics.forEach(topic => {
    const isTActive = topic.id === activeTopic;
    html += `<button class="topic-btn ${isTActive ? "active" : ""}"
      style="border-left:3px solid ${isTActive ? topic.color : "transparent"};color:${isTActive ? "#e0ecfa" : "#5a7a96"}"
      onclick="selectTopic('${topic.id}')">
      <span>${topic.icon}</span>
      <span style="flex:1;line-height:1.3">${topic.label}</span>
    </button>`;
    if (isTActive) {
      topic.sections.forEach((s, i) => {
        const isSActive = activeSection === i;
        html += `<button class="section-btn ${isSActive ? "active" : ""}"
          style="color:${isSActive ? topic.color : "#4a6a80"}"
          onclick="selectSection(${i})">${s.title}</button>`;
      });
    }
  });
  sidebar.innerHTML = html;
}

function buildContent() {
  const topic = getCurrentTopic();
  const section = getCurrentSection();
  if (!topic || !section) return;

  document.getElementById("topic-label").innerHTML =
    `<span style="color:${topic.color}">${topic.icon} ${topic.label}</span>`;
  document.getElementById("section-title").textContent = section.title;
  document.getElementById("section-body").innerHTML = renderMarkdown(section.content);

  const navEl = document.getElementById("nav-btns");
  let navHtml = "";
  if (activeSection > 0) {
    navHtml += `<button class="nav-btn-prev" onclick="selectSection(${activeSection - 1})">← Previous</button>`;
  }
  if (activeSection < topic.sections.length - 1) {
    navHtml += `<button class="nav-btn-next" style="background:${topic.color}" onclick="selectSection(${activeSection + 1})">Next →</button>`;
  } else {
    const idx = topics.findIndex(t => t.id === activeTopic);
    if (idx < topics.length - 1) {
      navHtml += `<button class="nav-btn-next" style="background:${topic.color}" onclick="selectTopic('${topics[idx+1].id}')">Next topic →</button>`;
    }
  }
  navEl.innerHTML = navHtml;
}

function buildFlashcard() {
  document.getElementById("card-counter").textContent = `Card ${cardIndex + 1} of ${flashcards.length}`;
  const box = document.getElementById("card-box");
  const label = document.getElementById("card-mode-label");
  const text = document.getElementById("card-text");
  const hint = document.getElementById("card-hint");

  if (flipped) {
    box.className = "answer";
    box.style.background = "#0d1e14";
    box.style.borderColor = "#1e5c34";
    label.className = "answer";
    label.textContent = "✓ Answer";
    text.className = "answer";
    text.textContent = flashcards[cardIndex].a;
    hint.style.display = "none";
  } else {
    box.className = "question";
    box.style.background = "#0d1825";
    box.style.borderColor = "#1a3048";
    label.className = "question";
    label.textContent = "? Question";
    text.className = "question";
    text.textContent = flashcards[cardIndex].q;
    hint.style.display = "block";
  }

  // Dots
  let dotsHtml = "";
  flashcards.forEach((_, i) => {
    dotsHtml += `<div class="dot ${i === cardIndex ? "active" : ""}" onclick="goToCard(${i})"></div>`;
  });
  document.getElementById("card-dots").innerHTML = dotsHtml;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  const learnView = document.getElementById("learn-view");
  const flashcardView = document.getElementById("flashcard-view");
  const btnLearn = document.getElementById("btn-learn");
  const btnFlash = document.getElementById("btn-flashcards");

  if (tab === "learn") {
    learnView.style.display = "flex";
    flashcardView.style.display = "none";
    btnLearn.className = "tab-btn active";
    btnFlash.className = "tab-btn inactive";
  } else {
    learnView.style.display = "none";
    flashcardView.style.display = "flex";
    btnLearn.className = "tab-btn inactive";
    btnFlash.className = "tab-btn active";
    buildFlashcard();
  }
}

function selectTopic(id) {
  activeTopic = id;
  activeSection = 0;
  buildSidebar();
  buildContent();
}

function selectSection(i) {
  activeSection = i;
  buildSidebar();
  buildContent();
  document.getElementById("content-area").scrollTop = 0;
}

function flipCard() {
  flipped = !flipped;
  buildFlashcard();
}

function changeCard(dir) {
  cardIndex = (cardIndex + dir + flashcards.length) % flashcards.length;
  flipped = false;
  buildFlashcard();
}

function goToCard(i) {
  cardIndex = i;
  flipped = false;
  buildFlashcard();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildSidebar();
buildContent();
</script>
</body>
</html>
