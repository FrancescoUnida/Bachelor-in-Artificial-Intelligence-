**Key structural components**:
- *Dendrites* → receive incoming signals from other neurons
- *Cell body (soma)* → contains the nucleus; integrates inputs
- *Axon* → long cable that carries signals away from the soma
- *Axon terminals* → release neurotransmitters onto target cells

**Biological neuron morphologies** vary enormously:
- **Pyramidal neuron** (cortex, hippocampus CA1) — tall, triangular soma with apical dendrite
- **Purkinje cell** (cerebellum) — massive, flat dendritic tree; highly branched
- **Motoneuron** (spinal cord) — large soma, long axon projecting to muscles
- **Stellate neuron** (neocortex) — star-shaped, local interneuron

**Spiking patterns**:
- *Tonic spiking* — sustained regular firing during input
- *Phasic spiking* — only fires at onset of input
- *Spike frequency adaptation* — firing rate decreases over time

**Bursting patterns**:
- *Tonic bursting* — repeated bursts during sustained input
- *Phasic bursting* — one burst at onset only

**Special behaviors**:
- *Subthreshold oscillations* — membrane voltage oscillates without spiking
- *Resonator* — responds preferentially to inputs at a specific frequency
- *Bistability* — two stable firing states for the same input
- *Inhibition-induced spiking* — paradoxically fires when inhibited

**Why does this diversity matter?** Different firing patterns allow neurons to encode information in different ways — rate coding, temporal coding, burst coding.`,

        content: `Neurons are bathed in solutions containing **ions** — charged atoms that carry current across the membrane.

**Key ion concentrations** (intracellular vs. extracellular):

| Ion | Inside | Outside |
|-----|--------|---------|
| K⁺  | 148 mM | 5 mM   |
| Na⁺ | 10 mM  | 142 mM |
| Ca²⁺| <1 μM  | 5 mM   |
| Cl⁻ | 4 mM   | 103 mM |

**Resting potential**: the inside of a neuron is **negatively charged** (~−70 mV) relative to the outside (defined as 0 V). This occurs because negative ions accumulate on the inner surface of the membrane.

**Membrane potential range**: −90 mV to +50 mV depending on ion channel activity.

The **Na/K ATPase pump** actively maintains these gradients by pumping 3 Na⁺ out and 2 K⁺ in for each ATP hydrolyzed.`,

**As a capacitor**:
- The lipid bilayer is **3–4 nm thick** and electrically insulating
- It separates two conducting solutions (intracellular and extracellular fluid)
- This structure acts like a parallel-plate capacitor
- Specific capacitance: *c_m ≈ 10 nF/mm²*; whole-cell C_m ≈ 0.1–1 nF

**As a resistor**:
- **Ion channels** (~10 nm long) are embedded in the membrane
- They lower effective membrane resistance by ~10,000× compared to a pure lipid bilayer
- Specific resistance: *r_m ≈ 1 MΩ·mm²*; whole-cell R_m typically 10–100 MΩ
- A typical neuron may have **dozens of different channel types**, with hundreds of thousands of individual channels
- Many channels are **highly selective** — allowing only one ion type through
- Channel conductance is modulated by: voltage, intracellular Ca²⁺, and neurotransmitters

**Total membrane current**: I_m = I_ionic + I_capacitive`,

        content: `Voltage-gated ion channels can exist in three states:

**Activated** (open) — voltage change opens the channel, allowing ion flow. Can be fast or slow.

**Inactivated** — ion flow is blocked by a mechanism *other* than simple closing (e.g. ball-and-chain model: a cytoplasmic peptide plugs the pore). Fast or slow inactivation.

**Deactivated** (closed) — channel returns to its resting closed conformation after activation ceases.

**Combination of channels determines neuronal behavior**:
- *REST*: K2p (open at rest) and Kir (inward rectifier) maintain resting potential
- *DEPOLARIZATION*: Nav (voltage-gated Na⁺) and Cav (voltage-gated Ca²⁺) open
- *REPOLARIZATION/HYPERPOLARIZATION*: Kv (voltage-gated K⁺) and KCa (Ca²⁺-activated K⁺) restore negative potential

> ⚠️ The **specific combination, density, and location** of ion channels determines a neuron's unique electrical fingerprint.`,

      {
        title: "What Is an Action Potential?",
        content: `An **action potential (AP)** — also called a *spike* — is the neuron's all-or-nothing electrical signal. It propagates along the axon to communicate with downstream neurons.

**Stages of an action potential**:
1. **Resting state** (~−70 mV): Na⁺ and K⁺ gates closed; K⁺ leak channels open
2. **Stimulus**: depolarizing current raises membrane potential
3. **Threshold** (~−55 mV): enough Na⁺ channels open → positive feedback begins
4. **Depolarization**: rapid Na⁺ influx drives V to ~+40 mV; Na⁺ gates then *close* (inactivate)
5. **Repolarization**: K⁺ channels open, K⁺ flows out, restoring negative potential
6. **Hyperpolarization (refractory period)**: K⁺ channels stay open briefly, V dips below rest (~−90 mV)
7. **Return to rest**: Na⁺/K⁺ pump restores ion gradients

**All-or-none principle**: either the threshold is crossed and a full AP fires, or nothing happens. Amplitude is constant — information is encoded in *rate* and *timing*.`,
      },
      {
        title: "Equilibrium & Reversal Potentials",
        content: `Each ion has an **equilibrium (reversal) potential E** — the membrane voltage at which the electrical force exactly balances the diffusion force for that ion. Net current = 0.

**Nernst equation** (for a single ion):

  E = (V_T / z) · ln([outside] / [inside])

Where V_T = RT/F ≈ **27 mV** at body temperature (310 K), z = ion valence.

**Calculated reversal potentials**:
- E_K⁺ ≈ **−80 mV** → K⁺ hyperpolarizes (drives V negative)
- E_Na⁺ ≈ **+59 mV** → Na⁺ depolarizes (drives V positive)
- E_Cl⁻ ≈ **−65 mV** → Cl⁻ mainly shunts (increases conductance)
- E_Ca²⁺ ≈ **+124 mV** → Ca²⁺ strongly depolarizes

**Key rule**: when V > E, positive current flows *outward*; when V < E, positive current flows *inward*. The direction of current reverses at E.

Channels permeable to multiple ions use the **Goldman equation**, giving a weighted average of the individual reversal potentials.`,
      },
      {
        title: "Resting Potential & Goldman Equation",
        content: `The **resting membrane potential** is reached when the total membrane current sums to zero. It is a weighted average of ion reversal potentials:

  E_rest = (g_Na⁺·E_Na⁺ + g_K⁺·E_K⁺ + g_Cl⁻·E_Cl⁻) / (g_Na⁺ + g_K⁺ + g_Cl⁻)

With g_Na⁺/g_K⁺ ≈ 0.03 and g_Cl⁻/g_K⁺ ≈ 0.1:

  E_rest = (0.03·59 − 1·81 − 0.1·65) / (0.03 + 1 + 0.1) ≈ **−76 mV**

**Goldman equation** (more accurate, uses permeabilities P instead of conductances g):

  E_rest = 27 mV · ln( (P_K[K⁺]_out + P_Na[Na⁺]_out + P_Cl[Cl⁻]_in) / (P_K[K⁺]_in + P_Na[Na⁺]_in + P_Cl[Cl⁻]_out) ) ≈ −67 mV

**Key insight**: the more permeable an ion, the more influence it has on the resting potential. At rest, K⁺ dominates (highest permeability), so E_rest is close to E_K⁺.`,

        content: `A neuron can be modeled electrically as a **resistor (R_m) in parallel with a capacitor (C_m)**:

- **Capacitive current** I_c = C_m · dV/dt → charges/discharges the membrane
- **Ionic current** I_i = (V − E_L) / R_m → leaks through ion channels

Total membrane current: **I_m = I_i + I_c**

When a step current I is injected, voltage changes **exponentially** with time constant:

  **τ_m = R_m · C_m = r_m · c_m** (independent of cell size!)

Typically **τ_m = 10–100 ms**

**Effects of current on RC circuits**:
- Pure resistor (R only): V changes *instantaneously* with I → V = i·R
- Pure capacitor (C only): V changes *linearly* in time → dV/dt = i/C
- RC circuit: V changes *exponentially* with time constant τ = RC

The membrane time constant τ_m determines **how quickly a neuron can respond** to changing inputs.`,

  c_m ≈ 10 nF/mm²

**Whole-cell capacitance** C_m scales with surface area A:
  C_m = c_m · A = c_m · 4πa² (for a sphere of radius a)

Neuronal surface areas: 0.01–0.1 mm² → **C_m typically 0.1–1 nF**

**Example**: neuron with C_m = 1 nF at resting potential −70 mV holds charge:
  Q = C_m · V = 1 nF × 70 mV = **70 pC**

**Current-voltage relationship**:
  C_m · dV/dt = dQ/dt = I

→ 1 nA current changes V at **1 mV/ms** in a neuron with C_m = 1 nF

**Key rule**: larger cells have larger C_m → need more current to change voltage at the same rate.`,

  ΔV = I_e · R_m   (Ohm's law)

For R_in = 100 MΩ: a current of 0.1 nA produces ΔV = **10 mV**

**Specific resistance** r_m ≈ 1 MΩ·mm² (varies much more than c_m!)

R_m varies with:
- Number and type of open ion channels
- More open channels → **smaller R_m**
- Channel state changes dynamically with voltage and time

**Summary of passive membrane parameters**:
- R_m = r_m / A (total resistance, scales inversely with area)
- C_m = c_m · A (total capacitance, scales with area)
- τ_m = R_m · C_m = r_m · c_m (**NOT affected by cell size!**)

> ⚠️ The membrane time constant τ_m is a **universal property** of the membrane type, independent of the cell's size or geometry.`,

        title: "Intracellular Resistance & Cable Theory",
        content: `Membrane potential is **not uniform** across a neuron — it can differ between soma, dendrites, and axon.

**Intracellular (axial) resistance R_L** opposes current flow along the length of a dendrite or axon:

  R_L = r_L · L / (π · a²)   where r_L ≈ 1 kΩ·mm

- Highest for **long, narrow** cable segments
- Example: 100 μm segment, radius 2 μm → R_L ≈ **8 MΩ**

**Voltage decays exponentially** with distance from the site of current injection:

  V(x) = V₀ · e^(−x/λ)

where **λ (space/length constant)** = √(d·R_m / 4·R_i)

- λ increases with **larger diameter d** and **higher membrane resistance R_m**
- **Larger diameter** → less axial resistance → signal travels further
- **Higher R_m** → less current leaks out → signal travels further

Local (electrotonic) potentials are **graded** — they decrease with distance, unlike action potentials.`,

  Velocity ∝ λ / τ_m ∝ (1/C_m) · √(d / 4·R_m·R_i)

**To increase conduction speed**:

1. **Increase axon diameter** — larger d → less R_i → larger λ
   - To *double* velocity, you must *quadruple* diameter (velocity ∝ √d)
   - The giant squid axon (~1 mm diameter!) achieves ~20 m/s this way

2. **Decrease membrane capacitance with myelin**
   - Myelin is a lipid-rich insulating sheath wrapped around axons
   - Dramatically reduces C_m → increases conduction speed
   - Myelin does *not* cover the entire axon — **nodes of Ranvier** are bare gaps where Na⁺ channels cluster
   - Action potentials "jump" from node to node: **saltatory conduction**

**Speed of conduction is inversely related to r_i · c_m**.

Myelinated axons can reach **70–120 m/s**, vs. ~0.5 m/s for thin unmyelinated fibers.`,

- **Schwann cells** in the peripheral nervous system
- **Oligodendrocytes** in the central nervous system

**Structure**: alternating myelinated internodes (long, insulated) separated by **nodes of Ranvier** (short, ~1 μm bare gaps). Voltage-gated Na⁺ channels are concentrated at nodes.

**Why myelin is essential**:
- Enables fast motor function (movement, walking)
- Enables fast sensory processing (hearing, vision, pain)
- Supports cognition (learning, memory retrieval)

**Clinical relevance — Multiple Sclerosis (MS)**:
- Autoimmune disease that demyelinates axons in the CNS (brain, spinal cord, optic nerve)
- Loss of myelin → slowed or blocked AP conduction
- Symptoms: muscle weakness, visual disturbances, sensory loss, cognitive impairment

**Electrotonic decay** varies hugely between neuron types — Purkinje cells show rapid decay, while mitral cells and dopaminergic neurons maintain amplitude over hundreds of μm.`,

function renderMarkdown(text, topicColor) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

      }
      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div>`;
    }

    html += `</div></div>`;
  }

  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px">
      <div style="margin-bottom:22px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:270px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:36px 34px;cursor:pointer;transition:background 0.25s;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':'#c0392b'};margin-bottom:16px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:16px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:22px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:28px">
        <button onclick="prevCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:450px">
        ${flashcards.map((_, i) => `<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?'#c0392b':'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function switchTab(tab) { activeTab = tab; render(); }
function selectTopic(id) { activeTopic = id; activeSection = 0; render(); }
function selectSection(i) { activeSection = i; render(); }
function flipCard() { flipped = !flipped; render(); }
function prevCard() { cardIndex = (cardIndex - 1 + flashcards.length) % flashcards.length; flipped = false; render(); }
function nextCard() { cardIndex = (cardIndex + 1) % flashcards.length; flipped = false; render(); }
function goToCard(i) { cardIndex = i; flipped = false; render(); }

render();
</script>
</body>
</html>
