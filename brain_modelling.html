        title: "Spike Trains: Mathematical Representation",
        content: `**Action potentials** are typically treated as **identical, stereotyped events** — what matters is *when* they occur, not their shape.

**Neural response** = a list of the times when spikes occurred (*n* spikes)

The spike train is represented as a sum of **Dirac delta functions**:

  ρ(t) = Σᵢ δ(t − tᵢ)

where *tᵢ* are the times of the *n* spikes. This converts the spike train into a continuous mathematical object.

**Three types of firing rate**:

| Measure | Formula | Description |
|---|---|---|
| Spike-count rate | r = n/T | Time average over trial duration |
| Time-dependent firing rate | r(t) = (1/Δt) ∫ ⟨ρ(τ)⟩ dτ | Trial-averaged, binned |
| Average firing rate | ⟨r⟩ = ⟨n⟩/T | Trial and time average |

**Why multiple trials?** For small Δt (high temporal resolution), spike count per bin is 0 or 1 → must average across many repeated trials. **Trial-to-trial variability** means we work with firing rates rather than specific spike sequences.`
      },
      {
        title: "Measuring Firing Rates: Window Functions",
        content: `**Problem with fixed bins**: counting spikes in pre-assigned bins produces an estimate that depends on *both bin size and bin placement*.

**Solution**: slide a single window *w* of duration Δt along the spike train:

  r_approx(t) = Σᵢ w(t − tᵢ) = ∫ w(τ) ρ(t − τ) dτ

where *w* is the **filter kernel** (how ρ evaluated at time t−τ contributes to the firing rate at time t).

**Properties of binned (rectangular window) rate**:
- Piecewise constant function of time (~histogram)
- Always integer multiples of 1/Δt
- Decreasing Δt increases temporal resolution
- Alternative: vary bin size so a fixed number of spikes falls in each bin

**Four window types compared** (all with ~100 ms resolution):

| Window | Shape | Notes |
|---|---|---|
| Rectangular (binned) | Flat top | Depends on bin placement |
| Sliding rectangular | Flat top, sliding | Avoids placement issue; rates correlated within one bin width |
| Gaussian | Smooth bell curve | Symmetric; uses spikes before AND after t |
| α-function (causal) | One-sided decay | Uses only past spikes; peaks *later* than symmetric windows |

> ⚠️ Rates at times separated by less than one bin width are correlated because they share some of the same spikes.`

        content: `**Gaussian window function** (continuous, symmetric):

  w(τ) = (1/√(2πσ_w)) · exp(−τ²/(2σ_w²))

- σ_w controls temporal resolution (analogous to Δt)
- Uses spikes both before AND after time t → **non-causal**

**α-function window** (causal — biologically realistic):

  w(τ) = [α² τ exp(−ατ)]₊

where [z]₊ = z if z ≥ 0, 0 otherwise (half-wave rectification)

- 1/α determines the temporal resolution
- Vanishes for negative argument → only **past** spikes contribute
- A postsynaptic neuron monitoring a presynaptic cell has access only to spikes that have *previously* occurred → the α-function is biologically more realistic
- Tends to peak **later** than temporally symmetric window functions

**Key requirement for any valid window**: its time integral must equal 1.

  ∫ w(τ) dτ = 1`

  ⟨r⟩ = f(s)

Neuronal responses typically depend on many different **properties/attributes** of a stimulus.

  f(s) = r_max · exp(−½ · ((s − s_max)/σ_f)²)

- *s* = orientation angle of the light bar
- *s_max* = **preferred orientation** — the angle evoking maximum response r_max
- σ_f = determines the **width** of the tuning curve
- Recorded via extracellular recordings of a V1 neuron in a monkey while moving a bar of light at different angles

**Cosine tuning curve** (e.g. arm-movement direction in motor cortex):

  f(s) = r₀ + (r_max − r₀) cos(s − s_max)

- r₀ = background (offset) firing rate
- f_min (when cos = −1) = 2r₀ − r_max
- To ensure non-negative rates: f(s) = [r₀ + (r_max − r₀)cos(s − s_max)]₊
- Example parameters: r_max = 54.69 Hz, r₀ = 32.34 Hz, s_max = 161.25°

> ⚠️ Response tuning curves can characterize selectivities of neurons in visual, motor, and other sensory areas to a variety of stimulus properties.`

- Δs = controls how quickly the firing rate increases with s

        content: `**Fundamental challenge**: a complete description of the stochastic stimulus–response relationship requires knowing the probabilities of *every* spike sequence the stimulus can evoke.

**Mathematical setup**:
- Spike times are **continuous variables** → probability of a spike at any *precisely specified* time is zero
- Must ask for the probability of a spike within an interval (between t and t + Δt)
- For small Δt: P[t] = p[t]·Δt, where p[t] is the **probability density**

**Joint probability** of n spikes at specified times t₁, t₂, …, tₙ:

  P[t₁, t₂, …, tₙ] = p[t₁, t₂, …, tₙ] (Δt)ⁿ

where spike time i falls in [tᵢ, tᵢ + Δt].

**Why statistical models?** The number of possible spike sequences is typically so large that estimating all their probabilities of occurrence is impossible → we use **point processes**.

**Point process hierarchy** (by memory):

| Process | Memory | Description |
|---|---|---|
| Poisson process | None | Events statistically independent |
| Renewal process | Last event only | Dependence extends only to immediately preceding event |
| General point process | Full history | Probability depends on the entire history of preceding events |`

        title: "Homogeneous Poisson Process",
        content: `**Homogeneous Poisson process**: firing rate is **constant over time**, r(t) = r.

Every sequence of *n* spikes over a fixed time interval is generated with **equal probability**:

  P[t₁, t₂, …, tₙ] = n! · Pᴛ[n] · (Δt/T)ⁿ

**Derivation using M bins** of size Δt = T/M:
- Probability of a spike in one specific bin: r·Δt
- Probability of *n* spikes in a specified set of M bins: (r·Δt)ⁿ
- Probability of no spike in remaining M−n bins: (1 − r·Δt)^(M−n)
- Combinatorial factor (ways to put n spikes in M bins): M!/(M−n)!n!

**Result** (Δt→0, M→∞, n fixed): **Poisson distribution**:

  Pᴛ[n] = (rT)ⁿ / n! · exp(−rT)

**Properties**:
- For large rT (≥10), the Poisson distribution approaches a **Gaussian** with mean and variance both equal to rT
- Larger n values are more likely for large T

> ⚠️ In the Poisson process, the firing rate r(t) is all we need — knowing when spikes occur tells us nothing about when the *next* spike will occur.`

**Interspike interval (ISI) distribution** for a homogeneous Poisson process:

- Probability of no spike for period τ: exp(−rτ)
- Probability density of ISIs: **p(τ) = r·exp(−rτ)** (exponential distribution)
- Short ISIs are most likely; long ISIs fall off exponentially

| Quantity | Formula | Value (Poisson) |
|---|---|---|

- *Adaptation*: a long ISI is more probable after a short ISI

2. If **r(t)·Δt > x_rand** → fire a spike; otherwise do not

**Alternative for constant rate** (faster):

|---|---|---|

- Stimulus intensity is encoded in the *number* of spikes per unit time

- If r(t) varies **rapidly** → typically called temporal coding
- The boundary is not clear-cut

**Alternative definition** (stimulus-based):
- A temporal code is one in which information is carried by spike timing details on a scale **shorter** than the fastest time characterizing stimulus variations

**Correlation code within a single neuron**:

- But this is **rarely more than 10%** of the information carried by spikes considered independently

        content: `**Spike-triggered averaging (STA)** is a powerful tool for characterizing the response properties of a neuron using the spikes it emits in response to a time-varying stimulus.

**Key properties**:
- Provides an estimate of a neuron's **linear receptive field**
- A useful technique for the analysis of **electrophysiological data**
- Measures the relationship between a **continuous signal** and a **simultaneously recorded spike train**
- Represents the **average signal taken at the times of spike occurrences**
- With proper normalization, equivalent to the **cross-correlation** between the continuous signal and the spike train

**Reverse-correlation**:
- Used to determine the **temporal and spatial structure** of a neuron's receptive field
- Based on stimuli that vary **randomly in time**
- Cross-correlations between white-noise stimuli and sparsely occurring neuronal spikes

        content: `The spike-triggered average is computed following these four steps:

1. Record the **stimulus** over the complete spike train duration
2. Record all **spike times**
3. For every spike, **add the stimulus values** surrounding the spike into the STA array
4. **Divide by the number of spikes** to obtain the final spike-triggered average

**Intuition**:
- For each spike, we take a window of the stimulus that preceded (and followed) it
- Each such stimulus excerpt is a **different colored waveform** in the classic STA diagram
- By averaging all these excerpts, random fluctuations **cancel out**
- What remains is the **systematic stimulus feature** that tends to precede a spike

> ⚠️ The STA is the average stimulus that caused the neuron to fire. It is only an unbiased estimator of the linear receptive field when white-noise stimuli are used.`

|---|---|

| r₀ | Background firing rate when s = 0 |
| D(τ) | Kernel — weighting factor (linear filter) |

- Therefore, *s(t)* is defined with its **mean value subtracted out**

- It has stimulus fluctuations at all frequencies with equal weight (= equal power) → **flat power spectrum**

- Stimuli themselves are often described stochastically (statistical properties of complex environments)

**Key probability quantities**:

| Notation | Meaning |
|---|---|
| P[s] | Prior probability of stimulus s being presented |
| P[r] | Probability of response r being recorded (independent of stimulus) |
| P[r, s] | Joint probability: stimulus s presented AND response r recorded |
| P[r\|s] | Conditional probability of response r given stimulus s was presented |
| P[s\|r] | Conditional probability that stimulus s was presented, given response r was recorded |

**Key relationships**:

  P[r] = Σₛ P[r|s] P[s]
  P[s] = Σᵣ P[s|r] P[r]
  P[r, s] = P[r|s] P[s] = P[s|r] P[r]

**Bayes' Theorem** (with P[r] ≠ 0):

- **Increases** with P[s] — the prior probability that stimulus s(t) occurs
- **Decreases** with P[r] — the probability that r occurs independently from s(t)

> ⚠️ The Bayes theorem is a fundamental law with many applications. In this context, it defines the probability that a certain neuron recognizes a stimulus among a certain distribution of possible stimuli.

        content: `**Information Theory** provides a general framework for quantifying the ability of a coding scheme or communication channel to convey information.

In neuroscience, it answers: *"How much does the neural response tell us about a stimulus?"* — in a rigorous, quantitative way.

**Key ingredients of the framework**:
- The code involves a number of *symbols* (e.g., different neuronal responses, sequences of action potentials)
- The coding and transmission processes are **stochastic and noisy**

**Two central measures**:
- *Entropy* → measures the theoretical **capacity** of a code to convey information
- *Mutual Information* → measures how much of that capacity is **actually used** when the code is employed

> ⚠️ Neural encoding asks *what* the response is; information theory asks *how much* the response tells us about the world.`,

A more interesting set shows a larger range of different responses, in a highly irregular and unpredictable sequence.

**Building the entropy formula from two conditions**:

For discrete responses (spike-count firing rates), we define the "surprise" of seeing response rate *r* as a function h(P[r]) of its probability:

1. h(P[r]) must be a **decreasing function** of P[r] — low probability responses are more surprising than high probability ones
2. h must be **additive for independent sources** — for two independent neurons with rates r₁ and r₂:

  h(P[r₁]·P[r₂]) = h(P[r₁]) + h(P[r₂])

The **logarithm** is the only function satisfying this identity for all P, so:

  h(P[r]) = −log₂ P[r]   (units: bits, dimensionless)

**Shannon's entropy** is the average surprise over all possible responses:

  H = −∑ᵣ P[r] · log₂ P[r]`,

- When P[r] ≈ 1: h ≈ 0, so P[r]·h → **0** — a near-certain event also contributes little
- The responses that **contribute most** have intermediate probabilities: frequent enough to appear often, but not so certain as to make h small

All P[r] = 0 except one which equals 1 → log₂ 1 = 0 → **H = 0** (zero entropy, no surprise)

        content: `Single-compartment models assume the neuron is **isopotential** — the same voltage everywhere. This breaks down for real neurons because:

- Voltage **attenuates** as it travels along dendrites (exponentially with distance)
- There is a **delay** between when a signal arrives at a dendrite tip and when it reaches the soma
- Different dendritic branches can process signals semi-independently

**Multi-compartment models** divide the neuron into discrete regions (compartments), each with its own membrane potential V_μ. Compartments are connected by **resistive couplings** g_μ,μ' that approximate current flow between adjacent regions.

The continuous membrane potential V(x, t) is approximated by a discrete set V_μ.

**The morphoelectrotonic transform** visualizes these effects:
- *Attenuation panel*: distances scaled by log(steady-state attenuation) — farther from soma = more attenuation
- *Delay panel*: distances scaled by the inward delay for a peripheral current pulse

> ⚠️ A neuron that appears electrotonically compact for static (DC) current injection may be *not compact* for high-frequency inputs, because the capacitance of the membrane cable increases attenuation with frequency.`,

        title: "The Cable Equation",
        content: `For a cylindrical cable segment of radius *a* and length Δx:

**Capacitive current**: the segment has surface area 2πaΔx, giving capacitance 2πaΔx·c_m. The current needed to change V at rate ∂V/∂t is 2πaΔx·c_m·∂V/∂t.

**Longitudinal (axial) current**: flows in from the left and out to the right, proportional to the voltage gradient ∂V/∂x.

Combining these with the membrane current i_m gives the **cable equation**:

  c_m · ∂V/∂t = (1/2ar_L) · ∂/∂x(a² · ∂V/∂x) − i_m + i_e

**Boundary conditions**:
- *At a branching node*: V must be continuous across the branch
- *At a branching node*: charge must be conserved (sum of all longitudinal currents entering = 0)
- *At a terminal node*: no current flows out of the end (∂V/∂x = 0)

**Discretized form** for compartment μ in a nonbranching cable:

  c_m · dV_μ/dt = −i_m^μ + I_e^μ/A_μ + g_μ,μ+1(V_μ+1 − V_μ) + g_μ,μ−1(V_μ−1 − V_μ)

Branching compartments have three coupling terms instead of two.

Due to complex morphologies and membrane currents, the cable equation is usually solved **numerically** using tools like the NEURON simulation package.`,

**Hebbian principle**: if input from neuron A often contributes to the firing of neuron B, then the synapse from A to B should be **strengthened** → leads to formation of **neuronal assemblies**.

**Generalized Hebb rule** (bidirectional): synapses change in proportion to the **correlation or covariance** of the activities of the pre- and postsynaptic neurons:
- High-frequency presynaptic stimulation → postsynaptic response → **Long-Term Potentiation (LTP)**
- Low-frequency stimulation → no postsynaptic response → **Long-Term Depression (LTD)**

- This requires **competition between synapses**

        title: "DTI — Principles",
        content: `**Diffusion Tensor Imaging (DTI)** is the primary non-invasive method for mapping white matter connectivity in vivo.

**Core idea**: water molecules diffuse through brain tissue, but their movement is *constrained* by cellular structures. In white matter, water diffuses much more freely *along* axon bundles than *across* them — this anisotropy reveals fiber orientation.

**The diffusion tensor** describes three properties at each voxel:
- *Magnitude* — how much total diffusion occurs
- *Anisotropy* — how directional the diffusion is
- *Orientation* — which direction diffusion is fastest (= fiber direction)

**Key metrics**:
- **ADC (Apparent Diffusion Coefficient)**: quantifies the magnitude of diffusion. Higher ADC = less restriction = fewer intact fibers
- **FA (Fractional Anisotropy)**: describes the diffusion pattern. FA = 0 → completely isotropic (e.g. CSF). FA = 1 → strongly anisotropic (e.g. corpus callosum)

**DTI principle**: a magnetic field induces movement of water molecules. Intact nerve fibers and their constituents (cell membranes, myelin, macromolecules) *hinder* this movement in directions perpendicular to the fiber axis.

Acquisition: high quality whole-brain DTI data obtained in approximately **15 minutes** on clinical 1.5T scanners.`,

        content: `**Tractography** uses DTI data to reconstruct white matter fiber pathways computationally.

**How it works**:
- Follows the *principal diffusion direction* (eigenvector of the tensor) at each voxel
- Tracts are constrained by using one or more **ROI (Regions of Interest)**
- Different colors represent directional vectors: antero-posterior, ventro-caudal, and interhemispheric axes
- Algorithms generate anatomically plausible reconstructions of projection, commissural and association pathways

**Limitations**:
- Local tract directions are sensitive to **thermal noise**, physiologic fluctuations, and image artifacts
- Crossing fibers are difficult to resolve (standard DTI assumes one fiber direction per voxel)
- Tractography shows structural connections but cannot determine directionality of signal flow

**Clinical applications of DTI**:

| Domain | Applications |
|--------|-------------|
| Diagnosis | Ischemic stroke, demyelination (MS), Alzheimer's, inflammation, edema, brain tumors |
| Neurotherapeutics | Disease/response predictors, surgical planning, radiation treatment, pharmacological monitoring |

DTI is described as a **highly sensitive but low specificity** marker for neuropathology — it detects changes but cannot always identify their cause.`,

        content: `The **neural encoding problem** asks: what is the probabilistic relationship between stimuli and spike trains?

Formally, we want to model **P(y₁, y₂, …, yₙ | x, θ)** — the probability of observing a spike train **y** given a stimulus **x** and model parameters **θ**.

**Dataset context**: neuronal recordings from *retinal ganglion cells* exposed to a temporally varying white-noise visual stimulus.

- By presenting randomly fluctuating stimuli and measuring the corresponding spiking activity, one can estimate how each neuron integrates visual input over time.
- Techniques such as the **spike-triggered average (STA)** and **generalized linear models (GLMs)** can then be applied to recover the temporal filter (receptive field) that best explains the cell's firing behavior.

        title: "General Linear Model (GLM)",
        content: `The **General Linear Model** is a two-stage model:

1. *Linear stage*: the stimulus vector **x** is projected through a linear filter **θ** (dimensionality reduction)
2. *Noise stage*: output drawn from an exponential family distribution

**Examples**:
- Gaussian: y = **θ** · **x** + ε
- Poisson: y ~ Poiss(**θ** · **x**)

**Application to neural data** — the response at time t is modelled as:

  yₜ = **k** · **xₜ** + noise

Where:
- *yₜ* = response (spike count) at time t
- ***k*** = linear filter (receptive field)
- ***xₜ*** = vector of stimulus values in a window preceding time t

**Building the design matrix**: we slide a window across the stimulus time series, one time bin at a time. At each time step t, the row of the design matrix **X** contains the stimulus history **xₜ**.

**Linear Gaussian solution**:

  **k̂** = (XᵀX)⁻¹ Xᵀ Y

Where:
- *XᵀX* = stimulus covariance matrix
- *XᵀY* = **spike-triggered average (STA)**

This means the STA is the optimal linear filter when the stimulus is Gaussian white noise.`,

        content: `The **Generalized Linear Model** extends the General Linear Model by adding a *nonlinear stage*:

  **x** → Linear (**θ**) → Nonlinear (**f**) → Noise → **y**

- *Linear predictor* **θ**: dimensionality reduction
- *Nonlinearity* **f**: maps the linear projection to a firing rate (must keep rates positive)
- *f⁻¹* is called the **link function**

**Examples**:
- Gaussian: y = f(**θ** · **x**) + ε
- Poisson: y ~ Poiss(f(**θ** · **x**))

**Basic Poisson GLM** — the Linear-Nonlinear-Poisson (LNP) model:

  spike rate: λ = f(**k** · **x**)
  spike count: y ~ Poiss(λ)

The three stages are:
1. *Stimulus filter* **k**: extracts the relevant feature from the stimulus
2. *Exponential nonlinearity* f: ensures the rate λ is always positive (f = exp is common)
3. *Poisson spiking*: generates spike counts from the rate λ

**Why Poisson GLM?**
- Counts are non-negative integers → Poisson noise is appropriate
- Exponential nonlinearity → log-concave likelihood → **convex optimization** (guaranteed global maximum)
- Parameters estimated by **maximum likelihood**, not closed-form

- *Computationally efficient*: fast to simulate large networks (thousands to millions of neurons)
- *Mathematically simple*: amenable to analytical treatment

  τ_m dU/dt = –(U – Uᵣₑₛₜ) + R·I[t]

- *τ_m = RC*: membrane time constant
- *Uᵣₑₛₜ*: resting potential

**HH model** (4 variables: u, n, m, h):
- *u*: membrane potential
- *n*: K⁺ activation gate (slow)
- *m*: Na⁺ activation gate (fast)
- *h*: Na⁺ inactivation gate (slow)

**Problem**: HH is accurate but slow and difficult to analyze analytically.

**Reduction to 2D** — two key observations:
- **Observation 1**: m has very fast dynamics → *quasi-steady-state approximation*: replace m(t) with its instantaneous steady-state value m₀(u(t))
- **Observation 2**: τₙ(u) and τₕ(u) have similar voltage dependence; n₀(u) and 1–h₀(u) are similar → approximate both n and (1–h) by a single *recovery variable* **w**

  Linear approximation: set w = b – h = a·n

**Result** — 2D reduction general form:
  u̇ = (1/τ)(F(u,w) + R·I)
  ẇ = (1/τw)·G(u,w)

- *u*: membrane potential (fast variable)
- *w*: recovery/relaxation variable (slow variable)
- The dynamics of all gating variables are condensed into the single variable w`,

  ẇ = ε(b₀ + b₁u – w)

Where:

- *w*: recovery variable (slow)
- *I*: external input current
- *ε*: time-scale separation parameter (small → slow recovery)
- *b₀, b₁*: constants shaping the w-nullcline

**Properties of w**:
- Linear dynamics → provides a *slower negative feedback* (recovery/repolarization)

- *w-nullcline*: b₀ + b₁u – w = 0 → a **straight line**

      {
        title: "Phase Plane Analysis",
        content: `**Phase plane analysis** is the primary tool for understanding 2D dynamical systems geometrically.

**Key concepts**:
- *State*: current condition of the system as a vector (u(t), w(t))
- *Phase space*: the set of all possible states
- *Trajectory (orbit)*: sequence of states exhibited by the system during its evolution
- *Vector field*: the vector (u̇, ẇ) defined at every point in phase space

**Time evolution**: (Δu, Δw) ≈ (u̇, ẇ)·Δt

**Nullclines**:
- *u-nullcline*: u̇ = 0 → vector field arrows are vertical (purely in w direction)
- *w-nullcline*: ẇ = 0 → vector field arrows are horizontal (purely in u direction)
- The direction of arrows changes where nullclines intersect

**Fixed points (equilibria)**: points where F(u*, w*) = 0 AND G(u*, w*) = 0 simultaneously → **intersections of the nullclines**

**Types of equilibria**:
- *Stable fixed point* (attractor): nearby trajectories converge
- *Unstable fixed point* (repeller): nearby trajectories diverge
- *Saddle point*: some trajectories attracted, others repelled
- *Limit cycle*: periodic orbit — a closed trajectory in phase space

**Bifurcation**: a qualitative change in the phase portrait as a parameter varies:
1. A stable fixed point becomes unstable
2. A new fixed point appears
3. A limit cycle emerges

> ⚠️ Neurons are excitable because they operate near a bifurcation: with sufficient input current, the resting fixed point disappears and a stable limit cycle (periodic spiking) emerges.`,

**Jacobian matrix**:

  J = | F_u  F_w |   (partial derivatives of F and G evaluated at the fixed point)
      | G_u  G_w |

**Stability depends on the eigenvalues λ of J**, found from the characteristic equation:

  det(J – λI) = 0  →  (a–λ)(d–λ) – bc = 0

**Classification by eigenvalues on the complex plane**:

| Configuration | Type | Stability |
| Both λ real, negative | Stable node | Stable |
| Both λ complex, Re(λ) < 0 | Stable focus | Stable |
| λ real, opposite signs | Saddle | Unstable |
| Both λ real, positive | Unstable node | Unstable |
| Both λ complex, Re(λ) > 0 | Unstable focus | Unstable |

        title: "Why Mean Field Theory?",
        content: `In the study of higher brain functions (sensory processing, learning, pattern recognition), focusing on single neurons is not the best approach.

**Reasons**:
- The number of neurons involved is too vast
- Higher functions are *global processes* involving entire microcircuits
- Random local interactions give rise to precise long-range interactions at the circuit level

**Mean-field (MF) theory** replaces interactions between single neurons with an **average interaction** — a mean field.

**Key ideas**:
- Dynamical units are no longer individual neurons but **neural populations**
- All pairwise interactions are approximated with an average interaction
- The result is a simplified model that captures macroscopic population dynamics

**Advantages**:
- MF approximation matches the *spatial and temporal averaging* inherent in experimental measurements (e.g. EEG, fMRI)
- Provides insight into macroscopic behavior at lower computational cost
- Emergent macroscopic phenomena may not depend on fine details → different systems share the same MF description
- Sometimes the MF solution is exact (analytical)

**Disadvantages**:
- Fine details of the single-neuron dynamics are lost
- The MF hypothesis must be verified a posteriori
- Not every macroscopic behavior can be captured by MF theory`,

- Total input current: Iᵢ = Σⱼ Jᵢⱼ xⱼ + Iᵢ,ₑₓₜ

function buildPicker() {
  const grid = document.getElementById('picker-grid');
  ALL_LECTURES.forEach((L, i) => {
    const card = document.createElement('div');
    card.className = 'lec-card';
    card.style.borderColor = '#1a3048';

    card.onmouseout  = () => card.style.borderColor = '#1a3048';
    card.innerHTML = `
      <div class="lec-num" style="color:${L.accent}">Lecture ${L.num}</div>
      <div class="lec-title">${L.subtitle}</div>
      <div style="font-size:12px;color:#3a5a70;margin-top:6px;line-height:1.4">${L.bigTitle}</div>

    grid.appendChild(card);
  });
}

  currentLecIdx = i;

}

// ─── Markdown renderer ────────────────────────────────────────────────────────
function renderMarkdown(text, topicColor) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

// Helper: get visual for current section
function getSectionVisual(title) {
  return SECTION_VISUALS[title] || "";
}

// ─── Main render ──────────────────────────────────────────────────────────────
function render() {
  const L = ALL_LECTURES[currentLecIdx];
  const topics = L.topics;
  const flashcards = L.flashcards;
  const accent = L.accent;

  const currentTopic = topics.find(t => t.id === activeTopic) || topics[0];
  const currentSec = currentTopic?.sections[activeSection];

  let html = `
  <div style="min-height:100vh;background:#08111a;color:#cdd9e5;font-family:'Georgia',serif;font-size:15px">
    <div style="background:#0d1d2e;border-bottom:1px solid #1a3048;padding:14px 24px;display:flex;align-items:center;gap:14px">
      <button onclick="goToPicker()" style="padding:6px 14px;background:#111e2d;border:1px solid #1a3048;border-radius:6px;color:#5a7a96;cursor:pointer;font-size:12px;flex-shrink:0">← All Lectures</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:${accent};margin-bottom:2px">Brain Modelling — Lecture ${L.num}</div>
        <div style="font-size:18px;font-weight:bold;color:#e8f0f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${L.bigTitle}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="switchTab('learn')" style="padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;background:${activeTab==='learn'?'#0d1e30':'#121f2e'};color:${activeTab==='learn'?'#7eb8f7':'#7a9bb8'};font-weight:${activeTab==='learn'?'bold':'normal'}">📖 Study</button>
        <button onclick="switchTab('flashcards')" style="padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;background:${activeTab==='flashcards'?'#0d1e30':'#121f2e'};color:${activeTab==='flashcards'?'#7eb8f7':'#7a9bb8'};font-weight:${activeTab==='flashcards'?'bold':'normal'}">🃏 Flashcards</button>
      </div>
    </div>`;

  // ── STUDY TAB ───────────────────────────────────────────────────────────────
  if (activeTab === "learn") {
    html += `<div style="display:flex;height:calc(100vh - 65px)">
      <div style="width:210px;background:#0a1825;border-right:1px solid #1a3048;overflow-y:auto;flex-shrink:0">`;

    topics.forEach(topic => {
      const isActive = activeTopic === topic.id;
      html += `<div>
        <button onclick="selectTopic('${topic.id}')" style="width:100%;padding:12px 14px;text-align:left;border:none;cursor:pointer;background:${isActive?'#111e2d':'transparent'};border-left:${isActive?`3px solid ${topic.color}`:'3px solid transparent'};color:${isActive?'#e0ecfa':'#5a7a96'};display:flex;gap:8px;align-items:center;font-size:12px">
          <span>${topic.icon}</span><span style="flex:1;line-height:1.3">${topic.label}</span>
        </button>`;
      if (isActive) {
        topic.sections.forEach((s, i) => {
          html += `<button onclick="selectSection(${i})" style="width:100%;padding:7px 14px 7px 34px;text-align:left;border:none;cursor:pointer;background:${activeSection===i?'#132030':'transparent'};color:${activeSection===i?topic.color:'#4a6a80'};font-size:11px;line-height:1.35">${s.title}</button>`;
        });
      }
      html += `</div>`;
    });

    html += `</div><div style="flex:1;overflow-y:auto;padding:28px 40px">`;

    if (currentSec) {
      html += `
        <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:${currentTopic.color};margin-bottom:8px">${currentTopic.icon} ${currentTopic.label}</div>
        <h1 style="font-size:22px;color:#e8f0f8;margin-bottom:20px;border-bottom:1px solid #1a3048;padding-bottom:12px">${currentSec.title}</h1>
        <div style="line-height:1.85;max-width:740px">${renderMarkdown(currentSec.content, currentTopic.color)}</div>
        ${getSectionVisual(currentSec.title)}
        <div style="display:flex;gap:12px;margin-top:40px">`;

      if (activeSection > 0) {
        html += `<button onclick="selectSection(${activeSection-1})" style="padding:8px 20px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`;
      }
      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:8px 20px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:8px 20px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // ── FLASHCARDS TAB ──────────────────────────────────────────────────────────
  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:40px 20px">
      <div style="margin-bottom:20px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:260px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:32px;cursor:pointer;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':accent};margin-bottom:14px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:15px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:20px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:24px">
        <button onclick="prevCard()" style="padding:8px 20px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:8px 20px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:8px 20px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:24px;flex-wrap:wrap;justify-content:center;max-width:500px">
        ${flashcards.map((_,i)=>`<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?accent:'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function switchTab(tab) { activeTab = tab; render(); }
function selectTopic(id) { activeTopic = id; activeSection = 0; render(); }
function selectSection(i) { activeSection = i; render(); }
function flipCard() { flipped = !flipped; render(); }
function prevCard() { cardIndex = (cardIndex-1+ALL_LECTURES[currentLecIdx].flashcards.length)%ALL_LECTURES[currentLecIdx].flashcards.length; flipped=false; render(); }
function nextCard() { cardIndex = (cardIndex+1)%ALL_LECTURES[currentLecIdx].flashcards.length; flipped=false; render(); }
function goToCard(i) { cardIndex=i; flipped=false; render(); }

// ─── Init ─────────────────────────────────────────────────────────────────────
buildPicker();
</script>
