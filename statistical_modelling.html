}

function drawFTestDist(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  // Simple F(2,10) pdf approximation
  function fpdf(x, d1, d2) {
    if (x <= 0) return 0;
    const num = Math.pow(d1 * x, d1) * Math.pow(d2, d2);
    const den = Math.pow(d1 * x + d2, d1 + d2);
    if (den === 0) return 0;
    return Math.sqrt(num / den) / (x * 1.8); // normalized approx
  }

  const xMin = 0, xMax = 6;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - v * cH * 1.5;

  // Grid
  ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
  [0, 1, 2, 3, 4, 5, 6].forEach(v => {
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + cH); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v, toX(v), pad.top + cH + 16);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();

  // F(2,10) curve
  ctx.strokeStyle = '#2980b9'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let first = true;
  for (let x = 0.01; x <= xMax; x += 0.04) {
    const y = fpdf(x, 2, 10);
    const px = toX(x), py = toY(y);
    first ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    first = false;
  }
  ctx.stroke();

  // Shade rejection region F > 4.10 (approx F_{2,10;0.05})
  const fCrit = 4.10;
  ctx.fillStyle = 'rgba(231,76,60,0.2)';
  ctx.beginPath();
  ctx.moveTo(toX(fCrit), toY(0));
  for (let x = fCrit; x <= xMax; x += 0.04) {
    ctx.lineTo(toX(x), toY(fpdf(x, 2, 10)));
  }
  ctx.lineTo(toX(xMax), toY(0));
  ctx.closePath();
  ctx.fill();

  // Critical value label
  ctx.strokeStyle = 'rgba(231,76,60,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(toX(fCrit), pad.top); ctx.lineTo(toX(fCrit), pad.top + cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#e74c3c'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('F*', toX(fCrit), pad.top + 14);
  ctx.fillStyle = 'rgba(231,76,60,0.85)'; ctx.font = '10px Georgia';
  ctx.fillText('α', toX(5.2), toY(0.02));

  ctx.fillStyle = '#5a7a96'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('F statistic', pad.left + cW / 2, H - 6);
  ctx.fillStyle = '#7eb8f7'; ctx.font = '11px Georgia';
  ctx.fillText('F(2,10) distribution — rejection region α=0.05', W / 2, 20);
}

function drawTwoSampleSetup(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  function normpdf(x, mu, sigma) {
    return Math.exp(-0.5*((x-mu)/sigma)**2) / (sigma * Math.sqrt(2*Math.PI));
  }

  const xMin = 18, xMax = 28, yMin = 0, yMax = 0.55;
  const toX = v => pad.left + ((v-xMin)/(xMax-xMin))*cW;
  const toY = v => pad.top + cH - ((v-yMin)/(yMax-yMin))*cH;

  // Grid
  ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
  [18,20,22,24,26,28].forEach(v => {
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top+cH); ctx.stroke();
    ctx.fillStyle='#4a6a80'; ctx.font='11px Georgia'; ctx.textAlign='center';
    ctx.fillText(v, toX(v), pad.top+cH+16);
  });
  ctx.strokeStyle='#2a4a60'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.left,pad.top); ctx.lineTo(pad.left,pad.top+cH); ctx.lineTo(pad.left+cW,pad.top+cH); ctx.stroke();

  // Robin distribution (mu=22.6, sigma=1.1)
  const muR = 22.6, muW = 23.9, sigma = 1.1;
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=2;
  ctx.beginPath();
  let first = true;
  for (let x=xMin; x<=xMax; x+=0.05) {
    const y = normpdf(x, muR, sigma);
    first ? ctx.moveTo(toX(x),toY(y)) : ctx.lineTo(toX(x),toY(y));
    first = false;
  }
  ctx.stroke();

  // Wren distribution (mu=23.9, sigma=1.1)
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=2;
  ctx.beginPath(); first=true;
  for (let x=xMin; x<=xMax; x+=0.05) {
    const y = normpdf(x, muW, sigma);
    first ? ctx.moveTo(toX(x),toY(y)) : ctx.lineTo(toX(x),toY(y));
    first = false;
  }
  ctx.stroke();

  // Vertical dashed lines at means
  [muR, muW].forEach((mu, i) => {
    ctx.strokeStyle = i===0 ? 'rgba(41,128,185,0.5)' : 'rgba(231,76,60,0.5)';
    ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(toX(mu), pad.top); ctx.lineTo(toX(mu), pad.top+cH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = i===0 ? '#2980b9' : '#e74c3c';
    ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(i===0 ? 'μᴿ' : 'μᵂ', toX(mu), pad.top+12);
  });

  // Bracket showing μᵂ - μᴿ
  const y0 = toY(0.02);
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(toX(muR), y0); ctx.lineTo(toX(muW), y0); ctx.stroke();
  ctx.fillStyle = '#f39c12'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('μᵂ − μᴿ = ?', toX((muR+muW)/2), y0-8);

  // Legend
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(pad.left+10,pad.top+10); ctx.lineTo(pad.left+32,pad.top+10); ctx.stroke();
  ctx.fillStyle='#8bbcd8'; ctx.font='11px Georgia'; ctx.textAlign='left';
  ctx.fillText('Robin N(μᴿ, σ²)', pad.left+36, pad.top+14);
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(pad.left+10,pad.top+26); ctx.lineTo(pad.left+32,pad.top+26); ctx.stroke();
  ctx.fillStyle='#8bbcd8';
  ctx.fillText('Wren N(μᵂ, σ²)', pad.left+36, pad.top+30);

  ctx.fillStyle='#5a7a96'; ctx.font='12px Georgia'; ctx.textAlign='center';
  ctx.fillText('egg length (mm)', pad.left+cW/2, H-6);
}

function drawTStatistic(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  function tpdf(x, df) {
    const num = Math.pow(1 + x*x/df, -(df+1)/2);
    return num * (df===58 ? 0.3985 : 0.3989);
  }

  const xMin=-4, xMax=4;
  const toX = v => pad.left + ((v-xMin)/(xMax-xMin))*cW;
  const toY = v => pad.top + cH - v*cH*2.3;

  // Grid
  ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
  [-4,-2,0,2,4].forEach(v => {
    ctx.beginPath(); ctx.moveTo(toX(v),pad.top); ctx.lineTo(toX(v),pad.top+cH); ctx.stroke();
    ctx.fillStyle='#4a6a80'; ctx.font='11px Georgia'; ctx.textAlign='center';
    ctx.fillText(v, toX(v), pad.top+cH+16);
  });
  ctx.strokeStyle='#2a4a60'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad.left,pad.top); ctx.lineTo(pad.left,pad.top+cH); ctx.lineTo(pad.left+cW,pad.top+cH); ctx.stroke();

  // t_{n+m-2} curve (df=58, approx normal)
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=2;
  ctx.beginPath();
  let first=true;
  for (let x=xMin; x<=xMax; x+=0.05) {
    const y = tpdf(x, 58);
    first ? ctx.moveTo(toX(x),toY(y)) : ctx.lineTo(toX(x),toY(y));
    first=false;
  }
  ctx.stroke();

  // Shade rejection regions (alpha=0.05, t_crit ≈ 2.00)
  const tCrit = 2.00;
  ctx.fillStyle='rgba(231,76,60,0.18)';
  ctx.beginPath(); ctx.moveTo(toX(tCrit),toY(0));
  for (let x=tCrit; x<=xMax; x+=0.05) ctx.lineTo(toX(x),toY(tpdf(x,58)));
  ctx.lineTo(toX(xMax),toY(0)); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(toX(-tCrit),toY(0));
  for (let x=-tCrit; x>=-xMax; x-=0.05) ctx.lineTo(toX(x),toY(tpdf(x,58)));
  ctx.lineTo(toX(-xMax),toY(0)); ctx.closePath(); ctx.fill();

  // Observed t value marker (example: T_obs = 3.1)
  const tObs = 3.1;
  ctx.strokeStyle='#f39c12'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(toX(tObs),pad.top); ctx.lineTo(toX(tObs),pad.top+cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#f39c12'; ctx.font='11px Georgia'; ctx.textAlign='center';
  ctx.fillText('T_obs', toX(tObs), pad.top+10);

  // p-value labels
  ctx.fillStyle='rgba(231,76,60,0.8)'; ctx.font='10px Georgia';
  ctx.fillText('α/2', toX(3.3), toY(0.01));
  ctx.fillText('α/2', toX(-3.3), toY(0.01));

  // Legend
  ctx.strokeStyle='#2980b9'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(pad.left+10,pad.top+10); ctx.lineTo(pad.left+32,pad.top+10); ctx.stroke();
  ctx.fillStyle='#8bbcd8'; ctx.font='11px Georgia'; ctx.textAlign='left';
  ctx.fillText('t_{n+m-2} under H₀', pad.left+36, pad.top+14);

  ctx.fillStyle='#5a7a96'; ctx.font='12px Georgia'; ctx.textAlign='center';
  ctx.fillText('T', pad.left+cW/2, H-6);
}

function drawGroupMeans(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  // Simulated data for 3 groups
  const groups = [
    { name: 'Group 1', color: '#2980b9', data: [4.2, 4.8, 5.1, 3.9, 5.5, 4.6] },
    { name: 'Group 2', color: '#27ae60', data: [6.8, 7.2, 6.5, 7.5, 7.0, 6.9] },
    { name: 'Group 3', color: '#e74c3c', data: [9.1, 8.7, 9.4, 8.5, 9.0, 8.9] },
  ];

  const allData = groups.flatMap(g => g.data);
  const overallMean = allData.reduce((a, b) => a + b, 0) / allData.length;
  const groupMeans = groups.map(g => g.data.reduce((a, b) => a + b, 0) / g.data.length);

  const yMin = 2, yMax = 12;
  const toY = v => pad.top + cH - ((v - yMin) / (yMax - yMin)) * cH;

  // Grid
  ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
  [2, 4, 6, 8, 10, 12].forEach(v => {
    ctx.beginPath(); ctx.moveTo(pad.left, toY(v)); ctx.lineTo(pad.left + cW, toY(v)); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'right';
    ctx.fillText(v, pad.left - 5, toY(v) + 4);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();

  // Overall mean line
  ctx.strokeStyle = 'rgba(243,156,18,0.7)'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(pad.left, toY(overallMean)); ctx.lineTo(pad.left + cW, toY(overallMean)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f39c12'; ctx.font = '11px Georgia'; ctx.textAlign = 'left';
  ctx.fillText('ȳ = ' + overallMean.toFixed(2), pad.left + 4, toY(overallMean) - 5);

  // Draw data points and group means
  const groupW = cW / groups.length;
  groups.forEach((g, gi) => {
    const cx = pad.left + groupW * gi + groupW / 2;
    const gm = groupMeans[gi];

    // Jittered points
    g.data.forEach((y, di) => {
      const jitter = (di - g.data.length / 2) * 8;
      ctx.beginPath(); ctx.arc(cx + jitter, toY(y), 4, 0, Math.PI * 2);
      ctx.fillStyle = g.color + '99'; ctx.fill();
      // Deviation lines to group mean
      ctx.strokeStyle = g.color + '44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx + jitter, toY(y)); ctx.lineTo(cx + jitter, toY(gm)); ctx.stroke();
    });

    // Group mean line
    ctx.strokeStyle = g.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - 22, toY(gm)); ctx.lineTo(cx + 22, toY(gm)); ctx.stroke();

    // Group label
    ctx.fillStyle = g.color; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(g.name, cx, pad.top + cH + 16);
    ctx.fillStyle = '#6a9dbf'; ctx.font = '11px Georgia';
    ctx.fillText('ȳ_g=' + gm.toFixed(2), cx, pad.top + cH + 30);
  });

  // Legend
  ctx.strokeStyle = 'rgba(243,156,18,0.7)'; ctx.setLineDash([6,4]); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad.left + 8, pad.top + 12); ctx.lineTo(pad.left + 30, pad.top + 12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f39c12'; ctx.font = '11px Georgia'; ctx.textAlign = 'left';
  ctx.fillText('overall mean ȳ', pad.left + 34, pad.top + 16);

  ctx.fillStyle = '#5a7a96'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('Group', pad.left + cW / 2, H - 6);
  ctx.save(); ctx.translate(14, pad.top + cH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('Y', 0, 0); ctx.restore();
}

function drawANCOVAplot(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  const xMin = 33, xMax = 43, yMin = 2600, yMax = 3600;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - ((v - yMin) / (yMax - yMin)) * cH;

  // Grid
  [34, 36, 38, 40, 42].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + cH); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '10px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v, toX(v), pad.top + cH + 16);
  });
  [2700, 2900, 3100, 3300, 3500].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, toY(v)); ctx.lineTo(pad.left + cW, toY(v)); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '10px Georgia'; ctx.textAlign = 'right';
    ctx.fillText(v, pad.left - 5, toY(v) + 4);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();

  // Smoker data
  const smokers = [[34.5,2750],[35.2,2820],[36.1,2900],[37.0,2880],[38.5,2950],[39.2,3020],[40.1,3080],[41.0,3020]];
  const nonSmokers = [[34.8,2950],[35.5,3020],[36.3,3100],[37.2,3200],[38.2,3260],[39.5,3310],[40.3,3380],[41.5,3450]];

  // Regression lines
  function linReg(pts) {
    const n = pts.length;
    const mx = pts.reduce((s,[x])=>s+x,0)/n;
    const my = pts.reduce((s,[,y])=>s+y,0)/n;
    const Sxy = pts.reduce((s,[x,y])=>s+(x-mx)*(y-my),0);
    const Sxx = pts.reduce((s,[x])=>s+(x-mx)**2,0);
    const b1 = Sxy/Sxx;
    const b0 = my - b1*mx;
    return {b0, b1};
  }
  const rs = linReg(smokers);
  const rn = linReg(nonSmokers);

  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(toX(xMin),toY(rs.b0+rs.b1*xMin)); ctx.lineTo(toX(xMax),toY(rs.b0+rs.b1*xMax)); ctx.stroke();

  smokers.forEach(([x,y]) => {

  nonSmokers.forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(toX(x),toY(y),4,0,Math.PI*2);
    ctx.fillStyle='rgba(41,128,185,0.8)'; ctx.fill();

  ctx.fillStyle='#e74c3c'; ctx.beginPath(); ctx.arc(pad.left+10,pad.top+10,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#8bbcd8'; ctx.font='11px Georgia'; ctx.textAlign='left'; ctx.fillText('Smokers',pad.left+18,pad.top+14);
  ctx.fillStyle='#2980b9'; ctx.beginPath(); ctx.arc(pad.left+10,pad.top+25,4,0,Math.PI*2); ctx.fill();
  ctx.fillText('Non-smokers',pad.left+18,pad.top+29);

  ctx.fillStyle='#5a7a96'; ctx.font='11px Georgia'; ctx.textAlign='center';
  ctx.fillText('Pregnancy duration (weeks)', pad.left+cW/2, H-6);
  ctx.save(); ctx.translate(14,pad.top+cH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Birth weight (g)',0,0); ctx.restore();
}

function drawScoreTest(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  function logGamma(x) {
    return (x-0.5)*Math.log(x)-x+0.5*Math.log(2*Math.PI)+1/(12*x);
  }
  function chi2pdf(x, df) {
    if (x <= 0) return 0;
    const k = df/2;
    return Math.exp((k-1)*Math.log(x) - x/2 - k*Math.log(2) - logGamma(k));
  }

  const xMin = 0, xMax = 12;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - v * cH * 3.2;

  [0,1,2,3,4,5,6,8,10,12].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top+cH); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v, toX(v), pad.top+cH+16);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top+cH); ctx.lineTo(pad.left+cW, pad.top+cH); ctx.stroke();

  const curves = [
    {df:1, color:'#2980b9', label:'χ²(1)'},
    {df:2, color:'#27ae60', label:'χ²(2)'},
    {df:3, color:'#e74c3c', label:'χ²(3)'},
  ];

  curves.forEach(({df, color, label}) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath();
    let first = true;
    for (let x=0.02; x<=xMax; x+=0.05) {
      const y = chi2pdf(x, df);
      if (y>1.2){first=true;continue;}
      first ? ctx.moveTo(toX(x), toY(y)) : ctx.lineTo(toX(x), toY(y));
      first=false;
    }
    ctx.stroke();
  });

  // Rejection region (alpha=0.05, df=1, chi2 crit ~ 3.84)
  const critVal = 3.84;
  ctx.fillStyle = 'rgba(231,76,60,0.15)';
  ctx.beginPath(); ctx.moveTo(toX(critVal), toY(0));
  for (let x=critVal; x<=xMax; x+=0.05) {
    ctx.lineTo(toX(x), toY(chi2pdf(x,1)));
  }
  ctx.lineTo(toX(xMax), toY(0)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(231,76,60,0.7)'; ctx.font='10px Georgia'; ctx.textAlign='center';
  ctx.fillText('α', toX(critVal+0.7), toY(0.015));
  ctx.strokeStyle='rgba(231,76,60,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(toX(critVal), pad.top); ctx.lineTo(toX(critVal), pad.top+cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#e74c3c'; ctx.font='10px Georgia'; ctx.textAlign='center';
  ctx.fillText('3.84', toX(critVal), pad.top+cH+28);

  let ly = pad.top + 10;
  curves.forEach(({color, label}) => {
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(pad.left+cW-110, ly); ctx.lineTo(pad.left+cW-88, ly); ctx.stroke();
    ctx.fillStyle='#8bbcd8'; ctx.font='11px Georgia'; ctx.textAlign='left';
    ctx.fillText(label, pad.left+cW-84, ly+4);
    ly+=16;
  });

  ctx.fillStyle='#5a7a96'; ctx.font='12px Georgia'; ctx.textAlign='center';
  ctx.fillText('Test statistic', pad.left+cW/2, H-6);
}

  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;

    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v, toX(v), pad.top + cH + 16);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;

  ctx.fillText('η = β₀ + β₁x (linear predictor)', pad.left + cW / 2, H - 6);

}

  const W = c.width, H = c.height;
  const pad = { top: 30, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  const xMin = 0.01, xMax = 0.99;
  const yMin = -5, yMax = 5;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - ((v - yMin) / (yMax - yMin)) * cH;

  [0,0.25,0.5,0.75,1].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + cH); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v.toFixed(2), toX(v), pad.top + cH + 16);
  });
  [-4,-2,0,2,4].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, toY(v)); ctx.lineTo(pad.left + cW, toY(v)); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'right';
    ctx.fillText(v, pad.left - 5, toY(v) + 4);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();

  // logit curve
  ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let first = true;
  for (let p = 0.01; p <= 0.99; p += 0.005) {
    const y = Math.log(p / (1 - p));
    if (y < yMin || y > yMax) { first = true; continue; }
    first ? ctx.moveTo(toX(p), toY(y)) : ctx.lineTo(toX(p), toY(y));
    first = false;
  }
  ctx.stroke();

  // zero line
  ctx.strokeStyle = '#1e3a50'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, toY(0)); ctx.lineTo(pad.left + cW, toY(0)); ctx.stroke();

  ctx.fillStyle = '#e74c3c'; ctx.font = '12px Georgia'; ctx.textAlign = 'left';
  ctx.fillText('logit(π) = log(π/(1−π))', toX(0.05), toY(3.8));

  ctx.fillStyle = '#5a7a96'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('π (probability)', pad.left + cW / 2, H - 6);
  ctx.save(); ctx.translate(14, pad.top + cH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('logit(π)', 0, 0); ctx.restore();
}

function drawThresholdModel(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 20, right: 30, bottom: 55, left: 60 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  function normalPDF(x, mu, sigma) {
    return Math.exp(-0.5 * ((x - mu) / sigma) ** 2) / (sigma * Math.sqrt(2 * Math.PI));
  }

  const mu = 1.5; // xT beta
  const sigma = 1;
  const xMin = -4, xMax = 6;
  const yMax = 0.45;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - (v / yMax) * cH;

  // x-axis
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();
  [-4,-2,0,2,4,6].forEach(v => {
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v, toX(v), pad.top + cH + 16);
  });

  const k = 0; // threshold k=0
  const kX = toX(k);

  // Fill Y=0 region (left of k)
  ctx.fillStyle = 'rgba(41,128,185,0.20)';
  ctx.beginPath(); ctx.moveTo(toX(xMin), toY(0));
  for (let x = xMin; x <= k; x += 0.05) {
    ctx.lineTo(toX(x), toY(normalPDF(x, mu, sigma)));
  }
  ctx.lineTo(kX, toY(0)); ctx.closePath(); ctx.fill();

  // Fill Y=1 region (right of k)
  ctx.fillStyle = 'rgba(231,76,60,0.20)';
  ctx.beginPath(); ctx.moveTo(kX, toY(0));
  for (let x = k; x <= xMax; x += 0.05) {
    ctx.lineTo(toX(x), toY(normalPDF(x, mu, sigma)));
  }
  ctx.lineTo(toX(xMax), toY(0)); ctx.closePath(); ctx.fill();

  // Normal curve
  ctx.strokeStyle = '#8bbcd8'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let first = true;
  for (let x = xMin; x <= xMax; x += 0.05) {
    const y = normalPDF(x, mu, sigma);
    first ? ctx.moveTo(toX(x), toY(y)) : ctx.lineTo(toX(x), toY(y));
    first = false;
  }
  ctx.stroke();

  // Threshold line k=0
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(kX, pad.top); ctx.lineTo(kX, pad.top + cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f39c12'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('k=0', kX, pad.top + 10);
  ctx.fillText('threshold', kX, pad.top + 22);

  // Mean marker
  ctx.strokeStyle = '#27ae60'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(toX(mu), pad.top); ctx.lineTo(toX(mu), pad.top + cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#27ae60'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('x͂ᵀβ', toX(mu), pad.top + cH + 30);

  // Labels
  ctx.fillStyle = '#2980b9'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('Y=0', toX(-1.5), toY(0.05));
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('Y=1', toX(3.2), toY(0.05));

  // 1-pi and pi labels
  ctx.fillStyle = '#2980b9'; ctx.font = '11px Georgia';
  ctx.fillText('1−π = P(Z≤0)', toX(-1.5), toY(0.13));
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('π = P(Z>0)', toX(3.0), toY(0.10));

  ctx.fillStyle = '#5a7a96'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('Z̃ ~ N(x͂ᵀβ, 1)  (latent variable)', pad.left + cW / 2, H - 6);
}

function drawOddsRatio(canvasId) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = { top: 30, right: 40, bottom: 55, left: 70 };
  const cW = W - pad.left - pad.right;
  const cH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#08111a';
  ctx.fillRect(0, 0, W, H);

  // Show odds = pi/(1-pi) as function of pi
  const xMin = 0.01, xMax = 0.95;
  const yMin = 0, yMax = 20;
  const toX = v => pad.left + ((v - xMin) / (xMax - xMin)) * cW;
  const toY = v => pad.top + cH - ((v - yMin) / (yMax - yMin)) * cH;

  [0,5,10,15,20].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, toY(v)); ctx.lineTo(pad.left + cW, toY(v)); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'right';
    ctx.fillText(v, pad.left - 5, toY(v) + 4);
  });
  [0, 0.25, 0.5, 0.75].forEach(v => {
    ctx.strokeStyle = '#1a3048'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(toX(v), pad.top); ctx.lineTo(toX(v), pad.top + cH); ctx.stroke();
    ctx.fillStyle = '#4a6a80'; ctx.font = '11px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(v.toFixed(2), toX(v), pad.top + cH + 16);
  });
  ctx.strokeStyle = '#2a4a60'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + cH); ctx.lineTo(pad.left + cW, pad.top + cH); ctx.stroke();

  // odds curve
  ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  let first = true;
  for (let p = 0.01; p <= 0.95; p += 0.005) {
    const odds = p / (1 - p);
    if (odds > yMax) { first = true; continue; }
    first ? ctx.moveTo(toX(p), toY(odds)) : ctx.lineTo(toX(p), toY(odds));
    first = false;
  }
  ctx.stroke();

  // pi=0.5 marker
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(toX(0.5), pad.top); ctx.lineTo(toX(0.5), pad.top + cH); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#5a7a96'; ctx.font = '10px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('π=0.5', toX(0.5), pad.top + cH + 30);
  ctx.fillStyle = '#4a6a80'; ctx.font = '10px Georgia';
  ctx.fillText('odds=1', pad.left - 5, toY(1) + 4);

  ctx.fillStyle = '#e67e22'; ctx.font = '12px Georgia'; ctx.textAlign = 'left';
  ctx.fillText('odds = π/(1−π)', toX(0.05), toY(14));

  ctx.fillStyle = '#5a7a96'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
  ctx.fillText('probability π', pad.left + cW / 2, H - 6);
  ctx.save(); ctx.translate(14, pad.top + cH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('odds', 0, 0); ctx.restore();
}

**Likelihood equation** (necessary condition for interior maximum):
$$\\ell_\\theta(\\hat{\\theta}) = 0$$

**Claim:** $T_1 \\sim t_{n-2}$, the Student-$t$ distribution with $n-2$ degrees of freedom.

$$T_1 = \\frac{\\hat{B}_1-\\beta_1}{\\sigma/\\sqrt{S_{xx}}} \\cdot \\frac{\\sigma}{S} = \\frac{\\hat{B}_1-\\beta_1}{S/\\sqrt{S_{xx}}} \\sim t_{n-2}$$

        title: "Motivation: Null vs Full Model",
        content: `We want to study (and make predictions on) a random variable $Y$, and we observe $(y_1, \\ldots, y_n)$.

**In the absence of information**, the "best" way to describe the data is through the overall mean $\\bar{y}$.

This corresponds to fitting the **null model:**
$$Y_i = \\beta_0 + \\varepsilon_i \\quad \\text{(constant estimate: } \\hat{\\beta}_0 = \\bar{y}\\text{)}$$

With this model, the best prediction is $\\bar{y}$ for all $i$.

**Introducing a covariate** $x = (x_1, \\ldots, x_n)$: we fit the **full model**
$$Y_i = \\beta_0 + \\beta_1 x_i + \\varepsilon_i \\quad \\sim N(\\beta_0+\\beta_1 x_i,\\ \\sigma^2)$$

and the error we commit is now $y_i - \\hat{y}_i = e_i$.

**Key question:** how much does including $x$ improve the prediction of $Y$?

We want to **partition the variability of $Y$** (SST) into two parts:
1. The additional variability **explained by the model** (how much better is $\\hat{y}_i$ compared to $\\bar{y}$ at explaining $Y$?) → **Regression Sum of Squares: SSR**
2. The variation that is still **unexplained** by the model → **Residual (Error) Sum of Squares: SSE**

The chart shows the geometric interpretation: for a highlighted point, the deviation $y_i - \\bar{y}$ (SST, purple) splits into $\\hat{y}_i - \\bar{y}$ (SSR, blue) and $y_i - \\hat{y}_i$ (SSE, green).`,
        chart: 'ss_decomp',
      },
      {
        title: "The SS Decomposition (Derivation)",
        content: `**Define** the three quantities for $i = 1, \\ldots, n$:
- Observed: $y_i$
- Predicted: $\\hat{y}_i = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_i$
- Residuals: $e_i = y_i - \\hat{y}_i$

**Algebraic derivation** — start from the identity $y_i - \\bar{y} = (\\hat{y}_i - \\bar{y}) + (y_i - \\hat{y}_i)$, then square and sum:

$$\\sum_{i=1}^n (y_i-\\bar{y})^2 = \\sum_{i=1}^n(\\hat{y}_i - \\bar{y})^2 + \\sum_{i=1}^n(y_i-\\hat{y}_i)^2$$

$$\\text{SST} = \\text{SSR} + \\text{SSE}$$

The cross-term $2\\hat{\\beta}_1\\sum_i(x_i-\\bar{x})(y_i-\\bar{y}) - 2\\hat{\\beta}_1^2 S_{xx} = 0$ vanishes because $\\hat{\\beta}_1 = S_{xy}/S_{xx}$.

**Summary:**

| Symbol | Name | Formula | Meaning |
|---|---|---|---|
| SST | Total Sum of Squares | $\\sum(y_i-\\bar{y})^2$ | Total variability of $Y$ around $\\bar{y}$ |

3. **Model checking** ← *we now focus on this*

The inference we carried out was performed under the assumption that the model hypotheses were met. After fitting the model, we must evaluate the validity of those assumptions.

We want to define a set of tools (plots, tests) to evaluate whether the assumptions at the basis of the specified and fitted model are satisfied.

**The four key assumptions** we need to check are:

1. **Normality** — $\\varepsilon_i \\sim N(0, \\sigma^2)$: we assume that $(y_1, \\ldots, y_n)$ is a sample from some normal distribution.

$$F = \\frac{\\dfrac{\\tilde{\\sigma}^2 - \\hat{\\sigma}^2}{p - p_0}}{\\dfrac{\\hat{\\sigma}^2}{n-p}} \\overset{H_0}{\\sim} F_{p-p_0,\\;n-p}$$

$$F = \\frac{\\tilde{\\boldsymbol{\\varepsilon}}^T\\tilde{\\boldsymbol{\\varepsilon}} - \\hat{\\boldsymbol{\\varepsilon}}^T\\hat{\\boldsymbol{\\varepsilon}}}{p-p_0} \\cdot \\frac{n-p}{\\hat{\\boldsymbol{\\varepsilon}}^T\\hat{\\boldsymbol{\\varepsilon}}} = \\frac{SSE_{H_0} - SSE_{H_1}}{p-p_0} \\cdot \\frac{n-p}{SSE_{H_1}}$$

**Intuition:** We are comparing how much worse the restricted model is at fitting the data:
- If $H_0$ is true: removing $\\boldsymbol{\\beta}^{(1)}$ doesn't matter much — $\\tilde{\\sigma}^2 \\approx \\hat{\\sigma}^2$, so $F \\approx 0$
- If $H_0$ is false: the restricted model fits worse — $\\tilde{\\sigma}^2 \\gg \\hat{\\sigma}^2$, so $F \\gg 0$

**Fixed significance level $\\alpha$:**
If we fix the significance level $\\alpha$, the cutoff $k$ is the quantile of level $(1-\\alpha)$ of an $F_{p-p_0,n-p}$ distribution:
$$\\mathcal{R} = (F_{p-p_0,n-p,1-\\alpha},\\;+\\infty)$$

Compute $F^{obs} = \\frac{\\tilde{\\sigma}^2 - \\hat{\\sigma}^2}{\\hat{\\sigma}^2/(n-p)} \\cdot \\frac{1}{p-p_0}$ and reject $H_0$ if $F^{obs} > F_{p-p_0,n-p,1-\\alpha}$.

$$R^2_{\\text{adj}} = 1 - (1 - R^2) \\cdot \\frac{n-1}{n-p}$$

It is "adjusted" for the model dimension $p$. It **penalises models with many covariates**.

**Behaviour when I introduce a new covariate:**
- $R^2$ can remain the same or **increase** (never decreases)

Under the null (Poisson model is correct): $X^2 \\overset{H_0}{\\sim} \\chi^2_{n-p}$ asymptotically.

Both $D$ and $X^2$ are used for goodness-of-fit; they are asymptotically equivalent.

**Overdispersion:**

A key assumption of the Poisson model is **equidispersion**: $\\text{Var}(Y_i) = E[Y_i] = \\lambda_i$.

In practice, count data often exhibit **overdispersion**: $\\text{Var}(Y_i) > E[Y_i]$.

**Detection:** compute the dispersion ratio:

- Wald tests are **too liberal** (false positives)

$$\\Rightarrow \\pi_i = \\Phi(\\mathbf{x}_i^\\top\\boldsymbol{\\beta})$$

**(d)** What would happen to the MLE if the data were completely separated (e.g. $y_i = \\mathbb{1}[x_i \\geq 1]$)?`,
    hint: "ℓ = Σᵢ[yᵢηᵢ − log(1+exp(ηᵢ))]. Score: ∂ℓ/∂β₀ = Σ(yᵢ−πᵢ), ∂ℓ/∂β₁ = Σxᵢ(yᵢ−πᵢ).",
    solution: `**(a)** $\\ell = [1 \\cdot \\beta_0 - \\log(1+e^{\\beta_0})] + [0 \\cdot (\\beta_0+\\beta_1) - \\log(1+e^{\\beta_0+\\beta_1})] + [1\\cdot(\\beta_0+2\\beta_1) - \\log(1+e^{\\beta_0+2\\beta_1})]$
$= 2\\beta_0 + 2\\beta_1 - \\log(1+e^{\\beta_0}) - \\log(1+e^{\\beta_0+\\beta_1}) - \\log(1+e^{\\beta_0+2\\beta_1})$

**(b)**
$\\partial\\ell/\\partial\\beta_0 = (1-\\pi_1) + (0-\\pi_2) + (1-\\pi_3) = 2 - (\\pi_1+\\pi_2+\\pi_3) = 0$

$\\partial\\ell/\\partial\\beta_1 = 0\\cdot(1-\\pi_1) + 1\\cdot(0-\\pi_2) + 2\\cdot(1-\\pi_3) = 2 - \\pi_2 - 2\\pi_3 = 0$

**(c)** From $\\partial\\ell/\\partial\\beta_0 = 0$: $\\sum \\hat{\\pi}_i = 2 = \\sum y_i$. ✓ General property of the MLE with an intercept.

**(d)** With $y_i = \\mathbb{1}[x_i \\geq 1]$ (perfect separation): the log-likelihood increases without bound as $\\beta_1 \\to +\\infty$. The MLE **does not exist** (or $\\hat{\\beta}_1 = +\\infty$).`,

| Coefficient | Estimate | Std. Error |
|---|---|---|
| $\\hat{\\beta}_0$ | $-4.20$ | $0.85$ |
| $\\hat{\\beta}_1$ | $1.10$ | $0.30$ |

**(a)** Test $H_0: \\beta_1 = 0$ using a Wald test at $\\alpha = 0.05$ (critical value $z_{0.025} = 1.96$).

**(b)** Compute a 95% CI for $\\beta_1$ and for the odds ratio $e^{\\beta_1}$.

**(c)** Interpret the estimated odds ratio in context.

**(d)** Compute $\\hat{\\pi}$ for a subject aged 50 years (note: $X$ = age in decades, so $x = 5$).`,
    hint: "Wald z = β̂/se. 95% CI for β: β̂ ± 1.96·se. Exponentiate for OR CI. π̂ = 1/(1+exp(−η̂)).",
    solution: `**(a)** $z = 1.10/0.30 = 3.67 > 1.96$. We **reject $H_0$** at $\\alpha = 0.05$. Age has a significant positive effect on disease probability.

**(c)** $e^{1.10} \\approx 3.00$: each additional decade of age multiplies the **odds of disease** by approximately 3 (300% increase in odds).

**(d)** $x=5$: $\\hat{\\eta} = -4.20 + 1.10 \\times 5 = 1.30$. $\\hat{\\pi} = 1/(1+e^{-1.30}) \\approx 0.785$ (78.5% estimated probability of disease).`,

**(b)** If we refit using logistic regression and obtain approximately $\\hat{\\beta}_1^{\\text{logit}} \\approx 1.6 \\times 0.8 = 1.28$, compute the logistic fitted probability at $x=1$.

**(c)** What is the threshold model interpretation of the probit model here? Describe the latent variable $Z_i$.

function renderMarkdown(text, topicColor) {
  if (!text) return "";
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("---")) {
      html += `<hr style="border:none;border-top:1px solid #1a3048;margin:16px 0">`;
    } else if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

function buildPicker() {
  const grid = document.getElementById('picker-grid');
  ALL_LECTURES.forEach((L, i) => {
    const card = document.createElement('div');
    card.className = 'lec-card';
    card.style.borderColor = '#1a3048';
    card.onmouseover = () => card.style.borderColor = L.accent;
    card.onmouseout  = () => card.style.borderColor = '#1a3048';
    card.innerHTML = `
      <div class="lec-num" style="color:${L.accent}">Lecture ${L.num} — ${L.course}</div>
      <div class="lec-title">${L.subtitle}</div>
      <div style="font-size:12px;color:#3a5a70;margin-top:6px;line-height:1.4">${L.bigTitle}</div>
    `;
    card.onclick = () => openLecture(i);
    grid.appendChild(card);
  });
}

  // ── STUDY TAB ───────────────────────────────────────────────────────────────
  if (activeTab === "learn") {
    html += `<div style="display:flex;height:calc(100vh - 65px)">
      <div style="width:215px;background:#0a1825;border-right:1px solid #1a3048;overflow-y:auto;flex-shrink:0">`;

    topics.forEach(topic => {
      const isActive = activeTopic === topic.id;
      html += `<div>
        <button onclick="selectTopic('${topic.id}')" style="width:100%;padding:12px 14px;text-align:left;border:none;cursor:pointer;background:${isActive?'#111e2d':'transparent'};border-left:${isActive?`3px solid ${topic.color}`:'3px solid transparent'};color:${isActive?'#e0ecfa':'#5a7a96'};display:flex;gap:8px;align-items:center;font-size:12px">
          <span>${topic.icon}</span><span style="flex:1;line-height:1.3">${topic.label}</span>
        </button>`;
      if (isActive) {
        topic.sections.forEach((s, i) => {
          html += `<button onclick="selectSection(${i})" style="width:100%;padding:7px 14px 7px 34px;text-align:left;border:none;cursor:pointer;background:${activeSection===i?'#132030':'transparent'};color:${activeSection===i?topic.color:'#4a6a80'};font-size:11px;line-height:1.35">${s.title}</button>`;
        });
      }
      html += `</div>`;
    });

    html += `</div><div style="flex:1;overflow-y:auto;padding:28px 40px">`;

    if (currentSec) {
      html += `
        <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:${currentTopic.color};margin-bottom:8px">${currentTopic.icon} ${currentTopic.label}</div>
        <h1 style="font-size:22px;color:#e8f0f8;margin-bottom:20px;border-bottom:1px solid #1a3048;padding-bottom:12px">${currentSec.title}</h1>
        <div style="line-height:1.85;max-width:740px">
          ${renderMarkdown(currentSec.content, currentTopic.color)}
          ${currentSec.chart ? chartHTML(currentSec.chart) : ''}
        </div>
        <div style="display:flex;gap:12px;margin-top:40px">`;

      if (activeSection > 0) {
        html += `<button onclick="selectSection(${activeSection-1})" style="padding:8px 20px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`;
      }
      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:8px 20px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:8px 20px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div></div></div></div>`;
    }
  }

  // ── FLASHCARDS TAB ──────────────────────────────────────────────────────────
  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:40px 20px">
      <div style="margin-bottom:20px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:260px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:32px;cursor:pointer;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':accent};margin-bottom:14px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:15px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:20px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:24px">
        <button onclick="prevCard()" style="padding:8px 20px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:8px 20px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:8px 20px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:24px;flex-wrap:wrap;justify-content:center;max-width:500px">
        ${flashcards.map((_,i)=>`<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?accent:'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  // ── EXERCISES TAB ───────────────────────────────────────────────────────────
  if (activeTab === "exercises") {
    if (activeExercise === null) {
      html += `<div style="max-width:780px;margin:0 auto;padding:36px 28px">
        <h2 style="font-size:20px;color:#e8f0f8;margin-bottom:6px">Exercises — Lecture ${L.num}</h2>
        <p style="color:#5a7a96;font-size:13px;margin-bottom:32px">Click an exercise to open it.</p>`;
      exercises.forEach((ex, i) => {
        html += `
        <div onclick="openExercise(${i})" style="background:#0d1825;border:1px solid #1a3048;border-radius:10px;padding:20px 24px;margin-bottom:14px;cursor:pointer;transition:border-color 0.2s" onmouseover="this.style.borderColor='${accent}'" onmouseout="this.style.borderColor='#1a3048'">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <span style="font-size:13px;font-weight:bold;color:#e8f0f8">${ex.title}</span>
            <span style="font-size:11px;padding:2px 10px;border-radius:20px;background:${diffBg[ex.difficulty]};color:${diffColor[ex.difficulty]};border:1px solid ${diffColor[ex.difficulty]}33">${ex.difficulty}</span>
          </div>
          <p style="font-size:13px;color:#5a7a96;line-height:1.6">${ex.statement.replace(/\*\*(.*?)\*\*/g,'<strong style="color:#8bbcd8">$1</strong>').split('\n')[0]}</p>
        </div>`;
      });
      html += `</div>`;
    } else {
      const ex = exercises[activeExercise];
      html += `<div style="max-width:780px;margin:0 auto;padding:36px 28px">
        <button onclick="closeExercise()" style="padding:7px 16px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px;margin-bottom:24px">← Back to list</button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
          <h2 style="font-size:19px;color:#e8f0f8">${ex.title}</h2>
          <span style="font-size:11px;padding:2px 10px;border-radius:20px;background:${diffBg[ex.difficulty]};color:${diffColor[ex.difficulty]};border:1px solid ${diffColor[ex.difficulty]}44">${ex.difficulty}</span>
        </div>
        <div style="background:#0d1825;border:1px solid #1a3048;border-radius:10px;padding:22px 26px;margin-bottom:16px">
          <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:${accent};margin-bottom:10px">📋 Statement</div>
          <div style="line-height:1.85">${renderMarkdown(ex.statement, accent)}</div>
        </div>
        <div style="margin-bottom:14px">
          <button onclick="toggleHint()" style="padding:8px 20px;background:${showHint?'#0f2218':'#111e2d'};border:1px solid ${showHint?'#1e5c34':'#1a3048'};border-radius:7px;color:${showHint?'#27ae60':'#7a9bb8'};cursor:pointer;font-size:13px">${showHint?'🔼 Hide Hint':'💡 Show Hint'}</button>
        </div>
        ${showHint?`<div style="background:#0a1e12;border:1px solid #1e5c34;border-radius:10px;padding:18px 22px;margin-bottom:16px;color:#8fe0b0;font-style:italic">${renderMarkdown(ex.hint,"#27ae60")}</div>`:''}
        <div style="margin-bottom:14px">
          <button onclick="toggleSolution()" style="padding:8px 20px;background:${showSolution?'#1e1200':'#111e2d'};border:1px solid ${showSolution?'#c0732b':'#1a3048'};border-radius:7px;color:${showSolution?'#e09040':'#7a9bb8'};cursor:pointer;font-size:13px">${showSolution?'🔼 Hide Solution':'✅ Show Solution'}</button>
        </div>
        ${showSolution?`<div style="background:#0f1510;border:1px solid #2a4020;border-radius:10px;padding:22px 26px;margin-bottom:16px">
          <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#f39c12;margin-bottom:10px">✅ Solution</div>
          <div style="line-height:1.9">${renderMarkdown(ex.solution,"#27ae60")}</div>
        </div>`:''}
        <div style="display:flex;gap:12px;margin-top:28px">
          ${activeExercise>0?`<button onclick="openExercise(${activeExercise-1})" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`:''}
          ${activeExercise<exercises.length-1?`<button onclick="openExercise(${activeExercise+1})" style="padding:9px 22px;background:${accent};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`:''}
        </div>
      </div>`;
    }
  }

  html += `</div>`;
  const chartsToRender = _pendingCharts.splice(0);
  document.getElementById('app').innerHTML = html;
  setTimeout(() => {
    chartsToRender.forEach(({ id, fn, arg }) => {
      const draw = window[fn];
      if (draw) {
        if (arg !== undefined && arg !== null) draw(id, arg);
        else draw(id);
      }
    });
    if (window.MathJax) MathJax.typesetPromise();
  }, 0);
}

// ─── EVENT HANDLERS ───────────────────────────────────────────────────────────
function switchTab(tab) { activeTab=tab; activeExercise=null; showSolution=false; showHint=false; render(); }
function selectTopic(id) { activeTopic=id; activeSection=0; render(); }
function selectSection(i) { activeSection=i; render(); }
function flipCard() { flipped=!flipped; render(); }
function prevCard() { cardIndex=(cardIndex-1+ALL_LECTURES[currentLecIdx].flashcards.length)%ALL_LECTURES[currentLecIdx].flashcards.length; flipped=false; render(); }
function nextCard() { cardIndex=(cardIndex+1)%ALL_LECTURES[currentLecIdx].flashcards.length; flipped=false; render(); }
function goToCard(i) { cardIndex=i; flipped=false; render(); }
function openExercise(i) { activeExercise=i; showSolution=false; showHint=false; render(); }
function closeExercise() { activeExercise=null; showSolution=false; showHint=false; render(); }
function toggleSolution() { showSolution=!showSolution; render(); }
function toggleHint() { showHint=!showHint; render(); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildPicker();
</script>
</body>
</html>
