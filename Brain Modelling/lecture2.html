**Cell body (soma)**:
- Contains the nucleus and organelles
- Metabolic centre of the neuron

**Dendrites (input structure)**:
- Receive inputs from other neurons
- Perform *spatio-temporal integration* of inputs
- Relay integrated signals to the cell body

**Axon (output structure)**:
- A long fiber that carries messages (**spikes**) away from the cell body
- Terminates at **axon terminals (synapses)** onto dendrites of other neurons

**Signal flow**: Dendrites → Cell body → Axon hillock → Axon → Axon terminals`,

**Key concept — hydration shell**:
- Ions in solution are surrounded by a cloud of water molecules (waters of hydration), attracted by the ion's net charge
- This shell **increases the effective size** of the ion

- Na⁺ has a *smaller crystal radius* than K⁺

        title: "Cerebellum as a Microcircuit Example",
        content: `The **cerebellum** is an ideal example of a well-characterized microcircuit, organized in the cortex (3 layers) and deep nuclei.

**Cerebellar cortex layers**:
- *Molecular layer* — dendrites of Purkinje cells + axons of granule cells (parallel fibers)
- *Purkinje layer* — cell bodies of Purkinje cells
- *Granular layer* — granule cells and Golgi cells

**Key cell types**:
- *Purkinje cell (PC)* — **largest neuron in the brain**; the sole output of the cerebellar cortex; **inhibitory**
- *Granule cell (GrC)* — **smallest and most numerous** neurons in the brain; excitatory; receive mossy fiber input
- *Golgi cell (GoC)* — inhibitory interneuron; regulates granule cell activity
- *Basket cell (BC)* and *Stellate cell (SC)* — inhibitory interneurons in the molecular layer

> ⚠️ **Almost all neurons in the cerebellar cortex are inhibitory** — the only excitatory neurons are granule cells.

**Inputs**:
- *Mossy fibers (mf)* → contact granule cells
- *Climbing fibers (cf)* from inferior olive → directly contact Purkinje cells`,
      },
      {
        title: "Neurotransmitter Systems & Disease",
        content: `Different neurotransmitter systems modulate different brain circuits and are altered in various diseases.

**Dopaminergic system**:
- Prefrontal cortex ↓, Ventral tegmental area ↓, Striatum ↑
- Implicated in: schizophrenia, Parkinson's disease, addiction

**Glutamatergic system**:
- Cortex ↓, Striatum ↓, Hippocampus ↓
- Implicated in: schizophrenia, epilepsy, depression

**Serotonergic system**:
- Prefrontal cortex ↓, Basal ganglia ↑
- Implicated in: depression, anxiety, OCD

**GABAergic system**:
- Prefrontal cortex ↓, Basal ganglia ↑, Thalamus ↑, Hippocampus ↑
- Implicated in: schizophrenia, epilepsy, anxiety

**Cholinergic system**:
- Dorsolateral prefrontal cortex ↓, Cingulate gyrus ↓, Hippocampus ↓
- Implicated in: Alzheimer's disease, schizophrenia

**Multiscale brain modelling** (D'Angelo & Jirsa 2022):
- *Detailed/simplified neuron models* → *Spiking neural networks (SNN)* → *Mean-field models* → *Neural mass models* + *Connectome* → *Virtual brain models* → link to behavior`,
      },
    ],
  },
];

const flashcards = [
  { q: "What are the three main types of glial cells and their primary functions?", a: "Astrocytes: support, nutrition, regulate extracellular space, clear neurotransmitters. Oligodendrocytes: form myelin in the CNS for faster impulse conduction. Microglia: phagocytose damaged material and eliminate unused synapses." },
  { q: "Why do ion channels show selectivity — specifically why does K⁺ pass through a K⁺ channel but Na⁺ does not?", a: "Although Na⁺ has a smaller crystal radius, its charge is more concentrated, so it attracts water more strongly. Its hydrated size is therefore larger than hydrated K⁺. The K⁺ channel pore can replace K⁺'s water shell effectively, but cannot do the same for the smaller Na⁺ ion, so Na⁺ cannot pass." },
  { q: "What are the four types of stimuli that control ion channel gating?", a: "Ligand-gated (ligand binding opens channel), Phosphorylation-gated (protein phosphorylation/dephosphorylation), Voltage-gated (change in membrane potential causes conformational change), Stretch-gated (mechanical stretch/pressure via cytoskeleton)." },
  { q: "What is the Goldman-Hodgkin-Katz equation and what does it calculate?", a: "V_m = 60 log ([K⁺]_o + α[Na⁺]_o) / ([K⁺]_i + α[Na⁺]_i), where α = P_Na/P_K. It calculates the resting membrane potential accounting for the relative permeabilities of both K⁺ and Na⁺ across the membrane." },
  { q: "What are the roles of Na⁺ channels and K⁺ channels during the three main phases of an action potential?", a: "Depolarization: Na⁺ channels OPEN → Na⁺ influx → V rises to ~+40 mV. Na⁺ channels then close (inactivate). Repolarization: K⁺ channels OPEN → K⁺ efflux → V falls back toward rest. Hyperpolarization: K⁺ channels stay open briefly → V dips below resting potential." },
  { q: "What is the difference between the absolute and relative refractory period?", a: "Absolute: it is impossible to fire another AP (Na⁺ channels are inactivated). Relative: a stronger-than-normal stimulus can fire an AP (some Na⁺ channels have recovered, but K⁺ channels are still partially open causing hyperpolarization)." },
  { q: "What are the 11 sequential steps of synaptic transmission at a chemical synapse?", a: "(1) Transmitter synthesized/stored in vesicles, (2) AP invades terminal, (3) presynaptic depolarization opens Ca²⁺ channels, (4) Ca²⁺ influx, (5) Ca²⁺ causes vesicle fusion, (6) transmitter released by exocytosis, (7) transmitter binds postsynaptic receptors, (8) postsynaptic channels open/close, (9) EPSP/IPSP changes excitability, (10) transmitter removed by glial uptake or degradation, (11) vesicle membrane retrieved by endocytosis." },
  { q: "What is the difference between ionotropic and metabotropic neurotransmitter receptors?", a: "Ionotropic: receptor IS the ion channel; binding opens it directly; fast (ms). Metabotropic (GPCR): receptor activates intracellular G-protein → signaling cascade; slower (seconds/minutes) but longer-lasting and more diverse effects." },
  { q: "What are the three properties of short-term synaptic plasticity (STSP)?", a: "Synaptic Facilitation: second stimulus produces larger EPSP (due to residual Ca²⁺). Synaptic Depression: second stimulus produces smaller EPSP (due to vesicle depletion). Post-tetanic Potentiation (PTP): minutes-long enhancement after a brief high-frequency train of spikes (tetanus)." },
  { q: "Compare LTP and LTD: what induces them and what are the key molecular mechanisms?", a: "LTP: induced by HIGH-frequency stimulation → NMDA receptor activation → Ca²⁺ influx → protein kinases → phosphorylation → more AMPA receptors inserted → stronger synapse. LTD: induced by LOW-frequency stimulation → different receptor activation → protein phosphatases → AMPA receptors removed → weaker synapse." },
  { q: "What is shunting inhibition and why is it functionally important?", a: "Shunting inhibition occurs when inhibitory signals near the cell body increase membrane conductance (reduce resistance), creating a 'short circuit' that reduces the effectiveness of excitatory inputs without necessarily hyperpolarizing the cell. It fine-tunes the E/I balance and regulates neuronal excitability." },
  { q: "What are the four patch-clamp configurations and what does each measure?", a: "Cell-attached: single-channel currents through a sealed membrane patch. Whole-cell: full membrane potential (current clamp) or whole-cell currents (voltage clamp). Inside-out: isolated patch with cytoplasmic side facing bath. Outside-out: isolated patch with extracellular side facing bath (for applying ligands)." },
  { q: "What is the difference between current clamp and voltage clamp recording modes?", a: "Current clamp: current is injected, membrane voltage is free to change — records postsynaptic POTENTIALS (PSPs, including EPSPs and IPSPs). Voltage clamp: voltage is held constant by feedback — records the postsynaptic CURRENTS (PSCs, EPSCs, IPSCs) flowing through ion channels." },
  { q: "What are the five EEG frequency bands and their associated brain states?", a: "Delta (0.5–4 Hz): sleep/dreaming. Theta (4–8 Hz): drowsiness. Alpha (8–13 Hz): restful/reflective. Beta (13–30 Hz): active/busy mind. Gamma (31–100 Hz): problem solving/concentration." },
  { q: "What is the key trade-off between different brain recording techniques (e.g. single-cell vs. EEG)?", a: "Single-cell recording and MEA have excellent temporal (<1 ms) and spatial resolution but limited brain coverage. EEG covers large areas non-invasively but has poor spatial resolution. fMRI has good spatial resolution (~mm) but poor temporal resolution (~1 s). Higher resolution in one dimension usually means lower resolution in the other." },
  { q: "What is the structure and function of the cerebellar microcircuit?", a: "Mossy fibers → Granule cells (excitatory, smallest neurons) → parallel fibers → Purkinje cells (largest neurons, inhibitory, sole output). Climbing fibers from inferior olive directly contact Purkinje cells. Golgi cells inhibit granule cells. Almost all cerebellar cortex neurons are inhibitory except granule cells." },
  { q: "What is the EPSP magnitude and latency, and how does IPSP compare?", a: "EPSP: magnitude ~8 mV, latency ~0.5 ms (caused by influx of positively charged ions, mainly Na⁺). IPSP: magnitude ~−2 mV (caused by efflux of positive ions like K⁺, or influx of negative ions like Cl⁻). EPSPs depolarize; IPSPs hyperpolarize." },
  { q: "What is spike sorting in MEA data analysis?", a: "Spike sorting is the process of classifying detected spikes (action potentials) by their waveform shape using PCA (principal component analysis). Spikes from different neurons on the same electrode have different shapes, so they can be separated into distinct 'units' representing individual neurons." },
];

// State
let activeTab = "learn";
let activeTopic = topics[0].id;
let activeSection = 0;
let cardIndex = 0;
let flipped = false;

function renderMarkdown(text, topicColor) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

function render() {
  const currentTopic = topics.find(t => t.id === activeTopic);
  const currentSec = currentTopic?.sections[activeSection];

  let html = `
  <div style="min-height:100vh;background:#08111a;color:#cdd9e5;font-family:'Georgia',serif;font-size:15px">
    <div style="background:#0d1d2e;border-bottom:1px solid #1a3048;padding:16px 28px;display:flex;align-items:center;gap:16px">
      <div style="flex:1">
        <div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#c0392b;margin-bottom:3px">Neuroscience — Lecture 02</div>
        <div style="font-size:20px;font-weight:bold;color:#e8f0f8">Cellular & Circuit Functions and Recording Techniques</div>
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="switchTab('learn')" style="padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;background:${activeTab==='learn'?'#2a1010':'#121f2e'};color:${activeTab==='learn'?'#e07070':'#7a9bb8'};font-weight:${activeTab==='learn'?'bold':'normal'}">📖 Study</button>
        <button onclick="switchTab('flashcards')" style="padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;background:${activeTab==='flashcards'?'#2a1010':'#121f2e'};color:${activeTab==='flashcards'?'#e07070':'#7a9bb8'};font-weight:${activeTab==='flashcards'?'bold':'normal'}">🃏 Flashcards</button>
      </div>
    </div>`;

  if (activeTab === "learn") {
    html += `<div style="display:flex;height:calc(100vh - 65px)">
      <div style="width:215px;background:#0a1825;border-right:1px solid #1a3048;overflow-y:auto;flex-shrink:0">`;

    topics.forEach(topic => {
      const isActive = activeTopic === topic.id;
      html += `<div>
        <button onclick="selectTopic('${topic.id}')" style="width:100%;padding:13px 16px;text-align:left;border:none;cursor:pointer;background:${isActive?'#111e2d':'transparent'};border-left:${isActive?`3px solid ${topic.color}`:'3px solid transparent'};color:${isActive?'#e0ecfa':'#5a7a96'};display:flex;gap:8px;align-items:center;font-size:13px">
          <span>${topic.icon}</span><span style="flex:1;line-height:1.3">${topic.label}</span>
        </button>`;
      if (isActive) {
        topic.sections.forEach((s, i) => {
          html += `<button onclick="selectSection(${i})" style="width:100%;padding:8px 16px 8px 36px;text-align:left;border:none;cursor:pointer;background:${activeSection===i?'#132030':'transparent'};color:${activeSection===i?topic.color:'#4a6a80'};font-size:12px;line-height:1.3">${s.title}</button>`;
        });
      }
      html += `</div>`;
    });

    html += `</div>
      <div style="flex:1;overflow-y:auto;padding:32px 44px">`;

    if (currentSec) {
      html += `
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${currentTopic.color};margin-bottom:8px">${currentTopic.icon} ${currentTopic.label}</div>
        <h1 style="font-size:23px;color:#e8f0f8;margin-bottom:22px;border-bottom:1px solid #1a3048;padding-bottom:14px">${currentSec.title}</h1>
        <div style="line-height:1.85;max-width:740px">${renderMarkdown(currentSec.content, currentTopic.color)}</div>
        <div style="display:flex;gap:12px;margin-top:44px">`;

      if (activeSection > 0) {
        html += `<button onclick="selectSection(${activeSection-1})" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`;
      }
      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div>`;
    }

    html += `</div></div>`;
  }

  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px">
      <div style="margin-bottom:22px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:270px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:36px 34px;cursor:pointer;transition:background 0.25s;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':'#c0392b'};margin-bottom:16px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:16px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:22px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:28px">
        <button onclick="prevCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:450px">
        ${flashcards.map((_, i) => `<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?'#c0392b':'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function switchTab(tab) { activeTab = tab; render(); }
function selectTopic(id) { activeTopic = id; activeSection = 0; render(); }
function selectSection(i) { activeSection = i; render(); }
function flipCard() { flipped = !flipped; render(); }
function prevCard() { cardIndex = (cardIndex - 1 + flashcards.length) % flashcards.length; flipped = false; render(); }
function nextCard() { cardIndex = (cardIndex + 1) % flashcards.length; flipped = false; render(); }
function goToCard(i) { cardIndex = i; flipped = false; render(); }

render();
</script>
</body>
</html>
