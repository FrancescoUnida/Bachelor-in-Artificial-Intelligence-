const topics = [
  {
    id: "overview",
    label: "Information Theory Overview",
    color: "#c0392b",
    icon: "📡",
    sections: [
      {
        title: "What Is Information Theory?",
        content: `**Information Theory** provides a general framework for quantifying the ability of a coding scheme or communication channel to convey information.

In neuroscience, it answers: *"How much does the neural response tell us about a stimulus?"* — in a rigorous, quantitative way.

**Key ingredients of the framework**:
- The code involves a number of *symbols* (e.g., different neuronal responses, sequences of action potentials)
- The coding and transmission processes are **stochastic and noisy**

**Two central measures**:
- *Entropy* → measures the theoretical **capacity** of a code to convey information
- *Mutual Information* → measures how much of that capacity is **actually used** when the code is employed

> ⚠️ Neural encoding asks *what* the response is; information theory asks *how much* the response tells us about the world.`,
      },
    ],
  },
  {
    id: "entropy",
    label: "Entropy",
    color: "#2980b9",
    icon: "📊",
    sections: [
      {
        title: "Surprise and Entropy",
        content: `**Entropy** measures how "interesting" or "surprising" a set of neural responses is (Shannon).

A more interesting set shows a larger range of different responses, in a highly irregular and unpredictable sequence.

**Building the entropy formula from two conditions**:

For discrete responses (spike-count firing rates), we define the "surprise" of seeing response rate *r* as a function h(P[r]) of its probability:

1. h(P[r]) must be a **decreasing function** of P[r] — low probability responses are more surprising than high probability ones
2. h must be **additive for independent sources** — for two independent neurons with rates r₁ and r₂:

  h(P[r₁]·P[r₂]) = h(P[r₁]) + h(P[r₂])

The **logarithm** is the only function satisfying this identity for all P, so:

  h(P[r]) = −log₂ P[r]   (units: bits, dimensionless)

**Shannon's entropy** is the average surprise over all possible responses:

  H = −∑ᵣ P[r] · log₂ P[r]`,
      },
      {
        title: "Properties of Entropy",
        content: `**Edge cases** in the entropy sum H = −∑ P[r] log₂ P[r]:

- When P[r] → 0: h → ∞ but P[r]·h → **0** — an event that never occurs contributes nothing to entropy
- When P[r] ≈ 1: h ≈ 0, so P[r]·h → **0** — a near-certain event also contributes little
- The responses that **contribute most** have intermediate probabilities: frequent enough to appear often, but not so certain as to make h small

**Example 1** — a neuron that always fires at the same rate:
All P[r] = 0 except one which equals 1 → log₂ 1 = 0 → **H = 0** (zero entropy, no surprise)

**Example 2** — a neuron with two possible responses (r⁺ or r⁻):

  H = −(1 − P[r⁺]) log₂(1 − P[r⁺]) − P[r⁺] log₂ P[r⁺]

H is **maximized at 1 bit** when P[r⁺] = P[r⁻] = 1/2 (equal probability of both responses).

> ⚠️ Maximum entropy occurs when all responses are equally probable — the neuron is maximally unpredictable.`,
      },
      {
        title: "Entropy for Continuous Variables",
        content: `For a **continuously defined firing rate**, we move from discrete sums to integrals.

The probability of the firing rate lying between r and r + Δr is expressed using a probability density:

  P[r in (r, r+Δr)] = p[r] · Δr

Summing over discrete bins of size Δr:

  H = −∑ p[r] Δr · log₂(p[r] Δr)

This is the starting point for deriving the **entropy-maximizing firing rate distribution** and forms the basis for continuous mutual information calculations.`,
      },
    ],
  },
  {
    id: "mutual_info",
    label: "Mutual Information",
    color: "#8e44ad",
    icon: "🔗",
    sections: [
      {
        title: "Definition and Formula",
        content: `**Mutual Information (Iₘ)** is an entropy-based measure of how much a neuron's response tells us about the stimulus.

A neuron provides information about a stimulus **only if** its response variability is correlated with changes in that stimulus.

**Approach**: compare responses obtained using a different stimulus on every trial vs. responses on trials with repeated presentations of the same stimulus.

Iₘ = difference between the **total response entropy H** and the **average noise entropy H_noise**:

  H_noise = ∑ₛ P[s] · Hₛ = −∑ₛ,ᵣ P[s]P[r|s] log₂ P[r|s]

Where Hₛ is the entropy of responses evoked by repeated presentations of stimulus s, computed using conditional probability P[r|s].

Putting it together:

  **Iₘ = H − H_noise = −∑ᵣ P[r] log₂ P[r] + ∑ₛ,ᵣ P[s]P[r|s] log₂ P[r|s]**

This simplifies using P[r] = ∑ₛ P[s]P[r|s] to:

  Iₘ = ∑ₛ,ᵣ P[s]P[r|s] · log₂(P[r|s] / P[r])`,
      },
      {
        title: "Three Key Cases",
        content: `**Case 1 — Stimulus-independent neuron** (P[r|s] = P[r]):

The conditional and marginal probabilities are equal → log₂(P[r|s]/P[r]) = log₂(1) = 0

  **Iₘ = 0**   — no information is transmitted

**Case 2 — Perfect one-to-one encoding** (each stimulus s produces a unique response rₛ):

P[rₛ] = P[s] and P[r|s] = 1 if r = rₛ, else 0

  Iₘ = ∑ₛ P[s] · log₂(1/P[rₛ]) = −∑ₛ P[s] log₂ P[s]

With no variability and a one-to-one map from stimulus to response, **Iₘ equals the full stimulus entropy**.

**Case 3 — Imperfect binary encoding** (two stimuli + and −, probability of incorrect response Pₓ):

P[r+|−] = P[r−|+] = Pₓ and P[r+] = P[r−] = 1/2

  Iₘ = 1 + (1 − Pₓ) log₂(1 − Pₓ) + Pₓ log₂ Pₓ

- When Pₓ = 0 (error-free): **Iₘ = 1 bit**
- When Pₓ = 0.5 (random encoding): **Iₘ = 0 bits**

> ⚠️ Mutual information is always between 0 and the stimulus entropy — it is bounded by how much information the stimulus itself contains.`,
      },
    ],
  },
  {
    id: "entropy_max",
    label: "Entropy Maximization",
    color: "#e67e22",
    icon: "🎯",
    sections: [
      {
        title: "Are Neural Responses Optimal?",
        content: `**Key question**: Are neural responses to natural stimuli optimized to convey as much information as possible?

If noise entropy is small, **maximizing response entropy maximizes mutual information**.

To find the optimal response distribution p[r], we maximize:

  −∫₀^r_max dr · p[r] · log₂ p[r]

subject to the normalization constraint:   ∫₀^r_max dr · p[r] = 1

(Resolution Δr is held fixed, so the log₂ Δr term is constant and can be ignored.)

**Solution** — the optimal response probability density is:

  p[r] = 1/r_max   (uniform, independent of r)

The entropy for this p[r] with finite resolution Δr is:

  H = log₂(r_max / Δr)

> ⚠️ Maximum entropy is achieved when all firing rates are equally likely — the neuron uses its full dynamic range uniformly.`,
      },
      {
        title: "Optimal Tuning Curve",
        content: `**How should a neuron's tuning curve f(s) look to maximize entropy?**

Given:
- Neuronal selectivity: r = f(s)
- Optimal condition: p[r] = 1/r_max
- Probability of the continuous stimulus variable: p[s]Δs

The condition |f(s + Δs) − f(s)| / r_max = p[s]Δs must hold for each stimulus interval.

For a monotonically increasing response (f(s + Δs) > f(s) for positive Δs), taking Δs → 0:

  **df/ds = r_max · p[s]**

**Solution** — the optimal tuning curve is the **cumulative distribution** of the stimulus:

  f(s) = r_max · ∫^s_{s_min} ds' p[s']

with s_min = the minimum stimulus value (where the neuron has no response).

This means: the optimal neuron response is proportional to the **integral of the probability density of the stimulus**.`,
      },
      {
        title: "Evidence: The Fly LMC",
        content: `**Experimental verification** comes from the large monopolar cell (LMC) in the visual system of the fly (Laughlin, 1981).

The LMC is a neuron that processes visual contrast signals in the fly's compound eye.

**What was measured**:
- Contrast response of the fly LMC (data points on a graph)
- Integral of the probability distribution of contrasts found in natural scenes (solid curve)

**Result**: the response as a function of contrast is **very close to the integrated probability density** of the stimulus.

The relative response is the amplitude of the membrane potential fluctuation (normalized by maximum response) produced by the onset of a light or dark image at a given contrast level. Contrast is defined relative to the background illumination level.

> ⚠️ The fly LMC is using a **maximum entropy encoding** — its tuning curve has been shaped by evolution to optimally use its firing rate range given the statistics of natural visual scenes.`,
      },
    ],
  },
  {
    id: "populations",
    label: "Population Codes",
    color: "#27ae60",
    icon: "🧬",
    sections: [
      {
        title: "Entropy for Neural Populations",
        content: `**Entropy maximization for a population** requires that neurons convey **independent pieces of information** — they must have different response selectivities.

For a population of N neurons with response vector **r** (components rₐ, resolution Δr):

  H = −∫ d**r** p[**r**] log₂ p[**r**] − N log₂ Δr

The entropy associated with individual neuron *a* within the population:

  Hₐ = −∫ drₐ p[rₐ] log₂ p[rₐ] − log₂ Δr = −∫ d**r** p[**r**] log₂ p[rₐ] − log₂ Δr

**Fundamental inequality**:

  H ≤ ∑ₐ Hₐ

The true population entropy can **never exceed** the sum of individual neuron entropies. Equality holds only if the responses of the neurons are **statistically independent** (a *factorial code*).

**Redundancy** = ∑ₐ Hₐ − H

> ⚠️ Redundancy > 0 means neurons share information — they are not fully independent. A factorial code (redundancy = 0) is the most efficient population code.`,
      },
    ],
  },
  {
    id: "spike_trains",
    label: "Spike Train Entropy",
    color: "#16a085",
    icon: "⚡",
    sections: [
      {
        title: "Entropy of Spike Trains",
        content: `Computing the entropy of a neuronal response characterized by precise **spike times** is much harder than for firing rates.

The entropy typically grows **linearly with the length** of the spike train.

We therefore define the **entropy rate Ḣ**:
- Dividing total entropy H by spike train duration T → **bits per second**
- Dividing by total number of action potentials → **bits per spike**

The entropy rate Ḣ indicates the **maximum rate** at which spike trains can convey information about environmental stimuli.

**For spike trains with statistically independent interspike intervals** (ISIs), the entropy in a spike train of average rate ⟨r⟩ and duration T is:

  ⟨r⟩ T · ∫₀^∞ dτ p[τ] log₂(p[τ] Δτ)

where p[τ]Δτ is the probability of an ISI falling in the range between τ and τ + Δτ.

Correlations between different interspike intervals **reduce the total entropy**:

  Ḣ ≤ −⟨r⟩ ∫₀^∞ dτ p[τ] log₂(p[τ] Δτ)`,
      },
      {
        title: "Poisson Spike Trains",
        content: `**Special case**: if a spike train follows a **homogeneous Poisson process** with rate ⟨r⟩:

  p[τ] = ⟨r⟩ e^(−⟨r⟩τ)

The entropy rate becomes:

  Ḣ = (⟨r⟩ / ln 2) · (1 − ln(⟨r⟩ Δτ))

**Numerical example**:
- ⟨r⟩ = 50 Hz, Δτ = 1 ms → **Ḣ = 288 bits/sec**
- Dividing: 288 bits/sec ÷ 50 spikes/sec → **5.76 bits/spike**

Note: the entropy per spike **can be greater than 1 bit** — this is because a spike carries timing information beyond a simple yes/no signal.

**Entropy rate decreases with increasing time window** Δτ (i.e., reducing time resolution). The graph of entropy per spike vs. Δτ shows a steep decline from ~9 bits/spike at Δτ → 0 to ~3.5 bits/spike at Δτ = 5 ms.`,
      },
      {
        title: "Spike Train Words & Resolution",
        content: `Within a spike train of duration T, discretizing into time bins of size Δτ means each possible neural response is a **"word"** with T/Δτ binary symbols (spike or no spike in each bin).

The mean spike count per bin is n̄ = ⟨r⟩ · Δτ. This determines the entropy per spike:

**Three resolution regimes**:

1. *n̄ = 1* (time resolution comparable to mean firing period):
   Entropy > 1 bit/spike — the timing information is fully resolved

2. *n̄ ≥ 3.4* (time resolution too low relative to mean frequency):
   Entropy < 1 bit/spike — bins are too coarse to capture timing

3. *n̄ << 1* (time resolution → 0):
   Ḣ → ∞ — the difference between rate-coding and time-coding disappears, and entropy diverges

> ⚠️ The time resolution Δτ is a crucial parameter: it sets how much temporal information a spike train can convey. Higher resolution = more bits per spike, but also more required bandwidth to read the code.`,
      },
    ],
  },
];

const flashcards = [

  { q: "What is the entropy rate Ḣ and how is it measured?", a: "Ḣ is the entropy of a spike train divided by either its duration T (giving bits/second) or the number of spikes r·T (giving bits/spike). It indicates the maximum rate at which spike trains can convey information. For a Poisson process: Ḣ = (⟨r⟩/ln 2)·(1 − ln(⟨r⟩Δτ))." },
  { q: "For a Poisson neuron firing at 50 Hz with Δτ = 1 ms, what is the entropy rate and bits per spike?", a: "Ḣ = (50/ln 2)·(1 − ln(50 × 0.001)) = 288 bits/sec. Bits per spike = 288/50 = 5.76 bits/spike. Note this exceeds 1 bit/spike because precise spike timing carries more information than a simple spike/no-spike binary code." },
  { q: "How does the time bin size Δτ affect entropy per spike?", a: "Entropy per spike decreases as Δτ increases (lower time resolution). When n̄ = ⟨r⟩Δτ ≈ 1, entropy > 1 bit/spike. When n̄ ≥ 3.4, entropy < 1 bit/spike. When Δτ → 0, Ḣ → ∞ (maximum temporal precision). Coarser time bins lose timing information." },

function renderMarkdown(text, topicColor) {
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

      if (activeSection < currentTopic.sections.length - 1) {
        html += `<button onclick="selectSection(${activeSection+1})" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`;
      } else {
        const idx = topics.findIndex(t => t.id === activeTopic);
        if (idx < topics.length - 1) {
          html += `<button onclick="selectTopic('${topics[idx+1].id}')" style="padding:9px 22px;background:${currentTopic.color};border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next topic →</button>`;
        }
      }
      html += `</div>`;
    }

    html += `</div></div>`;
  }

  if (activeTab === "flashcards") {
    const card = flashcards[cardIndex];
    html += `<div style="display:flex;flex-direction:column;align-items:center;padding:48px 20px">
      <div style="margin-bottom:22px;color:#4a6a80;font-size:13px">Card ${cardIndex+1} of ${flashcards.length}</div>
      <div onclick="flipCard()" style="width:min(620px,94vw);min-height:270px;background:${flipped?'#0d1e14':'#0d1825'};border:1px solid ${flipped?'#1e5c34':'#1a3048'};border-radius:14px;padding:36px 34px;cursor:pointer;transition:background 0.25s;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:${flipped?'#27ae60':'#c0392b'};margin-bottom:16px">${flipped?'✓ Answer':'? Question'}</div>
        <div style="font-size:16px;line-height:1.8;color:${flipped?'#8fe0b0':'#cdd9e5'}">${flipped?card.a:card.q}</div>
        ${!flipped?`<div style="margin-top:22px;font-size:12px;color:#2a4a60">tap to reveal answer</div>`:''}
      </div>
      <div style="display:flex;gap:12px;margin-top:28px">
        <button onclick="prevCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">← Prev</button>
        <button onclick="flipCard()" style="padding:9px 22px;background:#111e2d;border:1px solid #1a3048;border-radius:8px;color:#7eb8f7;cursor:pointer;font-size:14px">Flip</button>
        <button onclick="nextCard()" style="padding:9px 22px;background:#0d1825;border:1px solid #1a3048;border-radius:8px;color:#5a7a96;cursor:pointer;font-size:14px">Next →</button>
      </div>
      <div style="display:flex;gap:5px;margin-top:28px;flex-wrap:wrap;justify-content:center;max-width:450px">
        ${flashcards.map((_, i) => `<div onclick="goToCard(${i})" style="width:8px;height:8px;border-radius:50%;cursor:pointer;background:${i===cardIndex?'#c0392b':'#1a3048'}"></div>`).join('')}
      </div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function switchTab(tab) { activeTab = tab; render(); }
function selectTopic(id) { activeTopic = id; activeSection = 0; render(); }
function selectSection(i) { activeSection = i; render(); }
function flipCard() { flipped = !flipped; render(); }
function prevCard() { cardIndex = (cardIndex - 1 + flashcards.length) % flashcards.length; flipped = false; render(); }
function nextCard() { cardIndex = (cardIndex + 1) % flashcards.length; flipped = false; render(); }
function goToCard(i) { cardIndex = i; flipped = false; render(); }

render();
</script>
</body>
</html>
