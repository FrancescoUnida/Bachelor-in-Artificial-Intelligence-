<script>
const topics = [
  {
    id: "spike_triggered",
    label: "Spike-Triggered Averaging",
    color: "#c0392b",
    icon: "⚡",
    sections: [
      {
        title: "What is Spike-Triggered Averaging?",
        content: `**Spike-triggered averaging (STA)** is a powerful tool for characterizing the response properties of a neuron using the spikes it emits in response to a time-varying stimulus.

**Key properties**:
- Provides an estimate of a neuron's **linear receptive field**
- A useful technique for the analysis of **electrophysiological data**
- Measures the relationship between a **continuous signal** and a **simultaneously recorded spike train**
- Represents the **average signal taken at the times of spike occurrences**
- With proper normalization, equivalent to the **cross-correlation** between the continuous signal and the spike train

**Reverse-correlation**:
- Used to determine the **temporal and spatial structure** of a neuron's receptive field
- Based on stimuli that vary **randomly in time**
- Cross-correlations between white-noise stimuli and sparsely occurring neuronal spikes
- Computed more efficiently by only computing segments **preceding the spikes**`
      },
      {
        title: "STA: Step-by-Step Procedure",
        content: `The spike-triggered average is computed following these four steps:

1. Record the **stimulus** over the complete spike train duration
2. Record all **spike times**
3. For every spike, **add the stimulus values** surrounding the spike into the STA array
4. **Divide by the number of spikes** to obtain the final spike-triggered average

**Intuition**:
- For each spike, we take a window of the stimulus that preceded (and followed) it
- Each such stimulus excerpt is a **different colored waveform** in the classic STA diagram
- By averaging all these excerpts, random fluctuations **cancel out**
- What remains is the **systematic stimulus feature** that tends to precede a spike

> ⚠️ The STA is the average stimulus that caused the neuron to fire. It is only an unbiased estimator of the linear receptive field when white-noise stimuli are used.`
      }
    ]
  },
  {
    id: "firing_rate",
    label: "Estimating Firing Rates",
    color: "#2980b9",
    icon: "📈",
    sections: [
      {
        title: "Linear Model of Firing Rate Estimation",
        content: `The activity of a neuron at time *t* typically depends on the behavior of the stimulus over a period of time **starting a few hundred milliseconds prior to *t*** and ending perhaps tens of milliseconds before *t*.

**Reverse-correlation methods** are used to construct a more accurate model that includes the effects of the stimulus *s* over such an extended period of time.

**The linear model**:

  r_est(t) = r₀ + ∫₀^∞ dτ D(τ) s(t − τ)

**Key variables**:

| Symbol | Meaning |
|---|---|
| r_est(t) | Estimated firing rate at time t |
| r₀ | Background firing rate when s = 0 |
| D(τ) | Kernel — weighting factor (linear filter) |
| s(t − τ) | Stimulus at time t − τ |

**The kernel D(τ)**:
- Determines how **strongly**, and with what **sign**, the stimulus at time *t − τ* affects the firing rate at time *t*
- It is a **linear filter**

**Stimulus normalization**:
- Sensory systems adapt to the **absolute intensity** of a stimulus (fluctuations around a background level)
- Therefore, *s(t)* is defined with its **mean value subtracted out**
- The time integral of *s(t)* over the duration of a trial equals **zero**`
      },
      {
        title: "Optimal Kernel & White-Noise Stimulus",
        content: `To find the **optimal kernel D**, we minimize the squared difference between estimated and actual firing rates, averaged over the trial duration *T*:

  E = (1/T) ∫₀ᵀ dt (r_est(t) − r(t))²

**Minimization**: Setting the derivative of *E* with respect to the function *D* to zero.

**Standard method**: The optimal kernel is determined by measuring the **spike-triggered average stimulus** in response to a **white-noise stimulus**.

**Why white noise?**

A white-noise stimulus has two defining properties:
- It is **uncorrelated from one time to the next**
- It has stimulus fluctuations at all frequencies with equal weight (= equal power) → **flat power spectrum**

**Stimulus autocorrelation**:

  Q_ss(τ) = (1/T) ∫₀ᵀ dt s(t) s(t + τ)

For white noise: Q_ss(τ) = σ²δ(τ)
- Zero for all τ ≠ 0 in the range −T/2 < τ < T/2
- σ = constant representing the **magnitude of the variability**

> ⚠️ The flat autocorrelation (delta function) of white noise is what makes it mathematically ideal for recovering the optimal kernel — it "deconvolves" cleanly with the STA.`
      }
    ]
  },
  {
    id: "linear_nonlinear",
    label: "Linear-Nonlinear Models",
    color: "#8e44ad",
    icon: "🔧",
    sections: [
      {
        title: "Limitations of the Linear Prediction",
        content: `The optimal kernel produces an estimate of the firing rate that is a **linear function of the stimulus**:

  r_est(t) = r₀ + L(t)

where L(t) is the linear filter output.

**Two obvious problems with this approach**:
- There is nothing to prevent the predicted firing rate from becoming **negative**
- The predicted rate does **not saturate** — it increases without bound as stimulus magnitude increases

**Real neurons**, by contrast:
- Have a **firing threshold** (cannot fire below a certain input)
- **Saturate** at high firing rates

**The solution — static nonlinearity**:
- Replace the linear prediction with: r_est(t) = r₀ + F(L(t))
- *F* is an **arbitrary function** called the "static nonlinearity"
- *F* can be **extracted from data** by plotting r vs. L

Static nonlinearities introduce both **firing thresholds** and **saturation** into estimates of neural responses.`
      },
      {
        title: "The LNP Pipeline (Linear-Nonlinear-Poisson)",
        content: `The full model for transforming a dynamic stimulus into a time-dependent firing rate has **three stages**:

**Stage 1 — Linear Filter**:
  L = ∫ dτ D s
- The stimulus *s* is convolved with the optimal kernel *D*
- Produces the linear response L(t)

**Stage 2 — Static Nonlinearity**:
  r_est = r₀ + F(L)
- A nonlinear function *F* is applied to L(t)
- Introduces threshold and saturation

**Stage 3 — Spike Generator (Poisson)**:
  r_est · Δt > x_rand ?
- The estimated firing rate drives a **Poisson process**
- Generates a spike train as the final output

**Key insight from the H1 neuron example (fly visual system)**:
- Stimulus: velocity of a moving image
- The linear estimator shows **good overall agreement** with the actual firing rate
- However, the estimate **fails to capture high-frequency fluctuations**
- This is attributed to **nonlinear effects** not captured by the linear kernel

> ⚠️ The LNP model is a useful approximation, but neurons are ultimately nonlinear systems. The static nonlinearity is a minimal correction to account for threshold and saturation effects.`
      }
    ]
  },
  {
    id: "visual_neurons",
    label: "Visual Neurons & Receptive Fields",
    color: "#27ae60",
    icon: "👁️",
    sections: [
      {
        title: "The Retina: Circuitry & Cell Types",
        content: `The retina converts a **light stimulus** into an electrical signal and ultimately an action potential sequence.

**Cell layers of the retina** (from light-input to output):

| Cell Type | Role |
|---|---|
| Rod & cone receptors (R) | Photoreception — hyperpolarize in response to light |
| Horizontal cells (H) | Lateral inhibition, modulate photoreceptor output |
| Bipolar cells (B) | Relay signal from photoreceptors; can invert polarity |
| Amacrine cells (A) | Interneurons; modulate bipolar-ganglion cell signaling |
| Retinal ganglion cells (G) | **Output neurons** — axons form the optic nerve |

**Key observations**:
- Rod cells (especially those receiving direct illumination) are **hyperpolarized** by light
- This signal passes along to bipolar and horizontal cells via **synaptic connections**
- In one type of bipolar cell, the signal is **inverted** → depolarization
- Membrane potentials provide a **graded representation** of light intensity

**Retinal ganglion cells**:
- **G2** fires while the light is **on** (ON cell)
- **G1** fires when the light **turns off** (OFF cell)

**Maximal spatial frequency**:
The highest spatial frequency a retina can resolve is set by the size and spacing of photoreceptors:

  K_nyq = π / Δx`
      },
      {
        title: "Receptive Fields: From Retina to Cortex",
        content: `Neurons in the **retina, LGN (lateral geniculate nucleus), and primary visual cortex** respond to light stimuli in restricted regions of the visual field called their **receptive fields**.

**Structure of receptive fields**:
- **ON regions**: illumination *higher* than background enhances firing
- **OFF regions**: illumination *lower* than background enhances firing
- The **spatial arrangement** of these ON/OFF regions determines the neuron's selectivity to different inputs

**Two classes of neurons** based on how contributions from different visual field locations sum:
- *Simple cells* — contributions sum **linearly**
- *Complex cells* — contributions do **not** sum linearly

**First step in studying selectivity**: Identify the types of stimuli that evoke strong responses:
- Circular spots of light surrounded by darkness
- Dark spots surrounded by light
- Elongated light or dark bars
- Boundaries between light and dark

> ⚠️ The pathway is: Retina → Optic nerve → Optic chiasm → Lateral geniculate nucleus (LGN) → Primary visual cortex (V1).`
      },
      {
        title: "Reverse-Correlation Methods for Simple Cells",
        content: `For **visual neurons**, the spike-triggered average must account for the fact that light intensity depends on **location as well as time**.

**The 2D STA** — C(x, y, τ):
- The correlation function between firing rate and visual stimulus at position (x,y) and time lag τ

  Q_rs(x, y, τ) = (1/T) ∫₀ᵀ dt r(t) s(x, y, t + τ)

- The spike-triggered average is related to this by:

  C(x, y, τ) = Q_rs(x, y, −τ) / ⟨r⟩

**Estimating the firing rate of a visual neuron**:

  r_est(t) = r₀ + F(L(t))

  L(t) = ∫₀^∞ dτ ∫∫ dx dy D(x, y, τ) s(x, y, t − τ)

The kernel **D(x, y, τ)** determines how strongly, and with what sign, the visual stimulus at point *(x, y)* and at time *t − τ* affects the firing rate → this is the **space-time receptive field**.

**Separable receptive fields**:
  D(x, y, τ) = D_s(x, y) · D_t(τ)
- The spatial and temporal components can sometimes be factored apart`
      },
      {
        title: "Spatial Receptive Field of Simple Cells",
        content: `**Simple cells** in cat primary visual cortex have structured spatial receptive fields, estimated by **averaging stimuli between 50 ms and 100 ms prior to an action potential**.

**Visualization**:
- 3D plots: horizontal plane = (x, y) position; vertical axis = magnitude and sign of D_s(x, y)
- Contour plots represent the (x, y) plane:
  - **Solid contour curves** → ON areas where D_s(x, y) > 0
  - **Dashed contours** → OFF areas where D_s(x, y) < 0

**Key property of simple cells**:
- Respond most vigorously to **light-dark edges** positioned along the border between ON and OFF regions
- The edge should be **oriented parallel** to the border and to the elongated direction of the receptive field

**Temporal evolution of the receptive field**:
- More than **300 ms** before a spike: little correlation with the upcoming spike
- Around **210 ms** before a spike (τ = 210 ms): a two-lobed OFF-ON receptive field appears
- As τ decreases toward ~**75 ms**: the receptive field **reverses sign** (solid/dashed swap)
- The preferred stimulus is a **dark-light boundary that reverses to a light-dark boundary** over time

**The temporal kernel D_t(τ)**:
- Rises from 0
- Becomes positive, then **negative**
- Returns to 0 as τ increases

> ⚠️ This sign reversal in the temporal kernel is a hallmark of **temporal opponency** — the cell responds to a stimulus that first increases, then decreases (or vice versa) over time.`
      }
    ]
  }
];

const flashcards = [
  { q: "What is spike-triggered averaging and what does it estimate?", a: "STA is a tool for characterizing a neuron's response properties using the spikes emitted in response to a time-varying stimulus. It estimates the neuron's linear receptive field by computing the average stimulus that preceded each spike, then dividing by the number of spikes." },
  { q: "What are the four steps to compute a spike-triggered average?", a: "(1) Record the stimulus over the complete spike train. (2) Record all spike times. (3) For every spike, add the surrounding stimulus values into the STA array. (4) Divide by the number of spikes to get the final STA." },
  { q: "What is the kernel D(τ) in the linear firing rate model, and what does it represent?", a: "D(τ) is the weighting factor (linear filter / kernel) that determines how strongly, and with what sign, the stimulus at time t−τ affects the firing rate at time t. It is the 'memory' of the neuron — how past stimulus values influence the current output." },
  { q: "Why is white noise the ideal stimulus for computing the optimal kernel?", a: "White noise is uncorrelated from one time to the next and has equal power at all frequencies (flat power spectrum). Its autocorrelation is a delta function: Q_ss(τ) = σ²δ(τ). This property allows clean mathematical recovery of the kernel via the spike-triggered average without bias from stimulus correlations." },
  { q: "What are the two main problems with a purely linear firing rate model?", a: "(1) Nothing prevents the predicted firing rate from going negative. (2) The predicted rate does not saturate — it grows without bound as stimulus intensity increases. Real neurons have a threshold and a maximum firing rate." },
  { q: "What is a 'static nonlinearity' F in the LNP model, and what does it add?", a: "F is an arbitrary nonlinear function applied to the output of the linear filter: r_est = r₀ + F(L). It introduces both a firing threshold (F = 0 below a certain L) and saturation (F flattens at large L), making the model more biologically realistic. F can be extracted from data." },
  { q: "What are the three stages of the LNP (Linear-Nonlinear-Poisson) model?", a: "(1) Linear Filter: convolve stimulus with kernel D to produce L(t). (2) Static Nonlinearity: apply F to get r_est = r₀ + F(L). (3) Spike Generator: use r_est to drive a Poisson process that generates spikes." },
  { q: "What is the difference between ON and OFF retinal ganglion cells?", a: "ON ganglion cells (e.g. G2) fire while the light stimulus is ON. OFF ganglion cells (e.g. G1) fire when the light turns OFF. This distinction arises from differences in synaptic polarity through the bipolar cell pathway." },
  { q: "What is the space-time receptive field D(x, y, τ) of a simple cell?", a: "D(x, y, τ) is the kernel that determines how strongly, and with what sign, the visual stimulus at spatial location (x, y) and time t−τ affects the neuron's firing rate at time t. It describes both the spatial structure and temporal dynamics of the neuron's sensitivity to visual inputs." },
  { q: "How are ON and OFF regions represented in receptive field contour plots?", a: "ON areas (where D_s(x,y) > 0 — higher illumination increases firing) are shown with solid contour curves. OFF areas (where D_s(x,y) < 0 — lower illumination increases firing) are shown with dashed contours." },
  { q: "What stimulus orientation drives a simple cell most vigorously?", a: "Simple cells respond most vigorously to light-dark edges positioned along the border between ON and OFF regions, oriented parallel to this border and to the elongated direction of the receptive field." },
  { q: "What happens to the spatial receptive field of a simple cell as τ decreases from 210 ms to 75 ms?", a: "At τ ≈ 210 ms, a two-lobed OFF-ON receptive field emerges. As τ decreases toward ~75 ms, this structure first fades, then reverses sign (the ON and OFF regions swap). The preferred stimulus is a boundary that reverses polarity over time — a sign of temporal opponency." },
  { q: "What does the maximal spatial frequency K_nyq = π/Δx represent in the retina?", a: "It is the Nyquist spatial frequency — the highest spatial frequency the retina can resolve. It is determined by the physical size and spacing (Δx) of individual photoreceptors. Spatial patterns finer than this limit cannot be distinguished." },
  { q: "What is the difference between simple cells and complex cells in primary visual cortex?", a: "Simple cells have contributions from different locations within the visual field that sum linearly — their spatial receptive field can be cleanly described with ON/OFF subregions. Complex cells have contributions that do NOT sum linearly, making them harder to characterize with a single linear kernel." },
  { q: "What is the stimulus autocorrelation Q_ss(τ) for a white-noise signal?", a: "Q_ss(τ) = σ²δ(τ), where σ is the magnitude of the variability. This means the autocorrelation is zero for all τ ≠ 0, and equals σ² at τ = 0 only. This is the defining mathematical property of white noise — no temporal correlations." }
];

let activeTab = 'learn';
let activeTopic = topics[0].id;
let activeSection = 0;
let cardIndex = 0;
let flipped = false;

function getCurrentTopic() { return topics.find(t => t.id === activeTopic); }
function getCurrentSection() { return getCurrentTopic()?.sections[activeSection]; }

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.className = 'tab-btn ' + (['learn','flashcards'][i] === tab ? 'active' : 'inactive');
  });
  document.getElementById('learn-view').style.display = tab === 'learn' ? 'flex' : 'none';
  document.getElementById('flashcard-view').style.display = tab === 'flashcards' ? 'flex' : 'none';
  if (tab === 'flashcards') renderFlashcard();
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  topics.forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (activeTopic === topic.id ? ' active' : '');
    btn.style.borderLeftColor = activeTopic === topic.id ? topic.color : 'transparent';
    btn.innerHTML = `<span>${topic.icon}</span><span style="flex:1;line-height:1.3">${topic.label}</span>`;
    btn.onclick = () => { activeTopic = topic.id; activeSection = 0; renderSidebar(); renderContent(); };
    sidebar.appendChild(btn);

    if (activeTopic === topic.id) {
      topic.sections.forEach((s, i) => {
        const sb = document.createElement('button');
        sb.className = 'section-btn' + (activeSection === i ? ' active' : '');
        sb.style.color = activeSection === i ? topic.color : '#4a6a80';
        sb.textContent = s.title;
        sb.onclick = () => { activeSection = i; renderSidebar(); renderContent(); };
        sidebar.appendChild(sb);
      });
    }
  });
}

function renderMarkdown(text, topicColor) {
  const lines = text.split('\n');
  let html = '';
  let inTable = false;
  let tableRows = [];

  function flushTable() {
    if (tableRows.length > 0) {
      html += '<table class="md-table">';
      tableRows.forEach((row, ri) => {
        html += '<tr>' + row.map(cell => `<td>${cell}</td>`).join('') + '</tr>';
      });
      html += '</table>';
      tableRows = [];
    }
    inTable = false;
  }

  lines.forEach(line => {
    if (line.startsWith('|')) {
      inTable = true;
      const cells = line.split('|').map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();

    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");

    if (line.startsWith('> ⚠️') || line.startsWith('>')) {
      html += `<blockquote class="md-blockquote" style="border-left-color:${topicColor}">${line.replace(/^>\s?/, '')}</blockquote>`;
    } else if (line.startsWith('- ') || line.startsWith('• ')) {
      html += `<li class="md-li">${line.slice(2)}</li>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<li class="md-li" style="list-style-type:decimal">${line.replace(/^\d+\.\s/, '')}</li>`;
    } else if (line.trim() === '') {
      html += '<br>';
    } else if (/^\s{2,}/.test(line)) {
      html += `<div class="md-pre">${line.trim()}</div>`;
    } else {
      html += `<p class="md-p">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

function renderContent() {
  const topic = getCurrentTopic();
  const section = getCurrentSection();
  if (!topic || !section) return;

  document.getElementById('topic-label').innerHTML = `<span style="color:${topic.color}">${topic.icon} ${topic.label}</span>`;
  document.getElementById('section-title').textContent = section.title;
  document.getElementById('section-body').innerHTML = renderMarkdown(section.content, topic.color);

  const nav = document.getElementById('nav-buttons');
  nav.innerHTML = '';
  if (activeSection > 0) {
    const prevBtn = document.createElement('button');
    prevBtn.className = 'nav-btn prev';
    prevBtn.textContent = '← Previous';
    prevBtn.onclick = () => { activeSection--; renderSidebar(); renderContent(); };
    nav.appendChild(prevBtn);
  }
  if (activeSection < topic.sections.length - 1) {
    const nextBtn = document.createElement('button');
    nextBtn.className = 'nav-btn next';
    nextBtn.style.background = topic.color;
    nextBtn.textContent = 'Next →';
    nextBtn.onclick = () => { activeSection++; renderSidebar(); renderContent(); };
    nav.appendChild(nextBtn);
  } else {
    const idx = topics.findIndex(t => t.id === activeTopic);
    if (idx < topics.length - 1) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'nav-btn next';
      nextBtn.style.background = topic.color;
      nextBtn.textContent = 'Next topic →';
      nextBtn.onclick = () => { activeTopic = topics[idx+1].id; activeSection = 0; renderSidebar(); renderContent(); };
      nav.appendChild(nextBtn);
    }
  }
}

function renderFlashcard() {
  const card = flashcards[cardIndex];
  document.getElementById('card-counter').textContent = `Card ${cardIndex + 1} of ${flashcards.length}`;
  const fc = document.getElementById('flashcard');
  fc.style.background = flipped ? '#0d1e14' : '#0d1825';
  fc.style.border = `1px solid ${flipped ? '#1e5c34' : '#1a3048'}`;
  document.getElementById('card-label').style.color = flipped ? '#27ae60' : '#c0392b';
  document.getElementById('card-label').textContent = flipped ? '✓ Answer' : '? Question';
  document.getElementById('card-text').style.color = flipped ? '#8fe0b0' : '#cdd9e5';
  document.getElementById('card-text').textContent = flipped ? card.a : card.q;
  document.getElementById('card-hint').style.display = flipped ? 'none' : 'block';

  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  flashcards.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === cardIndex ? ' active' : '');
    d.onclick = () => { cardIndex = i; flipped = false; renderFlashcard(); };
    dots.appendChild(d);
  });
}

function flipCard() { flipped = !flipped; renderFlashcard(); }
function prevCard() { cardIndex = (cardIndex - 1 + flashcards.length) % flashcards.length; flipped = false; renderFlashcard(); }
function nextCard() { cardIndex = (cardIndex + 1) % flashcards.length; flipped = false; renderFlashcard(); }

renderSidebar();
renderContent();
</script>
</body>
</html>
