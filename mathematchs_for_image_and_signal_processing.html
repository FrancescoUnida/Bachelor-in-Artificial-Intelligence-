      {
        title: "Riemann vs Lebesgue Integration",
        content: `We want to develop a **different integration theory** from Riemann's — more consistent and powerful.

**Riemann's integral** partitions the *x-axis* (domain) into evenly spaced intervals:

$$\\int_a^b f(x)\\,dx = \\lim_{N\\to\\infty} \\sum_{i=1}^{N} f(\\hat{x}_i)(x_i - x_{i-1})$$

The sum approximates area using thin vertical rectangles by sampling the function at points.

**Lebesgue's integral** instead partitions the *y-axis* (range) into strips, and measures the preimage of each strip:

$$\\int_{[a,b]} f = \\lim_{L\\to\\infty} \\sum_{j=1}^{L} y_{j-1}\\cdot m\\!\\left(f^{-1}([y_{j-1}, y_j])\\right)$$

where:
- *f⁻¹([yⱼ₋₁, yⱼ])* is the set of x-values where f takes values in the j-th strip
- *m* is a **measure** — a function that attributes a "size" (number) to sets on the x-axis`,
      },
      {
        title: "Why Lebesgue?",
        content: `**Lebesgue integration has several advantages:**

- It is **more general** than Riemann's — every Riemann-integrable function is also Lebesgue-integrable, but not vice versa.

- One finds **simpler conditions** for the integrability of a function.

- It **behaves well with limit procedures** — passing limits through integrals is much easier (e.g., Dominated Convergence Theorem).

- It is possible to do **Functional Analysis** with it — we will consider spaces of Lebesgue-integrable functions, which turn out to be *complete*.

> ⚠️ One major drawback: getting into the theory requires a bit of time. The investment pays off enormously in later topics.`,

    sections: [
      {
        title: "Volume and Coverings",
        content: `**Goal:** define a *measure* enabling us to measure many subsets of ℝᵐ, possessing some natural properties.

We start with the **definition of an outer measure**.

**Volume of an interval:**

Given an interval I = [a₁,b₁] × [a₂,b₂] × … × [aₘ,bₘ] ⊆ ℝᵐ, its volume is:

$$\\nu(I) = \\prod_{j=1}^{m}(b_j - a_j) = (b_1-a_1)(b_2-a_2)\\cdots(b_m-a_m)$$

**Covering of A ⊆ ℝᵐ (by intervals):**

A covering is a countable collection 𝒢 = {Iⱼ}ⱼ∈ℕ of intervals such that

$$A \\subseteq \\bigcup_{j \\in \\mathbb{N}} I_j$$

Think of it as covering the set A with (possibly overlapping) rectangular boxes in ℝᵐ.`,
      },
      {
        title: "Definition of Outer Measure",
        content: `**The outer measure** of A ⊆ ℝᵐ is:

$$m\\star(A) := \\inf\\left\\{\\sum_{j=1}^{\\infty} \\nu(I_j) : \\mathcal{G} = \\{I_j\\}_{j\\in\\mathbb{N}} \\text{ is a covering of } A\\right\\}$$

In words: *the infimum of the total volumes of all possible countable coverings of A by intervals.*

We look for the "tightest" covering possible — the one that wastes the least space.

**Key properties of the outer measure:**

i) If I is an interval, then m(I) = m(I°) = ν(I)  *(m does not overcount)*

ii) If A ⊆ B, then m*(A) ≤ m(B)  *(monotonicity)*

iii) m(∅) = 0  *(empty set has measure zero)*

iv) If A = ∪ₙ Aₙ, then m(A) ≤ ∑ₙ m(Aₙ)  *(countable subadditivity)*

v) For every A ⊆ ℝᵐ and ε > 0, there exists an open set G_ε ⊇ A with m(G_ε) ≤ m(A) + ε  *(outer regularity)*`,
      },
      {
        title: "Proofs of Key Properties",
        content: `**Proof of (ii) — Monotonicity:**

If A ⊆ B, then every covering of B is also a covering of A. As a result, the infimum of volumes of coverings of A is smaller or equal to that of B.

**Proof of (iii) — Empty set:**

∅ is a subset of any set. For instance, ∅ ⊆ [−ε,ε]ᵐ for every ε > 0, and therefore

$$m^\\star{(\\emptyset)} \\leq m^\\star{([{-\\varepsilon},\\varepsilon]^m)} = \\nu([{-\\varepsilon},\\varepsilon]^m) = (2\\varepsilon)^m$$

Since this holds for every ε > 0, it follows that m(∅) = 0.

**Proof of (iv) — Countable subadditivity:**

Fix ε > 0. For any n ∈ ℕ, let {Iⱼ,ₙ}ⱼ∈ℕ be a covering of Aₙ such that

$$\\sum_{j=1}^{\\infty} \\nu(I_{j,n}) \\leq m^\\star(A_n) + \\varepsilon \\cdot 2^{-n}$$

Such a cover exists by definition of infimum. Then {Iⱼ,ₙ}ⱼ,ₙ∈ℕ is a covering of A (Cartesian product of two countable sets is countable), and:

$$m^\\star{(A)} \\leq \\sum_{j,n} \\nu(I_{j,n}) = \\sum_{n=1}^{\\infty}\\sum_{j=1}^{\\infty} \\nu(I_{j,n}) \\leq \\sum_{n=1}^{\\infty}(m^\\star(A_n)+\\varepsilon\\cdot 2^{-n}) = \\sum_{n=1}^{\\infty} m^\\star(A_n) + \\varepsilon$$

Since this holds for every ε > 0, the claim follows. □`,

However, **this turns out to be FALSE in general** — it only holds in specific cases.

**When it works ✓:** If A and B are *closed, bounded, and at positive distance from each other*, then m*(A ∪ B) = m*(A) + m*(B).

**When it fails ✗:** There exist pairs of sets A and B such that m(A ∪ B) < m(A) + m(B).

> ⚠️ This failure is the key motivation for restricting to **measurable sets** — a special class where additivity is guaranteed.

To have this much-needed property, we must restrict ourselves to measure only a special class of sets.`,

        content: `**Definition:** A set A ⊆ ℝᵐ is called **measurable** if, for every ε > 0, there exists an open set G_ε ⊆ ℝᵐ with A ⊆ G_ε and

$$m\\star(G_\\varepsilon \\setminus A) < \\varepsilon$$

Intuitively: A is measurable if it can be approximated from the outside by open sets, with the "excess" having arbitrarily small outer measure.

We write **ℳ(ℝᵐ)** for the class of all measurable subsets of ℝᵐ.

**The Lebesgue measure** of A ∈ ℳ(ℝᵐ) is simply:

$$m(A) := m\\star(A)$$

That is, the Lebesgue measure is the *restriction of the outer measure to measurable sets:*

$$m : \\mathcal{M}(\\mathbb{R}^m) \\to [0,+\\infty], \\quad m = m\\star\\big|_{\\mathcal{M}(\\mathbb{R}^m)}$$`,
      },
      {
        title: "Facts About Measurable Sets (i–v)",
        content: `**i)** Every **open set** is measurable.

*Proof:* If A is open and ε > 0, take G_ε = A, since m(G_ε \\ A) = m(∅) = 0 < ε.

**ii)** Every set having **zero outer measure** is measurable.

*Proof:* By outer regularity, for every ε > 0 there exists open G_ε ⊇ A with m(G_ε) ≤ ε. By monotonicity, m*(G_ε \\ A) ≤ m*(G_ε) ≤ ε.

**iii)** **Points have measure zero** (and are therefore measurable).

*Proof:* For any p ∈ ℝᵐ, {p} ⊆ [p−ε, p+ε]ᵐ for every ε > 0, so m({p}) ≤ (2ε)ᵐ → 0.

**iv)** **Finite or countable sets** are measurable and have measure zero.

*Proof:* By countable subadditivity, if A = {pⱼ}ⱼ∈ℕ, then m(A) ≤ ∑ⱼ m({pⱼ}) = 0.

**v)** If {Aₙ}ₙ∈ℕ ⊆ ℳ(ℝᵐ) is a countable family of **mutually disjoint** measurable sets, then A = ∪ₙ Aₙ is measurable and

$$m(A) = \\sum_{n=1}^{\\infty} m(A_n) \\qquad \\textbf{(Countable Additivity)}$$

This is the crucial property that failed for the outer measure!`,
      },
      {
        title: "Facts About Measurable Sets (vi–x)",
        content: `**vi)** If A is measurable, then ℝᵐ \\ A is measurable. In particular, every **closed set** is measurable.

**vii)** **Countable unions/intersections** of measurable sets are measurable.

**viii)** If A and B are measurable, then so is A \\ B. Also, if B ⊆ A and m(A) < ∞, then

$$m(A \\setminus B) = m(A) - m(B)$$

**ix)** m behaves **"naturally"** with respect to translations and dilations:

$$m(A + v) = m(A) \\quad \\forall A \\in \\mathcal{M}(\\mathbb{R}^m),\\, \\forall v \\in \\mathbb{R}^m$$
$$m(\\lambda A) = \\lambda^m m(A) \\quad \\forall A \\in \\mathcal{M}(\\mathbb{R}^m),\\, \\forall \\lambda > 0$$

where A + v = {x + v : x ∈ A} and λA = {λx : x ∈ A}.

**x) Continuity of measure:**

*a)* If {Eⱼ}ⱼ∈ℕ ⊆ ℳ(ℝᵐ) with Eⱼ ⊆ Eⱼ₊₁ for all j (increasing), then

$$m\\!\\left(\\bigcup_{j\\in\\mathbb{N}} E_j\\right) = \\lim_{j\\to+\\infty} m(E_j)$$

*b)* If {Eⱼ}ⱼ∈ℕ ⊆ ℳ(ℝᵐ) with Eⱼ ⊇ Eⱼ₊₁ for all j (decreasing) and m(E₁) < ∞, then

$$m\\!\\left(\\bigcap_{j\\in\\mathbb{N}} E_j\\right) = \\lim_{j\\to+\\infty} m(E_j)$$`,
      },
      {
        title: "Proof of Continuity from Below (x-a)",
        content: `We prove property **(x-a)**: if Eⱼ ⊆ Eⱼ₊₁ for all j ∈ ℕ, then m(∪ⱼ Eⱼ) = limⱼ→∞ m(Eⱼ).

**Construction:** Set, for j ∈ ℕ,

$$F_j := \\begin{cases} E_1 & \\text{if } j=1 \\\\ E_j \\setminus E_{j-1} & \\text{if } j \\geq 2 \\end{cases}$$

Then {Fⱼ}ⱼ∈ℕ forms a countable collection of **mutually disjoint** (by construction) **measurable** (by viii) sets such that

$$\\bigcup_{j\\in\\mathbb{N}} F_j = \\bigcup_{j\\in\\mathbb{N}} E_j$$

By **countable additivity** (property v), used twice:

$$m\\!\\left(\\bigcup_{j} E_j\\right) = m\\!\\left(\\bigcup_{j} F_j\\right) = \\sum_{j=1}^{\\infty} m(F_j) = \\lim_{N\\to\\infty} \\sum_{j=1}^{N} m(F_j) = \\lim_{N\\to\\infty} m\\!\\left(\\bigcup_{j=1}^{N} F_j\\right) = \\lim_{N\\to\\infty} m(E_N)$$

as claimed. □`,
      },

],exercises:[
  {
    id: "ex1",
    title: "Exercise 1 — Outer measure of a single point",
    difficulty: "Easy",
    statement: `Show directly from the definition of outer measure that **m*({p}) = 0** for any point p ∈ ℝ.`,
    hint: "For every ε > 0, construct an explicit covering of {p} by a single interval of volume less than ε.",
    solution: `**Solution:**

Fix any ε > 0. Consider the interval I_ε = [p − ε/2, p + ε/2]. Then:
- {p} ⊆ I_ε, so 𝒢 = {I_ε} is a covering of {p} by one interval.
- ν(I_ε) = (p + ε/2) − (p − ε/2) = ε.

By definition of infimum:

$$m\\star(\\{p\\}) \\leq \\nu(I_\\varepsilon) = \\varepsilon$$

Since this holds for **every** ε > 0, we conclude m*({p}) = 0. □

*Note:* Since m*({p}) = 0, property (ii) of measurable sets tells us {p} is measurable.`,

  {

    difficulty: "Easy",
    statement: `Prove property (ii): if A ⊆ B ⊆ ℝᵐ, then m*(A) ≤ m*(B).`,

Since A ⊆ B ⊆ ∪ⱼ Iⱼ, the same collection 𝒢 is also a **covering of A**.

Therefore every covering of B is a covering of A, which means we are taking the infimum over a *larger* collection for m*(A) than for m*(B). Hence:

    statement: `Let I = [a,b] ⊆ ℝ. Verify that m*(I) = b − a.

You may use without proof that m*(I) ≤ ν(I) = b − a (proved by taking the trivial one-interval covering). The harder part is showing m*(I) ≥ b − a.`,
    hint: "For the lower bound: given any covering {Iⱼ} of [a,b], use the Heine–Borel theorem to extract a finite subcover and directly estimate the total volume from below.",
    solution: `**Solution:**

**Upper bound:** The single interval I itself is a covering of I, so

$$m\\star(I) \\leq \\nu(I) = b - a$$

**Lower bound:** Let {Iⱼ}ⱼ∈ℕ be any covering of [a,b], where Iⱼ = [aⱼ,bⱼ].

Since [a,b] is compact (closed and bounded) and [a,b] ⊆ ∪ⱼ (aⱼ,bⱼ), by the **Heine–Borel theorem** there exists a finite subcover: we can find j₁, …, jₙ such that

$$[a,b] \\subseteq \\bigcup_{k=1}^n (a_{j_k}, b_{j_k})$$

For any finite collection of open intervals covering [a,b], one can show (by induction) that the total length is at least b − a. Therefore:

$$\\sum_{j=1}^{\\infty} \\nu(I_j) \\geq \\sum_{k=1}^n \\nu(I_{j_k}) \\geq b - a$$

Taking the infimum over all coverings: m*(I) ≥ b − a.

Combining: **m*(I) = b − a** = ν(I). □`,

This is a striking example: A is *dense* in [0,1] (every interval contains a rational), yet it has measure zero!`,
    hint: "ℚ is countable. Write A as a countable union of points and use the result of Exercise 2, or build an explicit covering.",
    solution: `**Solution — via countability:**

Since ℚ is countable, so is A = ℚ ∩ [0,1]. Write A = {q₁, q₂, q₃, …}.

For each n ∈ ℕ and any fixed ε > 0, define the interval

$$I_n = \\left[q_n - \\frac{\\varepsilon}{2^{n+1}},\\; q_n + \\frac{\\varepsilon}{2^{n+1}}\\right]$$

Then:
- A ⊆ ∪ₙ Iₙ (each qₙ is in Iₙ), so {Iₙ} is a covering of A.
- ν(Iₙ) = ε/2ⁿ.
- Total volume: ∑ₙ ν(Iₙ) = ε ∑ₙ₌₁^∞ 2⁻ⁿ = ε.

Therefore m*(A) ≤ ε for every ε > 0, so **m(A) = m*(A) = 0**. □

> ⚠️ This shows that measure zero does NOT mean "small" in the sense of density. The complement [0,1] \\ ℚ (the irrationals) has measure 1, yet contains no rationals.`,

$$f^{-1}(A) \\text{ is measurable} \\quad \\forall A \\subseteq \\mathbb{R} \\text{ open.}$$

**⟺** f⁻¹((α, +∞)) is measurable for every α ∈ ℝ

**⟺** f⁻¹([α, +∞)) is measurable for every α ∈ ℝ

**⟺** f⁻¹((α, β)) is measurable for every α < β

**⟺** f⁻¹([α, β]) is measurable for every α < β

**⟺** f⁻¹([α, β)) is measurable for every α < β

**⟺** f⁻¹((α, β]) is measurable for every α < β

$$f^{-1}((-\\infty, \\beta]) = E \\setminus f^{-1}((\\beta, +\\infty))$$

        title: "Definitions: Three Modes of Convergence",
        content: `Let E ⊆ ℝᵐ. A **sequence of functions** {fₙ}_{n∈ℕ} defined over E is a countable collection of functions fₙ: E → ℝ, as n ∈ ℕ.

**Definition:** A sequence {fₙ}: E → ℝ is said to:

**Converge pointwise** to f: E → ℝ (we write fₙ → f in E) if

$$\\forall x \\in E: \\quad f_n(x) \\to f(x) \\quad \\text{as } n \\to +\\infty$$

**Converge a.e.** to f: E → ℝ (we write fₙ → f a.e. in E) if

$$\\text{for a.e. } x \\in E: \\quad f_n(x) \\to f(x) \\quad \\text{as } n \\to +\\infty$$

**Converge uniformly** to f: E → ℝ (we write fₙ → f unif. in E) if

$$\\sup_{x \\in E} |f_n(x) - f(x)| \\longrightarrow 0 \\quad \\text{as } n \\to +\\infty$$

> ⚠️ Recall: the **supremum** of a function g: E → ℝ over E is simply the supremum of the image g(E). For example, sup_{x∈ℝ} sin x = 1, but sup_{x∈[0, π/4]} sin x = 1/√2.`,
      },
      {
        title: "Relations between the Three Modes",
        content: `The three notions form a hierarchy:

$$f_n \\to f \\text{ uniformly in } E \\implies f_n \\to f \\text{ pointwise in } E \\implies f_n \\to f \\text{ a.e. in } E$$

**Key remark:** All three modes of convergence give rise to analogous notions for **series of functions** ∑_{n=1}^{∞} fₙ, by applying them to the sequence of truncated sums Sₙ := ∑_{k=1}^n fₖ.

**On uniqueness of limits:**

- Pointwise and uniform limits are unique.
- **A.e. limits are unique a.e.**: if fₙ → f a.e. and fₙ → g a.e., then f = g a.e.

> ⚠️ A.e. limits are **not unique as functions** — they may differ on a set of measure zero. But that set is irrelevant for integration purposes.`,

- x = 1: fₙ(1) = 1ⁿ = 1 → 1 = f(1)
- x ∈ (0,1): fₙ(x) = xⁿ = e^{n log x} → 0 since log x < 0

So fₙ → f pointwise in [0,1], where

$$f(x) = \\begin{cases} 0 & \\text{if } x \\in [0,1) \\\\ 1 & \\text{if } x = 1 \\end{cases}$$

**Is the convergence uniform on [0,1]?**

$$\\sup_{x \\in [0,1]} |f_n(x) - f(x)| = \\sup_{x \\in [0,1)} x^n = 1 \\not\\to 0$$

        content: `The central question of this lecture is: given a sequence {fₙ} converging to f, can we pass the limit under the integral sign?

$$\\lim_{n \\to +\\infty} \\int_E f_n \\stackrel{?}{=} \\int_E \\lim_{n \\to +\\infty} f_n = \\int_E f$$

**The answer is: not always.** If the convergence is not uniform, nice properties (such as continuity) can be lost in the limit, and the limit of integrals may differ from the integral of the limit.

**Two classical counterexamples show the danger:**

**Example 1:** Let fₙ = (1/n) χ_{[0,n]} on [0,+∞). Then fₙ → f ≡ 0 **uniformly** on [0,+∞) (since sup|fₙ| = 1/n → 0). However:

$$\\int_{[0,+\\infty)} f_n = \\frac{1}{n} \\cdot n = 1 \\qquad \\forall n \\in \\mathbb{N}$$
$$\\int_{[0,+\\infty)} f = 0$$

So ∫fₙ → 1 ≠ 0 = ∫f. The Uniform Convergence Theorem fails here because **m([0,+∞)) = +∞**.

**Example 2:** On [0,2], define the "moving spike":

$$f_n(x) = \\begin{cases} n^2 x & x \\in [0, 1/n] \\\\ 2n - n^2 x & x \\in (1/n, 2/n) \\\\ 0 & x \\in [2/n, 2] \\end{cases}$$

Then fₙ → 0 pointwise, but ∫_{[0,2]} fₙ = (1/2)·n·(2/n) = 1 for all n. Here convergence is **not uniform**.`,

$$\\int_E f = \\lim_{n \\to +\\infty} \\int_E f_n.$$

**Proof:**

$$\\left| \\int_E f_n - \\int_E f \\right| = \\left| \\int_E (f_n - f) \\right| \\leq \\int_E |f_n - f| \\leq \\sup_{x \\in E} |f_n(x) - f(x)| \\cdot m(E) \\to 0$$

since the sup → 0 (uniform convergence) and m(E) < ∞. □

- Only holds when **m(E) < ∞** (as Example 1 shows).

- fₙ(x) ≤ fₙ₊₁(x) for **a.e. x ∈ E**, for all n ∈ ℕ.

$$\\lim_{n \\to +\\infty} \\int_E f_n = \\int_E f.$$

$$|f_m(x)| = \\frac{e^{-x}}{1+mx} \\leq \\frac{e^{-x}}{1} = e^{-x} =: G(x)$$

$$\\lim_{m \\to +\\infty} \\left(1+\\frac{x}{m}\\right)^m = e^x$$

**Theorem:** Let E ⊆ ℝᵐ be measurable, I ⊆ ℝ be an open interval, and define

$$G(t) := \\int_E f(x, t)\\, dx \\qquad \\text{for } t \\in I,$$

where f: E × I → ℝ satisfies:

**i)** f(·, t) ∈ L(E) for every t ∈ I (i.e., x ↦ f(x,t) is integrable for each t);

**ii)** f(x, ·) ∈ C¹(I) for **a.e. x ∈ E** (i.e., for a.e. x, the map t ↦ f(x,t) is C¹ in I);

**iii)** There exists **H ∈ L(E)** s.t. |∂f/∂t(x,t)| ≤ H(x) for **a.e. x ∈ E** and **all t ∈ I**.

Then **G ∈ C¹(I)** and

$$G'(t) = \\int_E \\frac{\\partial f}{\\partial t}(x, t)\\, dx \\qquad \\forall t \\in I.$$

**Proof:** Let {εₙ} ⊆ ℝ with εₙ → 0. Define the difference quotients:

$$g_n(x) := \\frac{f(x, t+\\varepsilon_n) - f(x,t)}{\\varepsilon_n}$$

Then lim_{n→∞} gₙ(x) = ∂f/∂t(x,t) for a.e. x (by ii). By Lagrange's theorem, there exists θₙ(x,t) ∈ [0,1] s.t. gₙ(x) = ∂f/∂t(x, t+θₙεₙ), so |gₙ(x)| ≤ H(x) by iii.

**Claim:** ℒf ∈ C^∞((0,+∞)) and

        content: `**Setting:** We already introduced $L(E)$, the space of real-valued integrable functions over a measurable set $E \\subseteq \\mathbb{R}^n$. For several reasons, it is useful to consider also **complex-valued p-integrable functions**.

$$f(x) = \\operatorname{Re} f(x) + i\\, \\operatorname{Im} f(x)$$

be such that $\\operatorname{Re} f$ and $\\operatorname{Im} f$ are measurable. Let $p \\in [1, +\\infty)$. Then $f$ is said to be **p-integrable** over $E$ if

$$\\int_E |f|^p < +\\infty$$

**Scalar multiplication:** $(\\lambda f)(x) = \\lambda f(x)$, so

$$\\int_E |\\lambda f|^p = \\int_E |\\lambda|^p |f|^p = |\\lambda|^p \\int_E |f|^p < \\infty$$

since $f \\in L^p(E)$.

**Closure under addition:** We use the elementary inequality for $A, B \\geq 0$:

$$(A + B)^p \\leq (2 \\max\\{A,B\\})^p = 2^p \\max\\{A^p, B^p\\} \\leq 2^p(A^p + B^p)$$

$$\\int_E |f+g|^p \\leq \\int_E (|f|+|g|)^p \\leq \\int_E 2^p(|f|^p + |g|^p) = 2^p\\left(\\int_E |f|^p + \\int_E |g|^p\\right) < \\infty$$

**Definition:** A function $\\|\\cdot\\|: V \\to [0, +\\infty)$ is a **norm** if:

- **i) Vanishing:** $\\|v\\| = 0 \\iff v = 0$

- **ii) Homogeneity:** $\\|\\lambda v\\| = |\\lambda|\\,\\|v\\|$ for all $v \\in V$, $\\lambda \\in \\mathbb{K}$

- **iii) Triangle inequality:** $\\|v + w\\| \\leq \\|v\\| + \\|w\\|$ for all $v, w \\in V$

The pair $(V, \\|\\cdot\\|)$ is called a **normed space**.`,

        content: `**Definition:** Let $(V, \\|\\cdot\\|)$ be a normed space. Given $v_0 \\in V$ and $R > 0$:

$$B_R(v_0) := \\{v \\in V : \\|v - v_0\\| < R\\} \\quad \\text{is a } \\textbf{ball}$$

We then define:
- A set $E \\subseteq V$ is **open** if $\\forall v_0 \\in E$, $\\exists r > 0$ s.t. $B_r(v_0) \\subseteq E$;
- A set $E \\subseteq V$ is **closed** if $V \\setminus E$ is open;
- A set $E \\subseteq V$ is **bounded** if $\\exists R > 0$ s.t. $E \\subseteq B_R(0)$.

**Example 2:** $(\\mathbb{R}^n, \\|\\cdot\\|_1)$ — the **1-norm (Manhattan distance)**:

$$\\|v\\|_1 = \\sum_{i=1}^n |v_i|$$

**Example 3:** $(\\mathbb{R}^n, \\|\\cdot\\|_p)$ — the **p-norm**, for $p \\in [1,+\\infty)$:

$$\\|v\\|_p = \\left(\\sum_{i=1}^n |v_i|^p\\right)^{1/p}$$

        content: `**Definition:** Let $(V, \\|\\cdot\\|)$ be a normed space.

**Convergence:** A sequence $\\{v_k\\}_{k \\in \\mathbb{N}} \\subseteq V$ converges to $v \\in V$ if:

$$\\forall \\varepsilon > 0,\\; \\exists N \\in \\mathbb{N}\\text{ s.t. }\\|v_k - v\\| < \\varepsilon \\quad \\forall k \\geq N$$

**Cauchy sequence:** $\\{v_k\\}_{k \\in \\mathbb{N}} \\subseteq V$ is **Cauchy** if:

$$\\forall \\varepsilon > 0,\\; \\exists N \\in \\mathbb{N}\\text{ s.t. }\\|v_k - v_j\\| < \\varepsilon \\quad \\forall k, j \\geq N$$

**Completeness:** $V$ is said to be **complete** if every Cauchy sequence converges.

A **complete normed space** is often called a **Banach space**.

> **Remark:** Converging sequences are always Cauchy, regardless of the completeness of the space. (Proof as exercise: if $\\|v_k - v\\| < \\varepsilon/2$ for $k \\geq N$, then $\\|v_k - v_j\\| \\leq \\|v_k - v\\| + \\|v - v_j\\| < \\varepsilon$ for all $k,j \\geq N$.)`,

**Definition:** Given two normed spaces $(V, \\|\\cdot\\|_V)$ and $(W, \\|\\cdot\\|_W)$ over $\\mathbb{K}$, a linear map $T: V \\to W$ is **bounded** if there exists a constant $C > 0$ s.t.

$$\\|T(v)\\|_W \\leq C\\|v\\|_V \\quad \\forall v \\in V$$

**Proposition (Continuous = Bounded):** Let $V, W$ be normed spaces and $T: V \\to W$ a linear map. The following are equivalent:
- **i)** $T$ is continuous in $V$;
- **ii)** $T$ is continuous at $0$;
- **iii)** $T$ is bounded.

> This is a remarkable fact: for *linear* maps between normed spaces, continuity at a single point implies global continuity and boundedness.`,

        content: `**Proof of (ii) ⟹ (iii):** By continuity at $0$, for every $\\varepsilon > 0$ there exists $\\delta_\\varepsilon > 0$ s.t.

Therefore, given any $v \\in V \\setminus \\{0\\}$, by linearity of $T$:

$$\\|T(v)\\|_W = \\left\\|T\\!\\left(\\frac{\\|v\\|_V}{\\delta_1} \\cdot \\delta_1 \\frac{v}{\\|v\\|_V}\\right)\\right\\|_W = \\frac{\\|v\\|_V}{\\delta_1}\\left\\|T\\!\\left(\\delta_1 \\frac{v}{\\|v\\|_V}\\right)\\right\\|_W \\leq \\frac{\\|v\\|_V}{\\delta_1} \\cdot 1 = C\\|v\\|_V$$

with $C := \\frac{1}{\\delta_1}$ (using homogeneity of $\\|\\cdot\\|_W$ and the fact that $\\|\\delta_1 v/\\|v\\|_V\\|_V = \\delta_1$).

**Proof of (iii) ⟹ (i):** Let $v_0 \\in V$ and $\\varepsilon > 0$ be fixed. Take $\\delta := \\varepsilon/C$. For every $v \\in B_\\delta(v_0)$:

$$\\|T(v) - T(v_0)\\|_W = \\|T(v - v_0)\\|_W \\leq C\\|v - v_0\\|_V < C\\delta = \\varepsilon$$

(using linearity and boundedness of $T$). Hence $T$ is continuous at $v_0$, and since $v_0$ is arbitrary, $T$ is continuous on all of $V$. $\\square$`,

One can verify that the above 3 definitions are equivalent and that $(L(V,W), \\|\\!|\\cdot|\\!\\|)$ is actually a normed space.

$$\\|\\lambda f\\|_p = \\left(\\int_E |\\lambda|^p |f(x)|^p\\,dx\\right)^{1/p} = |\\lambda|\\left(\\int_E |f|^p\\right)^{1/p} = |\\lambda|\\,\\|f\\|_p$$

$$ab \\leq \\frac{a^p}{p} + \\frac{b^{p'}}{p'} \\quad \\text{for all } a,b \\geq 0$$

- **General case $p \\in (1,\\infty)$:** Area argument. Consider the curve $y = x^{p-1}$ (equivalently $x = y^{1/(p-1)}$). The rectangle $[0,a] \\times [0,b]$ has area $ab$ and is always contained in the union of the two regions:

$$\\int_0^a x^{p-1}\\,dx = \\frac{a^p}{p}, \\qquad \\int_0^b y^{1/(p-1)}\\,dy = \\frac{b^{p/(p-1)}}{p/(p-1)} = \\frac{b^{p'}}{p'}$$

Let $f \\in L^p(E)$, $g \\in L^{p'}(E)$. Then $fg \\in L^1(E)$ and

$$\\|fg\\|_{L^1(E)} \\leq \\|f\\|_{L^p(E)}\\|g\\|_{L^{p'}(E)}$$

**Homogeneous Neumann BC:** No-flux (insulated) conditions:

$$n_x(0,t) = n_x(L,t) = 0 \\quad \\text{for } t > 0$$

$$\\begin{cases} n_t(x,t) = \\alpha\\, n_{xx}(x,t) & x \\in (0,L),\\; t > 0 \\\\ n(0,t) = n(L,t) = 0 & t > 0 \\\\ n(x,0) = g(x) & x \\in (0,L) \\end{cases}$$

        content: `**Definition:** Let $H$ be a vector space over a field $\\mathbb{K}$ ($\\mathbb{K} = \\mathbb{R}$ or $\\mathbb{K} = \\mathbb{C}$). An **inner product** (or **scalar product**) on $H$ is a map

$$\\langle \\cdot, \\cdot \\rangle: H \\times H \\longrightarrow \\mathbb{K}$$

such that:
- **i) Linearity in the first entry:** $\\langle au + bv, z \\rangle = a\\langle u,z\\rangle + b\\langle v,z\\rangle$ for all $u,v,z \\in H$, $a,b \\in \\mathbb{K}$.
- **ii) Conjugate symmetry:** $\\langle v, u \\rangle = \\overline{\\langle u, v \\rangle}$ for all $u,v \\in H$.
- **iii) Positive definiteness:** $\\langle v, v \\rangle \\in (0,\\infty)$ for all $v \\in H \\setminus \\{0\\}$.

**Remarks:**
- If $\\mathbb{K} = \\mathbb{R}$: conjugation in (ii) is trivial, so $\\langle\\cdot,\\cdot\\rangle$ is **symmetric**.

        content: `**Proposition:** Let $(H, \\langle\\cdot,\\cdot\\rangle)$ be a pre-Hilbert space. Then

$$\\|v\\| := \\sqrt{\\langle v,v \\rangle} \\quad \\forall v \\in H$$

**Note:** Well-posed since $\\langle v,v\\rangle \\geq 0$ for all $v$ (by (i) and (ii)).

**Lemma (Cauchy-Schwarz inequality):**

$$|\\langle v,w \\rangle| \\leq \\|v\\|\\,\\|w\\| \\quad \\forall v,w \\in H$$

**Proof:** If $\\langle v,w\\rangle = 0$, nothing to prove. Suppose $\\langle v,w\\rangle \\neq 0$, so $w \\neq 0$. Set $\\alpha = \\frac{\\langle v,w\\rangle}{|\\langle v,w\\rangle|}$ and $z = \\alpha w$. Then:
- $\\langle v,z\\rangle = \\bar\\alpha\\langle v,w\\rangle = |\\langle v,w\\rangle|$
- $\\langle z,v\\rangle = |\\langle v,w\\rangle|$
- $\\|z\\| = |\\alpha|\\|w\\| = \\|w\\|$

For any $t \\in \\mathbb{R}$: $0 \\leq \\|v - tz\\|^2 = \\|v\\|^2 - 2t|\\langle v,w\\rangle| + t^2\\|w\\|^2$.

This is a quadratic in $t$ that is always $\\geq 0$, so its discriminant $\\leq 0$: $4|\\langle v,w\\rangle|^2 - 4\\|v\\|^2\\|w\\|^2 \\leq 0$. $\\square$

$$2(\\|\\chi_E\\|_{L^p}^2 + \\|\\chi_F\\|_{L^p}^2) = 2(m(E)^{2/p} + m(E)^{2/p}) = 4\\, m(E)^{2/p}$$

        content: `**Definition:** Let $H$ be a pre-Hilbert space. We say $v$ and $w$ are **orthogonal** (write $v \\perp w$) if $\\langle v,w\\rangle = 0$.

Given $v \\in H$, we define its **orthogonal complement**:

$$v^\\perp := \\{w \\in H : w \\perp v\\} = \\{w \\in H : \\langle w,v\\rangle = 0\\}$$

Given $M \\subseteq H$, we define:

$$M^\\perp := \\{w \\in H : w \\perp v \\;\\forall v \\in M\\}$$

**Proposition:** Let $H$ be a Hilbert space and $M \\subseteq H$. Then:
- $M^\\perp$ is a **vector subspace** of $H$.
- $M^\\perp$ is **closed** (w.r.t. the $\\|\\cdot\\|$-norm topology).
- $M \\subseteq (M^\\perp)^\\perp$.
- If $M$ is a **closed vector subspace**, then $M = (M^\\perp)^\\perp$.

**Proposition (Pythagoras' Theorem):** If $v_1, \\ldots, v_N \\in H$ satisfy $v_j \\perp v_k$ for all $j \\neq k$, then

$$\\left\\|\\sum_{j=1}^N v_j\\right\\|^2 = \\sum_{j=1}^N \\|v_j\\|^2$$

$$\\left\\|\\sum_{j=1}^N v_j\\right\\|^2 = \\left\\langle \\sum_j v_j, \\sum_k v_k\\right\\rangle = \\sum_{j,k} \\langle v_j, v_k\\rangle = \\sum_{j=1}^N \\|v_j\\|^2 \\quad (\\text{since }\\langle v_j,v_k\\rangle = 0 \\text{ for } j\\neq k) \\quad \\square$$`,

$$0 = \\langle \\tilde{v}, z\\rangle = f(z)\\langle v,z\\rangle - f(v)\\|z\\|^2$$

        content: `**Parallelogram law as a test:**

A norm $\\|\\cdot\\|$ comes from an inner product iff the **parallelogram law** holds:
$$\\|v+w\\|^2 + \\|v-w\\|^2 = 2(\\|v\\|^2 + \\|w\\|^2)$$

If the law fails for some $v,w$, then the norm is NOT induced by any inner product.

**Strategy for "no inner product" proofs:**
1. Assume by contradiction that an inner product exists with the given norm.
2. Find specific $v,w$ that violate the parallelogram law.
3. Derive a contradiction.

**Standard choice** (as in the $L^p$ exercise): take $v = \\chi_E$, $w = \\chi_F$ for disjoint sets $E, F$ of equal measure. Then:
- $\\|v+w\\|_p^2 = \\|\\chi_{E\\cup F}\\|_p^2 = (m(E)+m(F))^{2/p} = (2m(E))^{2/p}$

$$\\|v\\|^2 - \\sum_{j=1}^N |\\langle v,w_j\\rangle|^2 = \\left\\|v - \\sum_{j=1}^N\\langle v,w_j\\rangle w_j\\right\\|^2 \\xrightarrow{N\\to\\infty} 0$$

**(iii) $\\Rightarrow$ (ii):** Let $v\\in H$ with $\\langle v,w_j\\rangle=0$ for all $j\\in\\mathbb{N}$. By (iii):
$$\\|v\\|^2 = \\sum_{j=1}^\\infty |\\langle v,w_j\\rangle|^2 = \\lim_{N\\to\\infty}\\sum_{j=1}^N 0 = 0 \\implies v=0. \\quad \\checkmark$$

**(ii) $\\Rightarrow$ (i):** Define $S_N := \\sum_{j=1}^N \\langle v,w_j\\rangle w_j$. By Bessel, $\\sum_j|\\langle v,w_j\\rangle|^2 \\leq \\|v\\|^2 < \\infty$. By Pythagoras:

$$\\langle v-S_N, w_k\\rangle = \\langle v,w_k\\rangle - \\langle v,w_k\\rangle = 0$$

        content: `**Definition:** A Hilbert space is called **separable** if it admits a countable orthonormal system.

> **Remark:** Hilbert spaces appearing in the vast majority of applications are separable (or finite-dimensional).

**Proposition:** Let $H$ be a separable Hilbert space with orthonormal system $\\{e_k\\}_{k\\in\\mathbb{N}}$. Then the **projection map**

$$\\Psi: H \\longrightarrow \\ell^2(\\mathbb{N}), \\qquad v \\longmapsto \\Psi(v) := \\{\\langle v,e_k\\rangle\\}_{k\\in\\mathbb{N}}$$

is an **isometric isomorphism** — i.e. a linear bijection satisfying

$$\\|\\Psi(v)\\|_{\\ell^2(\\mathbb{N})} = \\|v\\|_H \\quad \\forall v\\in H$$

> **Consequence:** All separable Hilbert spaces are "the same space" — they are all isometrically isomorphic to $\\ell^2(\\mathbb{N})$!

Recall: $\\ell^2(\\mathbb{N}) = \\left\\{x=\\{x_k\\}_{k\\in\\mathbb{N}} : x_k\\in\\mathbb{C},\\; \\sum_{k=1}^\\infty |x_k|^2<\\infty\\right\\}$ with $\\langle x,y\\rangle = \\sum_{k=1}^\\infty x_k\\overline{y_k}$.`,

So $\\Psi$ is well-defined and an isometry.

**Injectivity:** Being a linear isometry, $\\Psi$ is injective ($\\|\\Psi(v)\\|=0 \\Rightarrow \\|v\\|=0 \\Rightarrow v=0$).

**Surjectivity:** Let $x=\\{x_k\\}\\in\\ell^2(\\mathbb{N})$. Define $S_N := \\sum_{k=1}^N x_k e_k$. By Pythagoras:
$$\\|S_N-S_M\\|^2 = \\sum_{k=M+1}^N |x_k|^2 \\to 0$$

$$\\langle S_N, e_\\ell\\rangle = \\sum_{k=1}^N x_k\\underbrace{\\langle e_k,e_\\ell\\rangle}_{=\\delta_{k\\ell}} = x_\\ell$$

    sections: [
      {
        title: "Statement",
        content: `**Lemma (Riemann–Lebesgue):** Let $f \\in L^1((-\\pi,\\pi))$ and define

$$c_m = \\frac{1}{2\\pi}\\int_{-\\pi}^\\pi f(x)\\,e^{-imx}\\,dx \\qquad \\text{for } m \\in \\mathbb{Z}.$$

Then:

$$\\lim_{|m|\\to+\\infty} c_m = 0.$$

**Interpretation:** The Fourier coefficients of any integrable function must go to zero. This is a necessary condition for a sequence to be a sequence of Fourier coefficients.

> ⚠️ The lemma does **not** say the series converges, nor how fast $c_m \to 0$. It only guarantees $c_m \to 0$.`,

      {
        title: "Proof — Step 1: f ∈ L²",
        content: `**Proof in two steps.**

**Step 1:** Assume first that $f \\in L^2((-\\pi,\\pi))$.

We know that $\\left\\{\\frac{e^{imx}}{\\sqrt{2\\pi}}\\right\\}_{m\\in\\mathbb{Z}}$ forms an **orthonormal system** in $L^2((-\\pi,\\pi))$.

We can write:

$$c_m = \\frac{1}{\\sqrt{2\\pi}}\\left\\langle f,\\, \\frac{e^{im\\cdot}}{\\sqrt{2\\pi}}\\right\\rangle_{L^2((-\\pi,\\pi))}$$

By **Parseval's identity**:

$$\\sum_{m\\in\\mathbb{Z}} |c_m|^2 = \\frac{1}{2\\pi}\\sum_{m\\in\\mathbb{Z}}\\left|\\left\\langle f, \\frac{e^{im\\cdot}}{\\sqrt{2\\pi}}\\right\\rangle\\right|^2 = \\frac{1}{2\\pi}\\|f\\|^2_{L^2((-\\pi,\\pi))} < \\infty$$

Since $\\sum_{m\\in\\mathbb{Z}}|c_m|^2 < \\infty$, the series converges, so its terms must go to zero:

$$|c_m|^2 \\to 0 \\implies c_m \\to 0 \\quad \\text{as } |m| \\to +\\infty. \\quad \\checkmark$$`,

$$\\|f - f_\\varepsilon\\|_{L^1((-\\pi,\\pi))} < \\varepsilon.$$

Define $c_m^{(\\varepsilon)} := \\frac{1}{2\\pi}\\int_{-\\pi}^\\pi f_\\varepsilon(x)\\,e^{-imx}\\,dx$.

**Bounding $|c_m - c_m^{(\\varepsilon)}|$:**

$$|c_m - c_m^{(\\varepsilon)}| = \\frac{1}{2\\pi}\\left|\\int_{-\\pi}^\\pi (f(x)-f_\\varepsilon(x))\\,e^{-imx}\\,dx\\right| \\leq \\frac{1}{2\\pi}\\int_{-\\pi}^\\pi |f(x)-f_\\varepsilon(x)|\\,|e^{-imx}|\\,dx$$

$$|c_m - c_m^{(\\varepsilon)}| \\leq \\frac{1}{2\\pi}\\|f-f_\\varepsilon\\|_{L^1} < \\frac{\\varepsilon}{2\\pi}$$

$$|c_m^{(\\varepsilon)}| < \\frac{\\varepsilon}{2} \\qquad \\forall |m| \\geq N_\\varepsilon.$$

$$|c_m| \\leq |c_m - c_m^{(\\varepsilon)}| + |c_m^{(\\varepsilon)}| < \\frac{\\varepsilon}{2\\pi} + \\frac{\\varepsilon}{2} \\leq \\varepsilon.$$

|---|---|

| $f$ continuous, piecewise $C^1$ | $|c_m| = O(1/|m|)$ |
| $f \\in C^1$ | $|c_m| = O(1/|m|)$ |

4. **Simplify** using $\\cos(m\\pi) = (-1)^m$, $\\sin(m\\pi) = 0$.
5. **Separate even/odd $m$** if the formula splits (as in Ex 1).

The cosine coefficients vanish by symmetry:

$$f_{\\text{even}}(x) = \\begin{cases} f(x) & x \\in [0,\\pi) \\\\ f(-x) & x \\in [-\\pi, 0) \\end{cases}$$

$$a_m = \\frac{1}{l}\\int_{-l}^l f(t)\\cos\\!\\left(\\frac{m\\pi}{l}t\\right)dt, \\qquad b_m = \\frac{1}{l}\\int_{-l}^l f(t)\\sin\\!\\left(\\frac{m\\pi}{l}t\\right)dt.$$

Since f_T is T-periodic, its complex Fourier series in [−T/2, T/2] is:

$$\\mathcal{S}_T f_T(x) = \\sum_{k \\in \\mathbb{Z}} c_k\\, e^{ik\\frac{2\\pi}{T}x}, \\qquad c_k = \\frac{1}{T}\\int_{-T/2}^{T/2} f(y)\\, e^{-ik\\frac{2\\pi}{T}y}\\,dy.$$

$$\\hat{f}(\\xi) := \\mathcal{F}f(\\xi) := \\int_{\\mathbb{R}} f(y)\\, e^{-2\\pi i \\xi y}\\,dy \\qquad \\text{for } \\xi \\in \\mathbb{R}.$$

        title: "Definition of the Fourier Transform",
        content: `**Definition:** Given f ∈ L¹(ℝᵐ), for ξ ∈ ℝᵐ we define the **Fourier transform** of f:

$$\\mathcal{F}f(\\xi) = \\hat{f}(\\xi) := \\int_{\\mathbb{R}^m} f(y)\\, e^{-2\\pi i \\xi \\cdot y}\\,dy$$

where ξ · y = ⟨ξ, y⟩ = Σⱼ ξⱼ yⱼ is the inner product in ℝᵐ.

> This definition makes sense because |f(y) e^{-2πiξ·y}| = |f(y)| ∈ L¹(ℝᵐ), so the integral is absolutely convergent.

**Convention note:** There are different conventions for the Fourier transform:
- This course uses e^{−2πiξ·y} (frequency domain in Hz, no 2π in the inverse)
- Physics often uses e^{−iξ·y} (angular frequency, factor 1/(2π)ᵐ in inverse)
- Both are equivalent; just be consistent!`,

        content: `**Proposition:** Let f, g ∈ L¹(ℝᵐ). Then:

**a) Translation in space → phase shift in frequency, and vice versa:**

For any y, η ∈ ℝᵐ:

$$\\mathcal{F}(\\tau_y f)(\\xi) = e^{-2\\pi i \\xi \\cdot y}\\, \\hat{f}(\\xi)$$

$$\\tau_\\eta \\hat{f}(\\xi) = \\hat{f}(\\xi - \\eta) = \\mathcal{F}(e^{2\\pi i \\eta \\cdot x} f)(\\xi)$$

where τ_y g(x) := g(x−y) is the **translation** of g by y.

**Proof:**

$$\\mathcal{F}(\\tau_y f)(\\xi) = \\int_{\\mathbb{R}^m} f(x-y)\\, e^{-2\\pi i \\xi \\cdot x}\\,dx \\stackrel{z=x-y}{=} \\int_{\\mathbb{R}^m} f(z)\\, e^{-2\\pi i \\xi \\cdot (z+y)}\\,dz = e^{-2\\pi i \\xi \\cdot y} \\hat{f}(\\xi).$$

For the second formula: τ_η f̂(ξ) = f̂(ξ−η) = ∫ f(x) e^{−2πi(ξ−η)·x} dx = ∫ f(x) e^{2πiη·x} e^{−2πiξ·x} dx = 𝓕(e^{2πiη·x}f)(ξ). □`,

$$\\mathcal{F}(f * g) = \\mathcal{F}(f) \\cdot \\mathcal{F}(g) = \\hat{f} \\cdot \\hat{g}.$$

**Proof:** By Young's convolution theorem, f, g ∈ L¹(ℝᵐ) implies f\\star g ∈ L¹(ℝᵐ). Then for any ξ ∈ ℝᵐ:

$$\\mathcal{F}(f\\star g)(\\xi) = \\int_{\\mathbb{R}^m} \\left(\\int_{\\mathbb{R}^m} f(y)g(x-y)\\,dy\\right) e^{-2\\pi i \\xi \\cdot x}\\,dx$$

By **Fubini** (justified since f\\star g ∈ L¹):

$$= \\int_{\\mathbb{R}^m} f(y) \\left(\\int_{\\mathbb{R}^m} g(x-y)\\, e^{-2\\pi i \\xi \\cdot x}\\,dx\\right) dy$$

Change variables z = x−y in the inner integral: e^{−2πiξ·x} = e^{−2πiξ·(z+y)} = e^{−2πiξ·z} · e^{−2πiξ·y}:

$$= \\int_{\\mathbb{R}^m} f(y)\\, e^{-2\\pi i \\xi \\cdot y} \\left(\\int_{\\mathbb{R}^m} g(z)\\, e^{-2\\pi i \\xi \\cdot z}\\,dz\\right) dy = \\hat{g}(\\xi) \\cdot \\hat{f}(\\xi). \\quad\\square$$`,

$$\\mathcal{S}f(x) = \\frac{\\pi^2}{3} + 4\\sum_{m=1}^{\\infty} \\frac{(-1)^m}{m^2}\\cos(mx).$$

**Key tool: Parseval's Identity.** Recall that the standard trigonometric orthonormal system for $L^2((-\\pi,\\pi))$ is:

$$\\left\\{\\frac{\\cos(mx)}{\\sqrt{\\pi}},\\ \\frac{\\sin(mx)}{\\sqrt{\\pi}}\\right\\}_{m\\in\\mathbb{N}} \\cup \\left\\{\\frac{1}{\\sqrt{2\\pi}}\\right\\}$$

$$\\forall\\, y,\\eta \\in \\mathbb{R}^m:\\quad \\mathcal{F}(\\tau_y f)(\\xi) = e^{-2\\pi i \\xi\\cdot y}\\hat{f}(\\xi), \\qquad \\tau_\\eta\\hat{f}(\\xi) = \\mathcal{F}(e^{2\\pi i\\eta\\cdot x}f)(\\xi).$$

**b) Convolution → Pointwise product:**

$$\\mathcal{F}(f * g) = \\mathcal{F}(f)\\cdot\\mathcal{F}(g) = \\hat{f}\\cdot\\hat{g}.$$

**c) Differentiation in $\\xi$ ↔ multiplication by $(-2\\pi ix)$:**

$$\\partial_\\xi^\\alpha \\hat{f}(\\xi) = \\mathcal{F}\\!\\left((-2\\pi ix)^\\alpha f\\right)(\\xi) \\qquad \\forall\\,\\xi\\in\\mathbb{R}^m.$$

        content: `**Proposition (Riemann-Lebesgue Lemma):**

The Fourier transform $\\mathcal{F}: L^1(\\mathbb{R}^m) \\to L^\\infty(\\mathbb{R}^m)$ is **linear and bounded**. Moreover,

$$\\mathcal{F}(L^1(\\mathbb{R}^m)) \\subset C_0^0(\\mathbb{R}^m) := \\left\\{g \\in C^0(\\mathbb{R}^m;\\mathbb{C}) : \\lim_{|\\xi|\\to+\\infty} g(\\xi) = 0\\right\\}.$$

**Proof — Linearity and boundedness ($\\mathcal{F}: L^1 \\to L^\\infty$):**

For every $f \\in L^1(\\mathbb{R}^m)$ and $\\xi \\in \\mathbb{R}^m$:

$$|\\mathcal{F}f(\\xi)| = \\left|\\int_{\\mathbb{R}^m} f(x)\\,e^{-2\\pi i\\xi\\cdot x}\\,dx\\right| \\leq \\int_{\\mathbb{R}^m}|f(x)|\\cdot\\underbrace{|e^{-2\\pi i\\xi\\cdot x}|}_{=1}\\,dx = \\|f\\|_{L^1(\\mathbb{R}^m)}.$$

So $\\hat{f} \\in L^\\infty(\\mathbb{R}^m)$ and $\\|\\mathcal{F}f\\|_{L^\\infty} \\leq \\|f\\|_{L^1}$.

3. Compute $\\sum_n |\\langle f, e_n\\rangle|^2$ using the Fourier coefficients.

| Sum | Value | Comes from |

**Question:** Can $\\mathcal{F}$ be inverted, and can its inverse $\\mathcal{F}^{-1}$ be written explicitly?

**Definition (Inverse Fourier Transform):** Given $g \\in L^1(\\mathbb{R}^m)$, define:

$$\\check{g}(x) := \\int_{\\mathbb{R}^m} g(\\xi)\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi \\qquad \\text{for } x \\in \\mathbb{R}^m.$$

This is the **inverse Fourier transform** of $g$.

> ⚠️ Note the sign: $\\hat{f}(\\xi) = \\int f(x)e^{-2\\pi i\\xi\\cdot x}dx$ uses $e^{-2\\pi i\\xi\\cdot x}$, while $\\check{g}(x) = \\int g(\\xi)e^{+2\\pi i\\xi\\cdot x}d\\xi$ uses $e^{+2\\pi i\\xi\\cdot x}$.`,

        title: "Theorem: Inversion Formula",
        content: `**Theorem (Inversion Formula):** Let $f \\in L^1(\\mathbb{R}^m)$ with $\\hat{f} \\in L^1(\\mathbb{R}^m)$. Then:

$$f(x) = \\int_{\\mathbb{R}^m} \\hat{f}(\\xi)\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi = \\check{\\hat{f}}(x) \\qquad \\text{for a.e. } x \\in \\mathbb{R}^m.$$

In other words, $f = (\\hat{f})^\\vee$ whenever $f, \\hat{f} \\in L^1(\\mathbb{R}^m)$.

**Why we can't just use Fubini directly:** Substituting $\\hat{f}$:

$$\\int_{\\mathbb{R}^m}\\hat{f}(\\xi)\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi = \\int_{\\mathbb{R}^m}\\left(\\int_{\\mathbb{R}^m}f(y)\\,e^{-2\\pi i\\xi\\cdot y}\\,dy\\right)e^{2\\pi i\\xi\\cdot x}\\,d\\xi.$$

To swap the order, we need $(y,\\xi) \\mapsto |f(y)e^{-2\\pi i\\xi\\cdot y}e^{2\\pi i\\xi\\cdot x}| = |f(y)|$ to be in $L^1(\\mathbb{R}^m_y \\times \\mathbb{R}^m_\\xi)$. But $|f(y)| \\notin L^1(\\mathbb{R}^m \\times \\mathbb{R}^m)$ in general (the $\\xi$-integral is infinite).`,

        content: `**Trick:** Insert the convergence factor $e^{-\\frac{\\pi}{k}|\\xi|^2}$ and use DCT:

$$\\int_{\\mathbb{R}^m}\\hat{f}(\\xi)\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi = \\lim_{k\\to\\infty}\\int_{\\mathbb{R}^m}\\hat{f}(\\xi)\\,e^{-\\frac{\\pi}{k}|\\xi|^2}\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi.$$

(Justified by DCT since $|\\hat{f}(\\xi)e^{-\\frac{\\pi}{k}|\\xi|^2}e^{2\\pi i\\xi\\cdot x}| \\leq |\\hat{f}(\\xi)| \\in L^1(\\mathbb{R}^m)$.)

**Applying Fubini** (now justified since the Gaussian factor decays fast enough):

$$\\int_{\\mathbb{R}^m}\\hat{f}(\\xi)\\,e^{-\\frac{\\pi}{k}|\\xi|^2}\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi = \\int_{\\mathbb{R}^m}\\left(\\int_{\\mathbb{R}^m}f(y)\\,e^{-2\\pi i\\xi\\cdot y}\\,dy\\right)e^{-\\frac{\\pi}{k}|\\xi|^2}\\,e^{2\\pi i\\xi\\cdot x}\\,d\\xi$$

$$= \\int_{\\mathbb{R}^m}f(y)\\underbrace{\\left(\\int_{\\mathbb{R}^m}e^{-\\frac{\\pi}{k}|\\xi|^2}\\,e^{-2\\pi i\\xi\\cdot(y-x)}\\,d\\xi\\right)}_{= \\mathcal{F}(e^{-\\frac{\\pi}{k}|\\cdot|^2})(y-x)}\\,dy.$$

$$= k^{m/2}\\int_{\\mathbb{R}^m}f(y)\\,e^{-k\\pi|y-x|^2}\\,dy.$$

$$k^{m/2}\\int_{\\mathbb{R}^m}f(y)\\,e^{-k\\pi|y-x|^2}\\,dy = \\int_{\\mathbb{R}^m}f\\!\\left(x+\\frac{z}{\\sqrt{k}}\\right)e^{-\\pi|z|^2}\\,dz \\xrightarrow{k\\to\\infty} f(x)\\int_{\\mathbb{R}^m}e^{-\\pi|z|^2}\\,dz = f(x).$$

(The last integral equals 1: $\\int_{\\mathbb{R}^m}e^{-\\pi|z|^2}dz = 1$ by the Gaussian computation above with $a=1/2$.) $\\quad\\square$`,

        content: `**Setting:** Let $D \\subseteq \\mathbb{C}$ be a **domain** (open and connected) and $f: D \\to \\mathbb{C}$.

**Definition:** $f$ is **holomorphic** in $D$ if the limit

$$f'(z_0) := \\lim_{z \\to z_0} \\frac{f(z)-f(z_0)}{z-z_0}$$

exists and is finite (in $\\mathbb{C}$) for every $z_0 \\in D$.

**This looks like the usual definition of differentiability — but it is much stronger.** The key point: the limit must be the same regardless of the *direction* from which $z \to z_0$ in $\\mathbb{C}$.

**Dimensional analysis:** A function $f = u + iv: D \to \mathbb{C}$ corresponds to $g = (u,v): \tilde{D} \to \mathbb{R}^2$ where $\tilde{D} = \{(x,y) \in \mathbb{R}^2 : x+iy \in D\}$. A real-differentiable $g$ has a Jacobian matrix:

$$J_g = \\begin{pmatrix} u_x & u_y \\\\ v_x & v_y \\end{pmatrix} \\quad \\text{(4 real degrees of freedom)}$$

A holomorphic $f$ only gives rise to $f'$ — **1 complex = 2 real degrees of freedom**. The 2 missing constraints are the **Cauchy-Riemann equations**.`,

        content: `**Theorem:** $f = u + iv$ is holomorphic in $D$ if and only if $(u,v)$ satisfies the **Cauchy-Riemann equations**:

$$\\begin{cases} \\partial_x u(x,y) = \\partial_y v(x,y) \\\\ \\partial_y u(x,y) = -\\partial_x v(x,y) \\end{cases} \\quad \\forall z = x+iy \\in D$$

- Real direction ($w = \\alpha \\to 0$): $f'(z) = \\partial_x u + i\\,\\partial_x v$
- Imaginary direction ($w = i\\beta \\to 0$): $f'(z) = \\partial_y v - i\\,\\partial_y u$

Equating real and imaginary parts gives the Cauchy-Riemann equations.

        content: `**Theorem (Cauchy):** Let $D \\subseteq \\mathbb{C}$ be a domain and $f: D \\to \\mathbb{C}$ holomorphic. Let $A \\subseteq D$ be a bounded open set whose boundary $\\partial A$ is described by a curve $\\gamma$ (or a finite union of curves), **positively oriented**. Then,

$$\\int_\\gamma f(z)\\,dz = 0$$

**Simply connected version:** If $D$ is **simply connected** (informally: "has no holes"), then for any two points $p, q \\in D$, the integral $\\int_\\gamma f(z)\\,dz$ along a path $\\gamma$ from $p$ to $q$ depends **only on $p$ and $q$**, not on the chosen path. In particular, for any closed curve $\\gamma$ in $D$:

$$\\int_\\gamma f(z)\\,dz = 0$$

> **Intuition:** Cauchy's theorem is the complex analog of the fact that a conservative vector field has path-independent line integrals. Holomorphicity is the "complex gradient condition."

**Laurent series:** Near each singularity $z_j$, $f$ can be expanded in a **Laurent series** (a power series allowing negative powers):

$$f(z) = \\sum_{m=-\\infty}^{+\\infty} a_m(z-z_j)^m \\quad \\forall z \\in B_r(z_j) \\setminus \\{z_j\\}$$

for some small $r > 0$ and coefficients $\\{a_m\\}_{m \\in \\mathbb{Z}} \\subset \\mathbb{C}$.

**Definition (Residue):** The coefficient $a_{-1}$ in the Laurent expansion of $f$ at $z_j$ is called the **residue of $f$ at $z_j$**:

$$a_{-1} = \\operatorname{Res}_f(z_j)$$

**Definition (Pole of order $m$):** $f$ has a **pole of order $m \\in \\mathbb{N}$** at $z_j$ if the Laurent coefficients $a_k$ vanish for all $k \\leq -m-1$, i.e.:

$$f(z) = \\sum_{k=-m}^{+\\infty} a_k(z-z_j)^k = a_{-m}(z-z_j)^{-m} + a_{-m+1}(z-z_j)^{-m+1} + \\cdots$$

with $a_{-m} \\neq 0$.`,

$$\\boxed{\\int_\\gamma f(z)\\,dz = 2\\pi i \\sum_{\\substack{j=1,\\ldots,N \\\\ z_j \\in A}} \\operatorname{Res}_f(z_j)}$$

**Proof sketch:** Take small disks $B_r(z_j)$ around each singularity inside $A$. The region $\\tilde{A} := A \\setminus \\bigcup_{z_j \\in A} \\overline{B_r(z_j)}$ has no singularities, so by Cauchy's theorem:

$$\\int_{\\partial\\tilde{A}} f\\,dz = 0 \\implies \\int_{\\partial A} f\\,dz = \\sum_{z_j \\in A}\\int_{\\partial^+ B_r(z_j)} f\\,dz$$

For each small circle, parametrize $\\gamma(\\theta) = z_j + re^{i\\theta}$, $\\theta \\in [0,2\\pi]$, $\\gamma'(\\theta) = ire^{i\\theta}$:

$$\\int_{\\partial^+ B_r(z_j)} f\\,dz = \\sum_{m=-\\infty}^{+\\infty} a_m \\int_0^{2\\pi} (re^{i\\theta})^m\\cdot ire^{i\\theta}\\,d\\theta = \\sum_{m=-\\infty}^{+\\infty} a_m\\,i\\,r^{m+1}\\int_0^{2\\pi} e^{i(m+1)\\theta}\\,d\\theta$$

        content: `**Setup:** Find $w = x + iy$ with $x, y \\in \\mathbb{R}$ such that $w^2 = 3 + 4i$.

$$3 + 4i = w^2 = (x+iy)^2 = x^2 - y^2 + 2ixy$$

Equating real and imaginary parts:

$$\\left\\{\\begin{array}{l} x^2 - y^2 = 3 \\\\ xy = 2 \\end{array}\\right.$$

**Adding a third equation (theoretically redundant, but practically helpful)** by taking modulus in $3+4i = w^2$:

$$5 = \\sqrt{9+16} = |3+4i| = |w^2| = |w|^2 = x^2 + y^2$$

        content: `**Reverse Triangle Inequality:**

$$|z + w| \\geq \\bigl||z| - |w|\\bigr|$$

**Proof:** By the standard triangle inequality:

$$|z| = |(z+w) - w| \\leq |z+w| + |-w| = |z+w| + |w|$$

So $|z+w| \\geq |z| - |w|$.

Switching the roles of $z$ and $w$, we also get $|z+w| \\geq |w| - |z|$.

Combining: $|z+w| \\geq ||z| - |w||$. $\\square$

> **Application:** To bound $|f(z)| = \\frac{1}{|1+z^4|}$ on a large semicircle $|z| = R$, we use: $|1 + z^4| \\geq |z^4| - |1| = R^4 - 1 \\geq \\frac{R^4}{2}$ for $R \\geq 2$. This gives $|f(z)| \\leq \\frac{2}{R^4}$, which decays fast enough.`,

i) If $f$ is **even**, then $\\hat{f}$ is **even**.

ii) If $f$ is **odd**, then $\\hat{f}$ is **odd**.

iii) If $f$ is **real-valued and even**, then $\\hat{f}$ is **real-valued** (and even).

iv) If $f$ is **real-valued and odd**, then $\\hat{f}$ has **purely imaginary values**, i.e., $\\hat{f}(\\xi) \\in i\\mathbb{R}$ for all $\\xi \\in \\mathbb{R}$ (and $\\hat{f}$ is odd).

> **Application:** For $f(x) = \\frac{1}{(x^2+1)^2}$ (real-valued, even), we conclude $\\hat{f}$ is real-valued and even — so we only need to compute it for $\\xi \\leq 0$ and then use $\\hat{f}(\\xi) = \\hat{f}(|\\xi|)$.`,

        content: `**Proof of i) & ii):** Suppose $f(-x) = \\pm f(x)$ for a.e. $x \\in \\mathbb{R}$ (with "$+$" for even, "$-$" for odd). Then, for $\\xi \\in \\mathbb{R}$:

$$\\hat{f}(-\\xi) = \\int_{\\mathbb{R}} f(x)\\,e^{-2\\pi i(-\\xi)x}\\,dx = \\int_{\\mathbb{R}} f(x)\\,e^{2\\pi i\\xi x}\\,dx$$

Substitute $y = -x$:

$$= \\int_{\\mathbb{R}} f(-y)\\,e^{-2\\pi i\\xi y}\\,dy = \\pm\\int_{\\mathbb{R}} f(y)\\,e^{-2\\pi i\\xi y}\\,dy = \\pm\\hat{f}(\\xi)$$

        content: `**Proof of iii) & iv):** Suppose $f$ is real-valued and either even or odd (i.e., $f(-x) = \\pm f(x)$). Then:

$$\\overline{\\hat{f}(\\xi)} = \\overline{\\int_{\\mathbb{R}} f(x)\\,e^{-2\\pi i\\xi x}\\,dx} = \\int_{\\mathbb{R}} \\overline{f(x)\\,e^{-2\\pi i\\xi x}}\\,dx$$

Since $f$ is real-valued ($\\overline{f(x)} = f(x)$) and $\\overline{e^{-2\\pi i\\xi x}} = e^{2\\pi i\\xi x}$:

$$= \\int_{\\mathbb{R}} f(x)\\,e^{2\\pi i\\xi x}\\,dx = \\int_{\\mathbb{R}} f(x)\\,e^{-2\\pi i(-\\xi)x}\\,dx = \\hat{f}(-\\xi)$$

By i) & ii), $\\hat{f}(-\\xi) = \\pm\\hat{f}(\\xi)$. So $\\overline{\\hat{f}(\\xi)} = \\pm\\hat{f}(\\xi)$.

- If $f$ is even: $\\overline{\\hat{f}(\\xi)} = \\hat{f}(\\xi)$ → $\\hat{f}(\\xi) \\in \\mathbb{R}$.
- If $f$ is odd: $\\overline{\\hat{f}(\\xi)} = -\\hat{f}(\\xi)$ → $\\hat{f}(\\xi) \\in i\\mathbb{R}$. $\\square$

        title: "Jordan's Lemma: statement and proof",
        content: `**Key inequality:** For all $\\theta \\in \\left[0, \\frac{\\pi}{2}\\right]$:

$$\\sin\\theta \\geq \\frac{2}{\\pi}\\theta$$

**Proof:** The function $h(\\theta) = \\sin\\theta - \\frac{2}{\\pi}\\theta$ satisfies $h(0) = h(\\pi/2) = 0$ and $h''(\\theta) = -\\sin\\theta \\leq 0$, so $h$ is concave and therefore $\\geq 0$ on $[0,\\pi/2]$. $\\square$

**Jordan's Lemma (consequence):** For $\\xi < 0$ (i.e., $|\\xi|>0$) and $R > 0$:

$$\\int_0^\\pi e^{2\\pi\\xi R\\sin\\theta}\\,d\\theta = \\int_0^\\pi e^{-2\\pi|\\xi|R\\sin\\theta}\\,d\\theta \\leq \\frac{1}{2|\\xi|R}$$

**Proof:** By symmetry $\\sin(\\pi-\\theta) = \\sin\\theta$, the integral splits into $2\\int_0^{\\pi/2}$. Using $\\sin\\theta \\geq \\frac{2\\theta}{\\pi}$:

$$2\\int_0^{\\pi/2} e^{-2\\pi|\\xi|R\\sin\\theta}\\,d\\theta \\leq 2\\int_0^{\\pi/2} e^{-\\frac{4|\\xi|R\\theta}{1}}\\,d\\theta = \\frac{2}{4|\\xi|R}\\left(1-e^{-2\\pi|\\xi|R}\\right) \\leq \\frac{1}{2|\\xi|R} \\quad \\square$$

2. The solution is *unique*

The naive least squares solution is typically **unstable**: it tries to fit the noise, producing a solution with huge, oscillating values (infinite energy).

Find the minimum of ε²(f; g^δ) = ‖Af − g^δ‖² subject to ‖f‖² ≤ E².

**Via Lagrange Multipliers,** this constrained problem is equivalent to minimizing the **Tikhonov functional:**

Φ_μ(f) = ‖Af − g^δ‖² + μ‖f‖²

where μ > 0 is the **regularization parameter** (Lagrange multiplier). We seek:

Minimizing pointwise at each frequency ω, we complete the square and find:

L(f̂) = (|K̂|² + μ) |f̂ − K̂*ĝ^δ/(|K̂|² + μ)|² + constant

The minimum is achieved at:

**f̂_μ(ω) = K̂*(ω) / (|K̂(ω)|² + μ) · ĝ^δ(ω)**

This is the **Tikhonov Filter** (valid for all ω ∈ ℝ²).

**Why K̂* instead of K̂?** Because the adjoint operator A* of convolution with K is convolution with K* = K̄(−x) (time-reversed, complex-conjugate kernel). In the frequency domain, the adjoint's transfer function is K̂*(ω) = K̂(−ω) = K̂(ω) for real symmetric PSFs.

function buildPicker() {

// ─── Markdown renderer ───────────────────────────────────────────────────────
function renderMarkdown(text, topicColor) {
  if (!text) return "";
  const lines = text.split("\n");
  let html = "";
  let inTable = false;
  let tableRows = [];

  const flushTable = () => {
    if (tableRows.length > 0) {
      html += `<table>`;
      tableRows.forEach((row, ri) => {
        html += `<tr>`;
        row.forEach(cell => {
          html += `<td style="border:1px solid #1e3a50;padding:6px 14px;color:${ri===0?'#e0ecfa':'#8bbcd8'};background:${ri===0?'#132d44':'transparent'};font-weight:${ri===0?'bold':'normal'};font-size:14px">${cell}</td>`;
        });
        html += `</tr>`;
      });
      html += `</table>`;
      tableRows = [];
    }
    inTable = false;
  };

  lines.forEach(line => {
    if (line.startsWith("|")) {
      inTable = true;
      const cells = line.split("|").map(c => c.trim()).filter(Boolean);
      if (!cells.every(c => /^-+$/.test(c))) tableRows.push(cells);
      return;
    }
    if (inTable) flushTable();
    line = line
      .replace(/\*\*(.*?)\*\*/g, "<strong style='color:#cce6ff'>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em style='color:#9ac5e8'>$1</em>")
      .replace(/`(.*?)`/g, "<code style='background:#0d2233;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:0.87em;color:#a8d8ea'>$1</code>");
    if (line.startsWith("> ⚠️") || line.startsWith(">")) {
      html += `<blockquote style="border-left:3px solid ${topicColor||'#888'};padding:10px 14px;margin:10px 0;color:#ffd180;font-style:italic;background:#0f1e2b;border-radius:0 6px 6px 0">${line.replace(/^>\s?/, "")}</blockquote>`;
    } else if (/^\d+\.\s/.test(line)) {
      html += `<div style="display:flex;gap:10px;margin:6px 0;color:#b8d8ee"><span style="color:#6a9dbf;min-width:20px">${line.match(/^\d+/)[0]}.</span><span>${line.replace(/^\d+\.\s/, "")}</span></div>`;
    } else if (line.startsWith("- ") || line.startsWith("• ")) {
      html += `<li style="margin-left:20px;margin-bottom:5px;color:#b8d8ee">${line.slice(2)}</li>`;
    } else if (line.trim() === "") {
      html += `<br>`;
    } else {
      html += `<p style="margin:5px 0;color:#b8cfe8;line-height:1.8">${line}</p>`;
    }
  });
  if (inTable) flushTable();
  return html;
}

            <span style="font-size:11px;padding:2px 10px;border-radius:20px;background:${diffBg[ex.difficulty]||'#111'};color:${diffColor[ex.difficulty]||'#888'};border:1px solid ${diffColor[ex.difficulty]||'#888'}33">${ex.difficulty||''}</span>
          </div>
          <p style="font-size:13px;color:#5a7a96;line-height:1.5">${(ex.statement||'').replace(/\*\*(.*?)\*\*/g,'<strong style="color:#8bbcd8">$1</strong>').split('\n')[0]}</p>
        </div>`;
      });
      html += `</div>`;
    } else {
      const ex = exercises[activeExercise];
      html += `<div style="max-width:760px;margin:0 auto;padding:32px 24px">
        <button onclick="closeExercise()" style="padding:6px 14px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px;margin-bottom:22px">← Back to list</button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
          <h2 style="font-size:18px;color:#e8f0f8">${ex.title}</h2>
          <span style="font-size:11px;padding:2px 10px;border-radius:20px;background:${diffBg[ex.difficulty]||'#111'};color:${diffColor[ex.difficulty]||'#888'};border:1px solid ${diffColor[ex.difficulty]||'#888'}44">${ex.difficulty||''}</span>
        </div>
        <div style="background:#0d1825;border:1px solid #1a3048;border-radius:10px;padding:20px 24px;margin-bottom:14px">
          <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#2980b9;margin-bottom:10px">📋 Statement</div>
          <div style="line-height:1.85">${renderMarkdown(ex.statement||'', "#2980b9")}</div>
        </div>
        <div style="margin-bottom:12px">
          <button onclick="toggleHint()" style="padding:7px 18px;background:${showHint?'#0f2218':'#111e2d'};border:1px solid ${showHint?'#1e5c34':'#1a3048'};border-radius:7px;color:${showHint?'#27ae60':'#7a9bb8'};cursor:pointer;font-size:13px">${showHint?'🔼 Hide Hint':'💡 Show Hint'}</button>
        </div>
        ${showHint?`<div style="background:#0a1e12;border:1px solid #1e5c34;border-radius:10px;padding:16px 20px;margin-bottom:14px;color:#8fe0b0;font-style:italic">${renderMarkdown(ex.hint||'', "#27ae60")}</div>`:''}
        <div style="margin-bottom:12px">
          <button onclick="toggleSolution()" style="padding:7px 18px;background:${showSolution?'#1e1200':'#111e2d'};border:1px solid ${showSolution?'#c0732b':'#1a3048'};border-radius:7px;color:${showSolution?'#e09040':'#7a9bb8'};cursor:pointer;font-size:13px">${showSolution?'🔼 Hide Solution':'✅ Show Solution'}</button>
        </div>
        ${showSolution?`<div style="background:#0f1510;border:1px solid #2a4020;border-radius:10px;padding:20px 24px;margin-bottom:14px">
          <div style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#f39c12;margin-bottom:10px">✅ Solution</div>
          <div style="line-height:1.9">${renderMarkdown(ex.solution||'', "#27ae60")}</div>
        </div>`:''}
        <div style="display:flex;gap:12px;margin-top:24px">
          ${activeExercise>0?`<button onclick="openExercise(${activeExercise-1})" style="padding:8px 20px;background:#111e2d;border:1px solid #1a3048;border-radius:7px;color:#5a7a96;cursor:pointer;font-size:13px">← Previous</button>`:''}
          ${activeExercise<exercises.length-1?`<button onclick="openExercise(${activeExercise+1})" style="padding:8px 20px;background:#2980b9;border:none;border-radius:7px;color:#fff;cursor:pointer;font-size:13px;font-weight:bold">Next →</button>`:''}
        </div>
      </div>`;
    }
  }

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
  if (window.MathJax) MathJax.typesetPromise([document.getElementById('app')]);
}

// ─── Event handlers ───────────────────────────────────────────────────────────
function switchTab(tab) { activeTab=tab; activeExercise=null; showSolution=false; showHint=false; render(); }
function selectTopic(id) { activeTopic=id; activeSection=0; render(); }
function selectSection(i) { activeSection=i; render(); if(window.MathJax) MathJax.typesetPromise([document.getElementById('app')]); }
function flipCard() { flipped=!flipped; render(); }
function prevCard() { cardIndex=(cardIndex-1+flashcards.length)%flashcards.length; flipped=false; render(); }
function nextCard() { cardIndex=(cardIndex+1)%flashcards.length; flipped=false; render(); }
function goToCard(i) { cardIndex=i; flipped=false; render(); }
function openExercise(i) { activeExercise=i; showSolution=false; showHint=false; render(); }
function closeExercise() { activeExercise=null; showSolution=false; showHint=false; render(); }
function toggleSolution() { showSolution=!showSolution; render(); }
function toggleHint() { showHint=!showHint; render(); }

// ─── Init ─────────────────────────────────────────────────────────────────────
buildPicker();
</script>
</body>
</html>
